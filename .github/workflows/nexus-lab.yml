name: Nexus Lab checks
on:
  pull_request:
    paths:
      - 'api/nexus-lab.js'
      - 'lib/nexusLab.js'
      - 'lib/nexusLabAssets.js'
      - 'lib/adMedia.js'
      - 'public/nexus-lab.js'
      - 'public/nexus-lab-assets.js'
      - 'public/nexus-messages.js'
      - 'public/workspace-views.js'
      - 'public/workspace.html'
      - 'test/nexus-lab.test.mjs'
      - 'test/nexus-lab-assets.test.mjs'
      - 'e2e/nexus-lab.spec.mjs'
      - 'e2e/nexus-lab-assets.spec.mjs'
      - '.github/workflows/nexus-lab.yml'
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/nexus-lab.test.mjs test/nexus-lab-assets.test.mjs test/ad-media.test.mjs test/owner-capabilities.test.mjs test/nexus-navigation.test.mjs test/nex-navigation-scope.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/nexus-lab.spec.mjs e2e/nexus-lab-assets.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nexus-lab-browser-results
          path: test-results/
