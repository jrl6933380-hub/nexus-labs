name: Accessibility & mobile checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --directory public > /tmp/nexus-labs-http.log 2>&1 &
      - run: npx playwright test e2e/accessibility.spec.mjs
