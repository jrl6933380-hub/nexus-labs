name: Board social workspace
on:
  pull_request:
    paths:
      - '.github/workflows/board-social-workspace.yml'
      - 'public/board*'
      - 'public/social-post-flow*'
      - 'lib/nexusLabBoards.js'
      - 'lib/visualBoardTools.js'
      - 'lib/workspaceBoard.js'
      - 'lib/workspaceConnector.js'
      - 'test/board-social-workspace.test.mjs'
      - 'test/board-post-flow.test.mjs'
      - 'e2e/board-post-flow.spec.mjs'
      - 'e2e/board-social-workspace.spec.mjs'
      - 'e2e/social-post-flow.spec.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/board-social-workspace.yml'
      - 'public/board*'
      - 'public/social-post-flow*'
      - 'lib/nexusLabBoards.js'
      - 'lib/visualBoardTools.js'
      - 'lib/workspaceBoard.js'
      - 'lib/workspaceConnector.js'
      - 'test/board-social-workspace.test.mjs'
      - 'test/board-post-flow.test.mjs'
      - 'e2e/board-post-flow.spec.mjs'
      - 'e2e/board-social-workspace.spec.mjs'
      - 'e2e/social-post-flow.spec.mjs'
permissions:
  contents: read
jobs:
  board-social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node --test test/board-post-flow.test.mjs test/board-social-workspace.test.mjs test/nexus-lab-boards.test.mjs test/board-phone-tab.test.mjs test/social-post-flow.test.mjs
      - run: npx playwright test e2e/board-post-flow.spec.mjs e2e/board-social-workspace.spec.mjs e2e/social-post-flow.spec.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: board-social-results
          path: test-results/
