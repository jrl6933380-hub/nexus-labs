name: Test browser template

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm i --no-save --ignore-scripts --no-audit --no-fund e2b@^1 zod@^3
      - name: Run the live browser engine against real E2B
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          NEXUS_CREDENTIAL_ENC_KEY: e2e-test-key-not-a-secret
        run: node scripts/e2e-live-browser.mjs
