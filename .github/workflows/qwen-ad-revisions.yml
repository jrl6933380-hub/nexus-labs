name: Qwen Ally Ad Review Revisions
on:
  pull_request:
    paths:
      - 'api/ally-ad-review.js'
      - 'lib/allyAdReviewQueue.js'
      - 'scripts/ally/**'
      - 'public/ally-ad-review.html'
      - 'test/ally-ad-review-queue.test.mjs'
      - 'test/ally-ad-revision.test.mjs'
      - 'test/approved-ad-board-handoff.test.mjs'
      - 'tests/ally/qwen-ad-macro.test.mjs'
      - 'test/ally-qwen-console.test.mjs'
      - '.github/workflows/qwen-ad-revisions.yml'
  push:
    branches: ['feat/qwen-phone-ad-auto-revisions-20261103']
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check api/ally-ad-review.js
          node --check lib/allyAdReviewQueue.js
          node --check scripts/ally/qwen-revision-watcher.mjs
          node --check scripts/ally/qwen-console.mjs
          node --check scripts/ally/approved-board-watcher.mjs
          node --check test/approved-ad-board-handoff.test.mjs
          node --check test/ally-ad-revision.test.mjs
      - name: Run targeted regression tests
        run: node --test test/ally-ad-review-queue.test.mjs test/ally-ad-revision.test.mjs test/approved-ad-board-handoff.test.mjs test/ally-qwen-console.test.mjs test/ally-bridge.test.mjs tests/ally/qwen-ad-macro.test.mjs test/ally-qwen-terminal.test.mjs

  powershell-syntax:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse Ally PowerShell scripts without executing them
        shell: pwsh
        run: |
          $paths = @('scripts/ally/install-qwen-console.ps1', 'scripts/ally/submit-ad-review.ps1', 'scripts/ally/revision-transport.ps1', 'scripts/ally/approved-board-transport.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errorsFound = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errorsFound)
            if ($errorsFound.Count -gt 0) { throw ("PowerShell syntax failed for "+$path+": "+($errorsFound | Out-String)) }
            Write-Output ("PARSE_OK "+$path)
          }
