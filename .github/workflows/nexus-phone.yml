name: Nexus Phone checks
on:
  pull_request:
    paths:
      - 'android/phone/**'
      - 'scripts/*phone*'
      - 'lib/phoneBridge.js'
      - 'lib/phoneFeedback.js'
      - 'api/phone.js'
      - 'lib/workspaceBoard.js'
      - 'public/phone*'
      - 'public/nexus-phone.js'
      - 'public/nexus-messages.js'
      - 'public/workspace-views.js'
      - 'public/downloads/nexus-phone*'
      - 'test/phone*'
      - '.github/workflows/nexus-phone.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-and-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/phone-feedback.test.mjs test/phone-bridge.test.mjs test/phone-provisioning.test.mjs test/phone-shortcuts-release.test.mjs test/phone-navigation.test.mjs test/workspace-board-resource.test.mjs test/workspace-connector.test.mjs test/workspace-oauth.test.mjs test/workspace-customer-oauth.test.mjs
      - run: NEXUS_TEST_BROWSER_PATH=/usr/bin/google-chrome node scripts/verify-phone-bridge.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-phone-browser
          path: test-results/phone/
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXUS_PHONE_KEY_PASSWORD: ${{ secrets.NEXUS_PHONE_PLAYGROUND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Restore signing identity
        env:
          KEYSTORE_B64: ${{ secrets.NEXUS_PHONE_PLAYGROUND_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          mkdir -p android/phone/build
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/phone/build/playground.keystore
          chmod 600 android/phone/build/playground.keystore
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash scripts/build-phone.sh && bash scripts/build-phone-tests.sh
      - name: Verify update signing identity
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs public/downloads/nexus-phone-0.2.apk | sed -n '/Signer #1 certificate SHA-256 digest:/p' > /tmp/old-signer
          "$BT/apksigner" verify --print-certs android/phone/build/nexus-phone-0.3.apk | sed -n '/Signer #1 certificate SHA-256 digest:/p' > /tmp/new-signer
          test -s /tmp/old-signer
          diff /tmp/old-signer /tmp/new-signer
          cmp public/downloads/nexus-phone-0.3.apk android/phone/build/nexus-phone-0.3.apk
      - name: Verify native operation policy
        run: |
          mkdir -p /tmp/nexus-policy
          javac -encoding UTF-8 -d /tmp/nexus-policy android/phone/app/src/main/java/app/nexus/phone/PlaygroundPolicy.java android/phone/test/PlaygroundPolicyTest.java
          java -cp /tmp/nexus-policy PlaygroundPolicyTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/verify-phone-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-phone-native
          path: |
            test-results/phone/
            android/phone/build/nexus-phone-0.3.apk
      - name: Remove signing material
        if: always()
        run: rm -f android/phone/build/playground.keystore
