name: Render worker
# Renders ads that agents or the board queued (lib/adRenderJobs.js). Starts on demand when a render is queued (lib/adRenderDispatch.js), plus every 15 minutes as a backup.
# Jobs that waited more than an hour are expired, never rendered, so an old backlog cannot flood a run.
# Needs one repository secret: NEXUS_DATABASE_URL (the same Postgres store the app uses). Value is never printed.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: render-worker
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secret
        id: gate
        env:
          NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
        run: |
          if [ -z "$NEXUS_DATABASE_URL" ]; then echo "NEXUS_DATABASE_URL is not set; nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        # npm install, not npm ci: package.json lists pg but package-lock.json does not, so npm ci refuses to run.
        # Playwright is imported by the exporter but is not a project dependency, so it is installed here.
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
      - if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-liberation
          # Use the exact playwright that was just installed (the exporter imports it), and install both browser builds it may launch.
          node_modules/.bin/playwright --version
          node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell
          echo "::notice title=Playwright browsers::$(node_modules/.bin/playwright --version) | $(ls ~/.cache/ms-playwright | tr '\n' ' ')"
      - name: Check database connection
        if: steps.gate.outputs.run == 'true'
        env:
          NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
        run: |
          node scripts/render-worker-diagnose.mjs | while read -r line; do echo "::notice title=Render worker database check::$line"; done
      - name: Work the queue
        if: steps.gate.outputs.run == 'true'
        env:
          NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(node scripts/render-worker.mjs --once --worker-id "gha-${GITHUB_RUN_ID}-$i" 2>&1) || {
              # Surface the failure as a readable annotation (database addresses are masked before printing).
              msg=$(echo "$out" | tail -6 | sed -E 's#postgres(ql)?://[^[:space:]]+#[db-url]#g' | tr '\n' ' ' | cut -c1-600)
              echo "::error title=Render worker failed::$msg"
              exit 1
            }
            echo "$out" | tail -3
            [ -z "$out" ] && break
          done
