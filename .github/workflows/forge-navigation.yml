name: Forge navigation
on:
  pull_request:
    paths:
      - 'public/forge-*.html'
      - 'e2e/forge-navigation.spec.mjs'
      - '.github/workflows/forge-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'public/forge-*.html'
      - 'e2e/forge-navigation.spec.mjs'
      - '.github/workflows/forge-navigation.yml'
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/forge-navigation.spec.mjs
