<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge — Find leads</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14100b;color:#f2e9dd;font:16px/1.5 system-ui,sans-serif;padding:20px 16px 60px}main{max-width:640px;margin:0 auto}h1{font-size:1.5rem;margin:0 0 4px}p.sub{color:#c9bca9;margin:0 0 18px}
form{display:grid;gap:12px;margin-bottom:18px}label{display:grid;gap:6px;font-weight:600;font-size:.9rem}input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #6a5238;background:#1f1912;color:#f2e9dd;min-height:48px}
button{font:700 1rem system-ui;min-height:48px;border-radius:10px;border:0;background:#e0b04a;color:#1a1204;padding:0 18px}button[disabled]{opacity:.6}
.card{background:#1f1912;border:1px solid #493726;border-radius:12px;padding:16px;margin-bottom:12px}.card h2{font-size:1.1rem;margin:0 0 6px}.card p{margin:4px 0;color:#d8cbb8}
.chip{display:inline-block;font:700 .72rem system-ui;letter-spacing:.06em;padding:4px 8px;border-radius:999px;margin-bottom:8px}.s0{background:#1f6b45;color:#fff}.s1{background:#8a5a00;color:#fff}.s2{background:#4a4a52;color:#fff}.s3{background:#7a2a2a;color:#fff}
pre.pitch{white-space:pre-wrap;word-break:break-word;background:#14100b;border:1px solid #493726;border-radius:10px;padding:12px;font:.85rem/1.5 system-ui,sans-serif;margin:10px 0 0}.note{font-weight:600}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.chips button{min-height:40px;padding:0 12px;font-weight:600;background:#2a2218;color:#f2e9dd;border:1px solid #6a5238}.chips button[aria-pressed="true"]{background:#e0b04a;color:#1a1204}
a{color:#e0b04a}#msg{min-height:1.5em;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Find leads</h1>
<p class="sub">Searches Google Places for businesses and flags the ones with no website. Searching is read-only. Build saves the lead to Forge → Leads. Nothing is ever sent.</p>
<p class="sub">Tap to fill in a search, then press Search.</p><div id="tr" class="chips" aria-label="Business types"></div><div id="ci" class="chips" aria-label="Iowa cities"></div>
<form id="f"><label>Business type<input id="b" value="barber" maxlength="100" required></label><label>City<input id="c" value="Des Moines, Iowa" maxlength="100" required></label><label>Search with<select id="src"><option value="google" selected>Google (fast, uses your Google credit)</option><option value="ally">Ally (free, slower)</option></select></label><label>How many<select id="n"><option>5</option><option selected>10</option></select></label><button id="go" type="submit">Search</button></form>
<p id="msg" role="status" aria-live="polite"></p>
<div id="out"></div>
<p class="sub"><a href="/forge-leads.html">Open Forge Leads</a> to follow Ally searches and builds.</p>
</main>
<script type="module" src="/forge-places.js"></script>
</body></html>
