<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nexus Owner Access</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#070b12; color:#edf7ff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 15%,#102944 0,#070b12 45%); }
    main { width:min(100%,420px); border:1px solid #24435e; border-radius:20px; padding:30px; background:rgba(8,16,27,.94); box-shadow:0 24px 80px #0009; }
    .mark { width:46px; height:46px; border-radius:50%; margin-bottom:18px; background:#5de7ff; box-shadow:0 0 32px #5de7ff88, inset 0 0 0 12px #12283a; }
    h1 { margin:0 0 8px; font-size:1.65rem; }
    p { margin:0 0 24px; color:#9eb3c4; line-height:1.5; }
    label { display:block; margin-bottom:8px; color:#cce9f5; font-size:.9rem; }
    input { width:100%; padding:13px 14px; border-radius:10px; border:1px solid #35536b; background:#07111d; color:#fff; font:inherit; }
    input:focus { outline:2px solid #5de7ff; outline-offset:2px; }
    button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:10px; background:#5de7ff; color:#06101a; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { min-height:22px; margin:14px 0 0; color:#ffb0a8; font-size:.9rem; }
    .private { margin-top:22px; padding-top:18px; border-top:1px solid #1c3448; font-size:.82rem; color:#71889a; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1 id="title">Nexus owner access</h1>
    <p id="intro">Open your private launch station. This access is separate from every Forge account.</p>
    <form id="form">
      <label id="credential-label" for="password">Nexus password</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" required autofocus>
      <div id="confirm-wrap" hidden>
        <label for="confirm" style="margin-top:14px">Confirm password</label>
        <input id="confirm" name="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password">
      </div>
      <button id="submit" type="submit">Open Nexus</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <button id="password-option" type="button" hidden>Use Nexus password instead</button>
    <div class="private">Your four-digit code works only on a device you have trusted. Forge customers use their own sign-in.</div>
  </main>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const setupTicket = params.get('setup') || '';
    const pinSetup = params.get('pin-setup') === '1';
    const requestedNext = params.get('next') || '/';
    const next = requestedNext.startsWith('/') && !requestedNext.startsWith('//') && !requestedNext.startsWith('/nexus-login.html') ? requestedNext : '/';
    if (setupTicket) history.replaceState(null, '', '/nexus-login.html');

    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const confirmWrap = document.getElementById('confirm-wrap');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    const label = document.getElementById('credential-label');
    const passwordOption = document.getElementById('password-option');
    const isSetup = Boolean(setupTicket);
    let mode = isSetup ? 'setup' : pinSetup ? 'set_pin' : 'login';

    function showMode(value) {
      mode = value;
      const codeMode = mode === 'pin_login' || mode === 'set_pin';
      document.getElementById('title').textContent = mode === 'set_pin' ? 'Choose your Nexus code' : mode === 'pin_login' ? 'Open Nexus' : mode === 'setup' ? 'Create your Nexus password' : 'Nexus owner access';
      document.getElementById('intro').textContent = mode === 'set_pin'
        ? 'Choose four digits for quick access on this device. Keep your Nexus password for recovery on a new device.'
        : mode === 'pin_login' ? 'Enter your four-digit code to open your private workspace.'
        : 'Sign in to your private launch station. This password is separate from every Forge account.';
      label.textContent = codeMode ? 'Four-digit Nexus code' : 'Nexus password';
      password.value = '';
      password.inputMode = codeMode ? 'numeric' : 'text';
      password.setAttribute('pattern', codeMode ? '[0-9]{4}' : '.{12,256}');
      password.minLength = codeMode ? 4 : 12;
      password.maxLength = codeMode ? 4 : 256;
      password.autocomplete = codeMode ? 'one-time-code' : mode === 'setup' ? 'new-password' : 'current-password';
      confirmWrap.hidden = mode !== 'setup';
      confirm.required = mode === 'setup';
      passwordOption.hidden = mode !== 'pin_login';
      submit.textContent = mode === 'set_pin' ? 'Save code and open Nexus' : mode === 'setup' ? 'Set password and open Nexus' : 'Open Nexus';
      password.focus();
    }

    if (isSetup) {
      showMode('setup');
    } else if (pinSetup) {
      fetch('/api/nexus-auth', { credentials:'include', cache:'no-store' }).then((response) => {
        if (!response.ok) location.replace('/nexus-login.html?next=%2Fworkspace.html');
        else showMode('set_pin');
      }).catch(() => { status.textContent = 'Could not check your Nexus session.'; });
    } else {
      fetch('/api/nexus-auth', { credentials:'include', cache:'no-store' }).then(async (response) => {
        if (response.ok) { location.replace(next); return; }
        const data = await response.json().catch(() => ({}));
        if (data.pinAvailable) showMode('pin_login');
      }).catch(() => {});
    }
    passwordOption.onclick = () => showMode('login');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      if (mode === 'setup' && password.value !== confirm.value) { status.textContent = 'Those passwords do not match.'; return; }
      submit.disabled = true;
      try {
        const response = await fetch('/api/nexus-auth', {
          method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ action:mode, password:mode === 'login' || mode === 'setup' ? password.value : undefined,
            pin:mode === 'pin_login' || mode === 'set_pin' ? password.value : undefined, ticket:setupTicket }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not sign in.');
        if ((mode === 'login' || mode === 'setup') && !data.pinAvailable) {
          showMode('set_pin');
          return;
        }
        location.replace(next);
      } catch (error) {
        status.textContent = error.message;
        submit.disabled = false;
        password.select();
      }
    });
  </script>
</body>
</html>
