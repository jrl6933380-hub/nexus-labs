<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nexus // Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; }
  .notes-panel { padding: 14px; font: 13px/1.5 Inter, -apple-system, sans-serif; color: #e8eefb; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .notes-panel textarea {
    width: 100%; flex: 1; resize: none; border: none; outline: none;
    background: transparent; color: #e8eefb; font: 13px/1.6 Inter, -apple-system, sans-serif;
  }
  .section-status { flex: 0 0 auto; min-height: 14px; color: #5e6b81; font: 500 10px 'JetBrains Mono', monospace; }
  .section-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; }
  .ask-nex-btn {
    flex: 0 0 auto; background: #4b8dff14; border: 1px solid #4b8dff55; color: #58d7ff;
    border-radius: 8px; padding: 7px 11px; font: 700 10px 'JetBrains Mono', monospace;
    letter-spacing: 0.03em; cursor: pointer;
  }
  .ask-nex-btn:hover { background: #4b8dff2e; }
  #add-section-btn {
    position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 10000;
    background: #4b8dff18; border: 1px solid #4b8dff77; color: #58d7ff; border-radius: 10px;
    padding: 11px 16px; font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.04em;
    backdrop-filter: blur(12px); cursor: pointer;
  }
  .canvas-title-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10000;
    font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
    color: #58d7ff; background: #111827e8; border: 1px solid #3c5a84; border-radius: 8px;
    padding: 7px 16px; backdrop-filter: blur(12px);
  }
  .return-link {
    position: fixed; top: 12px; left: 12px; z-index: 10000;
    font: 700 10px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
    color: #91a0b9; text-decoration: none; background: #111827e8; border: 1px solid #26334d;
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(12px);
  }
  .return-link:hover { color: #58d7ff; border-color: #4b8dff77; }
  #nexus-canvas-backdrop-control {
    position: fixed; left: 12px; bottom: 12px; z-index: 10000; z-index: 10000;
    background: #111827e8; border: 1px solid #3c5a84; border-radius: 10px; padding: 0;
    backdrop-filter: blur(12px); box-shadow: 0 16px 40px #000a; font: 12px Inter, sans-serif;
  }
  #nexus-canvas-backdrop-control-summary {
    list-style: none; cursor: pointer; color: #8b9ac4; padding: 8px 12px;
    font: 600 11px 'JetBrains Mono', monospace; user-select: none; display: flex; align-items: center; gap: 6px;
  }
  #nexus-canvas-backdrop-control-summary::marker { display: none; }
  #nexus-canvas-backdrop-control-summary::before { content: '◐'; color: #58d7ff; }
  #nexus-canvas-backdrop-control[open] #nexus-canvas-backdrop-control-summary {
    border-bottom: 1px solid #26334d; color: #e8eefb;
  }
  .nexus-appearance-fields { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  #nexus-canvas-backdrop-control input[type="url"],
  #nexus-canvas-backdrop-control input[type="file"] {
    box-sizing: border-box; width: 100%; background: #ffffff08; border: 1px solid #26334d; border-radius: 6px;
    color: #e8eefb; padding: 6px 9px; font: 11px 'JetBrains Mono', monospace;
  }
  #nexus-canvas-backdrop-control input[type="file"]::file-selector-button {
    background: #4b8dff18; border: 1px solid #4b8dff77; color: #58d7ff; border-radius: 4px;
    padding: 4px 8px; font: 700 9px 'JetBrains Mono', monospace; cursor: pointer; margin-right: 8px;
  }
  #nexus-canvas-backdrop-control input::placeholder { color: #5e6b81; }
  #nexus-canvas-backdrop-control button {
    background: #4b8dff18; border: 1px solid #4b8dff77; color: #58d7ff; border-radius: 6px;
    padding: 5px 10px; font: 700 9px 'JetBrains Mono', monospace; text-transform: uppercase;
    letter-spacing: 0.06em; cursor: pointer; align-self: flex-start;
  }
  #nexus-canvas-backdrop-control button:hover { background: #4b8dff32; }
</style>
</head>
<body>
<script type="module">
  import '/browser-error-reporter.js?v=20260913-1';
  import { mountCanvas } from '/canvas-engine.js?v=20260913-2';
  // The venture rooms were the one place Nex wasn't available, which
  // is exactly where strategy conversations belong. Every other room
  // (dashboard, queue, memory, tenants, conference, connectors,
  // room builder) already loads this dock.
  import '/nex-chat-bar.js?v=20260912-2';

  const params = new URLSearchParams(location.search);
  const canvasId = params.get('id');
  const canvasName = params.get('name') || canvasId;

  if (!canvasId) {
    document.body.innerHTML = '<p style="color:#e8eefb;font:13px Inter,sans-serif;padding:20px;">No canvas id given — open this page as /canvas.html?id=your-venture-slug</p>';
    throw new Error('missing canvas id');
  }

  // Ensure the canvas exists (idempotent — a canvas that already
  // exists is returned unchanged, never reset) before mounting, so
  // visiting a brand-new id for the first time provisions it on the
  // spot instead of just showing an empty error state.
  await fetch('/api/board', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'create_canvas', id: canvasId, name: canvasName }),
  }).catch(() => {});

  document.title = `Nexus // ${canvasName}`;

  const titleBar = document.createElement('div');
  titleBar.className = 'canvas-title-bar';
  titleBar.textContent = canvasName;
  document.body.appendChild(titleBar);

  const returnLink = document.createElement('a');
  returnLink.className = 'return-link';
  returnLink.href = '/';
  returnLink.textContent = '← Dashboard';
  document.body.appendChild(returnLink);

  const canvas = mountCanvas({ canvasId, canvasTitle: canvasName });

  // Default workspace sections for a venture. These are the lenses
  // Justin actually wants on a venture -- what to build next, how to
  // make it money, how to sell it, and the technical view -- rather
  // than one undifferentiated notes box. "Add section" below lets him
  // create his own beyond these.
  const DEFAULT_SECTIONS = [
    { id: 'upgrades', title: 'Upgrades & Optimization', placeholder: 'What to build or improve next\u2026' },
    { id: 'profitability', title: 'Profitability', placeholder: 'Pricing, margins, ways to make this more profitable\u2026' },
    { id: 'marketing', title: 'Marketing & Growth', placeholder: 'Positioning, channels, campaigns, who this is for\u2026' },
    { id: 'dev', title: 'Developer View', placeholder: 'Architecture, technical debt, integrations, gotchas\u2026' },
  ];

  // Server-side (not localStorage) so Nex can read and contribute to
  // these too, and so they survive switching devices. The previous
  // Notes panel here had a textarea wired to nothing at all -- typing
  // in it and reloading silently lost everything, which is why this
  // planning ended up living in Board tasks instead.
  async function saveSection(sectionId, title, body) {
    try {
      await fetch('/api/board', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'set_canvas_section', canvas_id: canvasId, id: sectionId, title, body }),
      });
      return true;
    } catch {
      return false;
    }
  }

  let savedSections = {};
  try {
    const res = await fetch(`/api/board?canvas_id=${encodeURIComponent(canvasId)}`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      savedSections = data?.canvas?.sections || {};
    }
  } catch {
    // An unreachable API shouldn't leave a blank unusable room -- the
    // default sections still render, just empty.
  }

  function buildSectionPanel({ id, title, placeholder, body }, index) {
    const wrap = document.createElement('div');
    wrap.className = 'notes-panel';

    const status = document.createElement('div');
    status.className = 'section-status';

    // Hands Nex this section's ACTUAL current text, not just its name,
    // so the conversation starts grounded in what's written rather
    // than him having to ask what the section is about. Reads
    // textarea.value live (not the saved copy) so unsaved edits are
    // included too.
    const askNex = document.createElement('button');
    askNex.type = 'button';
    askNex.className = 'ask-nex-btn';
    askNex.textContent = 'Ask Nex about this \u2192';
    askNex.addEventListener('click', () => {
      const current = textarea.value.trim();
      const prompt = current
        ? `I'm working on the "${title}" section of the ${canvasName} venture. Here's what I have so far:\n\n${current}\n\nHelp me think this through \u2014 what's missing, what would you push on, and what would you do next?`
        : `I'm working on the "${title}" section of the ${canvasName} venture and it's still empty. Help me figure out what belongs here \u2014 ask me whatever you need to know first.`;
      window.dispatchEvent(new CustomEvent('nexus:nex-prompt', { detail: { text: prompt } }));
    });

    const textarea = document.createElement('textarea');
    textarea.placeholder = placeholder || 'Notes\u2026';
    textarea.value = body || '';

    // Debounced autosave -- no save button to forget to press, but
    // also not a write on every keystroke.
    let saveTimer = null;
    textarea.addEventListener('input', () => {
      status.textContent = 'Saving\u2026';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const ok = await saveSection(id, title, textarea.value);
        status.textContent = ok ? 'Saved' : 'Save failed \u2014 check connection';
        if (ok) setTimeout(() => { if (status.textContent === 'Saved') status.textContent = ''; }, 2000);
      }, 700);
    });

    const footer = document.createElement('div');
    footer.className = 'section-footer';
    footer.append(status, askNex);
    wrap.append(textarea, footer);
    const column = index % 2;
    const row = Math.floor(index / 2);
    canvas.addPanel({
      id: `section-${id}`,
      title,
      content: wrap,
      x: 60 + column * 460,
      y: 100 + row * 360,
      w: 420,
      h: 320,
    });
  }

  // Defaults first (stable order), then any custom sections added
  // later, so the layout doesn't reshuffle as sections get added.
  const rendered = new Set();
  DEFAULT_SECTIONS.forEach((section, i) => {
    rendered.add(section.id);
    buildSectionPanel({ ...section, body: savedSections[section.id]?.body }, i);
  });
  Object.values(savedSections)
    .filter((section) => section && section.id && !rendered.has(section.id))
    .forEach((section, i) => {
      buildSectionPanel(
        { id: section.id, title: section.title || section.id, body: section.body },
        DEFAULT_SECTIONS.length + i,
      );
    });

  const addSectionBtn = document.createElement('button');
  addSectionBtn.id = 'add-section-btn';
  addSectionBtn.type = 'button';
  addSectionBtn.textContent = '+ Add section';
  addSectionBtn.addEventListener('click', async () => {
    const title = window.prompt('Name this section');
    if (!title || !title.trim()) return;
    const trimmed = title.trim();
    const id = trimmed.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40)
      || `section-${Date.now()}`;
    const ok = await saveSection(id, trimmed, '');
    if (ok) window.location.reload();
    else window.alert('Could not create that section \u2014 check your connection and try again.');
  });
  document.body.appendChild(addSectionBtn);

  const control = document.createElement('details');
  control.id = 'nexus-canvas-backdrop-control';
  control.innerHTML = `
    <summary id="nexus-canvas-backdrop-control-summary">Appearance</summary>
    <div class="nexus-appearance-fields">
      <input type="url" id="backdropUrlInput" aria-label="Backdrop image URL" placeholder="Image URL…" />
      <input type="file" id="backdropFileInput" accept="image/*" aria-label="Upload backdrop image" />
      <button id="backdropApplyBtn" type="button">Apply</button>
    </div>
  `;
  document.body.appendChild(control);
  document.getElementById('backdropApplyBtn').addEventListener('click', () => {
    const fileInput = document.getElementById('backdropFileInput');
    const urlInput = document.getElementById('backdropUrlInput');
    const file = fileInput.files?.[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const dataUrl = e.target?.result;
        if (typeof dataUrl === 'string') {
          canvas.setBackdropUrl(dataUrl);
          fileInput.value = '';
          urlInput.value = '';
        }
      };
      reader.readAsDataURL(file);
    } else if (urlInput.value.trim()) {
      canvas.setBackdropUrl(urlInput.value.trim());
    }
  });
</script>
</body>
</html>
