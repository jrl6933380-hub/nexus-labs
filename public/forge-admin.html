<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus Forge — Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0b0d12; color:#e8eaed; padding:20px 16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:#9aa0a6; font-size:13px; margin-bottom:20px; }
  .card { background:#14171f; border:1px solid #262b36; border-radius:14px; padding:16px; max-width:420px; }
  label { display:block; font-size:13px; color:#9aa0a6; margin:12px 0 4px; }
  input, select { width:100%; background:#0b0d12; color:#e8eaed; border:1px solid #333844; border-radius:8px; padding:10px; font-size:14px; }
  button { margin-top:16px; width:100%; background:#3b5bfd; color:white; border:none; border-radius:8px; padding:12px; font-weight:600; font-size:14px; }
  #msg { margin-top:12px; font-size:13px; }
  .ok { color:#4caf50; } .err { color:#e57373; }
  .hint { color:#9aa0a6; font-size:12px; margin-top:16px; }
</style>
</head>
<body>
  <h1>Grant Forge access</h1>
  <div class="sub">Operator only. Promotes an existing Room account to a Forge role.</div>
  <div class="card">
    <label>Room username (they must already have an account — <a href="/room.html" style="color:#8ab4f8">sign up here</a> first)</label>
    <input id="username" placeholder="e.g. jsmith" />
    <label>Role</label>
    <select id="role">
      <option value="forge_worker">Worker — can call assigned leads</option>
      <option value="forge_manager">Manager — can also create/assign leads</option>
    </select>
    <button id="go">Grant access</button>
    <div id="msg"></div>
    <div class="hint">Once granted, they can open <a href="/forge-caller.html" style="color:#8ab4f8">/forge-caller.html</a> on their phone.</div>
  </div>
<script>
document.getElementById('go').addEventListener('click', async () => {
  const targetUsername = document.getElementById('username').value.trim();
  const role = document.getElementById('role').value;
  const msg = document.getElementById('msg');
  msg.textContent = ''; msg.className = '';
  if (!targetUsername) { msg.textContent = 'Enter a username.'; msg.className = 'err'; return; }
  try {
    const res = await fetch('/api/forge-admin', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ targetUsername, role }),
    });
    const data = await res.json();
    if (res.ok) { msg.textContent = `Done — ${targetUsername} is now ${role}.`; msg.className = 'ok'; }
    else { msg.textContent = data.error || 'Failed.'; msg.className = 'err'; }
  } catch { msg.textContent = 'Network error.'; msg.className = 'err'; }
});
</script>
</body>
</html>
