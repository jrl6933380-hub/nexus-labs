<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nexus // Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; }
  .add-panel, .memory-list-panel { padding: 14px; font: 13px/1.5 Inter, -apple-system, sans-serif; color: #e8eefb; height: 100%; box-sizing: border-box; overflow-y: auto; }
  .add-panel textarea {
    width: 100%; min-height: 70px; resize: vertical; box-sizing: border-box;
    background: #ffffff08; border: 1px solid #26334d; border-radius: 8px;
    padding: 10px; color: #e8eefb; font: 13px Inter, sans-serif; outline: none; margin-bottom: 10px;
  }
  .add-panel textarea:focus { border-color: #4b8dff77; }
  .add-row { display: flex; gap: 8px; }
  .add-row select {
    background: #ffffff08; border: 1px solid #26334d; border-radius: 8px; color: #e8eefb;
    font: 11px 'JetBrains Mono', monospace; padding: 0 10px;
  }
  .add-row button {
    background: #4b8dff18; border: 1px solid #4b8dff77; color: #58d7ff; border-radius: 8px;
    flex: 1; font: 700 11px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em;
    cursor: pointer;
  }
  .add-row button:hover { background: #4b8dff32; }
  .memory-list-panel h4 { margin: 0 0 8px; font: 600 9px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.16em; color: #5e6b81; }
  .memory-card {
    background: #ffffff03; border: 1px solid #26334d; border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
  }
  .memory-content { font-size: 13px; line-height: 1.5; }
  .memory-meta { font: 400 10px 'JetBrains Mono', monospace; color: #5e6b81; margin-top: 6px; }
  .delete-btn {
    background: transparent; border: 1px solid #ff4b4b44; color: #ff8585; border-radius: 6px;
    padding: 5px 9px; font-size: 11px; cursor: pointer; flex-shrink: 0;
  }
  .delete-btn:hover { border-color: #ff4b4b; }
  .empty-hint { font: 400 11px 'JetBrains Mono', monospace; color: #5e6b81; padding: 6px 0; }

  .canvas-title-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10000;
    font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
    color: #58d7ff; background: #111827e8; border: 1px solid #3c5a84; border-radius: 8px;
    padding: 7px 16px; backdrop-filter: blur(12px);
  }
  .return-link {
    position: fixed; top: 12px; left: 12px; z-index: 10000;
    font: 700 10px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
    color: #91a0b9; text-decoration: none; background: #111827e8; border: 1px solid #26334d;
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(12px);
  }
  .return-link:hover { color: #58d7ff; border-color: #4b8dff77; }
</style>
</head>
<body>
<script type="module">
  import { mountCanvas } from '/canvas-engine.js';
  import '/nex-chat-bar.js?v=20260912-2';

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text ?? '');
    return div.innerHTML;
  }

  const titleBar = document.createElement('div');
  titleBar.className = 'canvas-title-bar';
  titleBar.textContent = 'Memory Archive';
  document.body.appendChild(titleBar);

  const returnLink = document.createElement('a');
  returnLink.className = 'return-link';
  returnLink.href = '/';
  returnLink.textContent = '← Dashboard';
  document.body.appendChild(returnLink);

  // This room now lives on its own persistent canvas (canvas_id:
  // 'memory') instead of a static page — same live-editable,
  // draggable/resizable surface as the main dashboard, just scoped to
  // this room's own layout and backdrop.
  const canvas = mountCanvas({ canvasId: 'memory', canvasTitle: 'Memory Archive' });

  // Add Memory panel
  const addBody = document.createElement('div');
  addBody.className = 'add-panel';
  addBody.innerHTML = `
    <textarea id="new-content" placeholder="Add something manually for Nex to remember..."></textarea>
    <div class="add-row">
      <select id="new-category" aria-label="Memory category">
        <option value="fact">Fact</option>
        <option value="project">Project</option>
      </select>
      <button id="add-btn">Save memory</button>
    </div>
  `;
  canvas.addPanel({ id: 'add-memory', title: 'Add Memory', content: addBody, x: 80, y: 80, w: 380, h: 220 });

  // Facts panel
  const factsBody = document.createElement('div');
  factsBody.className = 'memory-list-panel';
  factsBody.innerHTML = '<h4>Facts</h4><div class="empty-hint">Loading…</div>';
  canvas.addPanel({ id: 'facts', title: 'Facts', content: factsBody, x: 480, y: 80, w: 340, h: 400 });

  // Projects panel
  const projectsBody = document.createElement('div');
  projectsBody.className = 'memory-list-panel';
  projectsBody.innerHTML = '<h4>Projects</h4><div class="empty-hint">Loading…</div>';
  canvas.addPanel({ id: 'projects', title: 'Projects', content: projectsBody, x: 840, y: 80, w: 340, h: 400 });

  function renderCard(memory) {
    const date = new Date(memory.created_at || Date.now()).toLocaleDateString();
    return `
      <div class="memory-card">
        <div>
          <div class="memory-content">${escapeHtml(memory.content)}</div>
          <div class="memory-meta">${escapeHtml(date)}</div>
        </div>
        <button class="delete-btn" data-id="${escapeHtml(memory.id)}">Delete</button>
      </div>
    `;
  }

  async function loadMemories() {
    try {
      const res = await fetch('/api/memory');
      const data = await res.json();
      const memories = data.memories || [];
      const facts = memories.filter((m) => m.category !== 'project');
      const projects = memories.filter((m) => m.category === 'project');

      factsBody.innerHTML = '<h4>Facts</h4>' + (facts.length ? facts.map(renderCard).join('') : '<div class="empty-hint">Nothing saved yet.</div>');
      projectsBody.innerHTML = '<h4>Projects</h4>' + (projects.length ? projects.map(renderCard).join('') : '<div class="empty-hint">Nothing saved yet.</div>');

      [factsBody, projectsBody].forEach((panel) => {
        panel.querySelectorAll('.delete-btn').forEach((btn) => {
          btn.addEventListener('click', () => deleteMemory(btn.dataset.id));
        });
      });
    } catch (err) {
      factsBody.innerHTML = '<h4>Facts</h4><div class="empty-hint">Couldn\'t load memories.</div>';
      projectsBody.innerHTML = '<h4>Projects</h4><div class="empty-hint">Couldn\'t load memories.</div>';
    }
  }

  async function deleteMemory(id) {
    try {
      await fetch(`/api/memory?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
      loadMemories();
    } catch (err) {
      alert('Failed to delete.');
    }
  }

  document.getElementById('add-btn').addEventListener('click', async () => {
    const contentField = document.getElementById('new-content');
    const categoryField = document.getElementById('new-category');
    const content = contentField.value.trim();
    if (!content) return;
    const btn = document.getElementById('add-btn');
    btn.disabled = true;
    try {
      await fetch('/api/memory', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content, category: categoryField.value }),
      });
      contentField.value = '';
      loadMemories();
    } catch (err) {
      alert('Failed to save.');
    } finally {
      btn.disabled = false;
    }
  });

  loadMemories();
</script>
</body>
</html>
