<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus workspace</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f8f2,#0c1210);--panel:light-dark(#fff,#142018);--text:light-dark(#203529,#e7eee9);--muted:light-dark(#596c5e,#a4b4a8);--line:light-dark(#c8d3c7,#35483b);--gold:light-dark(#866514,#d9bd72);--button:light-dark(#f1e5bd,#d9bd72);--button-text:#172119;--error:light-dark(#9a3824,#ffb19a)}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text);font:14px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button,a.action{color:var(--text);border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;text-decoration:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}button:hover,a.action:hover{filter:brightness(1.1)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.primary{background:var(--button);color:var(--button-text)}.danger{color:var(--error)}.muted{color:var(--muted)}.small{font-size:12px}
#board{background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:600;letter-spacing:.17em}.nav{display:flex;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line)}.nav button{flex:1;border-color:transparent;background:transparent;white-space:nowrap;padding:8px}.nav button[aria-selected=true]{border-color:var(--line);background:var(--panel);color:var(--gold)}main{padding:18px}h2{font-size:21px;font-weight:600;margin:0}h3{font-size:16px;font-weight:600;margin:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project,.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;overflow-wrap:anywhere}.project{padding:16px}.project h3{margin:10px 0 4px}.project .actions{margin-top:12px}.project-mark{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;font-size:20px;color:var(--gold)}.project button{flex:1}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.row-main{flex:1;min-width:0;overflow-wrap:anywhere}.row:last-child{border:0}.row .actions{flex-shrink:0}.time{color:var(--gold);font-size:12px;margin-bottom:4px}.empty{color:var(--muted);padding:24px 0;text-align:center}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);margin:6px 4px 0 0}.complete{color:var(--muted);text-decoration:line-through}details.history{margin-top:16px;border-top:1px solid var(--line)}summary{cursor:pointer;min-height:44px;padding:12px 0;color:var(--muted)}
.editor{margin:12px 0;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}.editor h3{margin-bottom:6px}.editor label{display:block;font-size:13px;margin-top:10px;min-width:0}.editor input,.editor textarea,.editor select{display:block;width:100%;max-width:100%;min-width:0;padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;margin:5px 0 8px;font-size:16px}.editor input[type=date],.editor input[type=time],.editor input[type=datetime-local]{appearance:none;min-height:44px}.editor textarea{min-height:72px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.field-wide{grid-column:1/-1}.editor .actions{margin-top:12px}.editor .note{margin:8px 0;color:var(--muted);font-size:12px}.error{color:var(--error)}.preview{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.preview iframe{display:block;width:100%;height:340px;border:0;background:#fff}.preview-label{padding:8px 12px;background:var(--panel);color:var(--muted);font-size:12px}.detail-heading{margin:14px 0 0}.metric{padding:16px}.metric strong{display:block;font-size:24px;margin:6px 0}.metric progress{width:100%;height:8px;accent-color:var(--gold)}.usage-notes{margin-top:16px;color:var(--muted);font-size:12px}.usage-notes p{margin:6px 0}.assist{margin:14px 0 0}.assist textarea{display:block;width:100%;min-height:74px;margin:8px 0;padding:10px;font-size:16px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px}.assist label{font-weight:600}.assist .actions button{flex:1}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{font-size:12px;padding:7px 9px}.selected{border-color:var(--gold)}footer{border-top:1px solid var(--line);padding:12px 18px;color:var(--muted);font-size:12px}#feedback{display:flex;align-items:center;justify-content:space-between;gap:10px}#updated{display:block;margin-top:4px}#retry{flex-shrink:0}.section-help{margin-bottom:12px}.section-help button{font-size:12px}.editor:focus{outline:none}[hidden]{display:none!important}
@media(max-width:480px){header,main{padding:14px}.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}.row .actions{width:100%}.row .actions button{flex:1}.heading>.actions{width:100%}.heading>.actions button{flex:1}.preview iframe{height:300px}.editor{padding:12px}.fields{gap:0 8px}}
@media(prefers-reduced-motion:no-preference){button,a.action{transition:filter .15s,border-color .15s}}
.welcome{padding:8px 0 12px}.welcome h2{font-size:24px;line-height:1.3;margin:0 0 8px}.welcome>p{margin:0 0 16px;color:var(--muted)}.starters{display:grid;gap:10px}.starter{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:14px 16px;min-height:76px;width:100%;border-radius:14px}.starter strong,.starter small{display:block}.starter strong{font-size:15px}.starter small{font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}.starter .arrow{font-size:20px;color:var(--gold)}.welcome-note{font-size:12px;margin-top:14px!important}.starter-form{margin-top:12px}.starter-form .note{margin:6px 0 12px}
</style>
</head>
<body>
<div id="board">
<header><div><div class="brand">NEXUS</div><div id="account" class="muted small">Loading authenticated workspace…</div></div><button id="refresh">Refresh</button></header>
<nav class="nav" role="tablist" aria-label="Nexus workspace">
<button id="projects-tab" role="tab" aria-controls="projects" aria-selected="true">Projects</button>
<button id="schedule-tab" role="tab" aria-controls="schedule" aria-selected="false" tabindex="-1">Schedule</button>
<button id="reminders-tab" role="tab" aria-controls="reminders" aria-selected="false" tabindex="-1">Reminders</button>
<button id="usage-tab" role="tab" aria-controls="usage" aria-selected="false" tabindex="-1">Usage</button>
</nav>
<main id="main">
<section id="projects" role="tabpanel" aria-labelledby="projects-tab"><div id="welcome" class="welcome" hidden></div><div id="projects-heading" class="heading"><div><h2>Your ideas, built.</h2><span id="project-count" class="muted"></span></div><div class="actions"><button id="import-form" hidden>Save FORM to Projects</button><button id="new-project" class="primary">+ New project</button></div></div><div id="project-detail" hidden></div><div id="project-list" class="grid"></div></section>
<section id="schedule" role="tabpanel" aria-labelledby="schedule-tab" hidden><div class="heading"><div><h2>Your time, together.</h2><span id="schedule-zone" class="muted small"></span></div><button id="add-event" class="primary">+ Add event</button></div><div id="schedule-help" class="section-help"></div><div id="event-list"></div></section>
<section id="reminders" role="tabpanel" aria-labelledby="reminders-tab" hidden><div class="heading"><div><h2>Keep the little promises.</h2><span class="muted small">Your private reminders</span></div><button id="add-reminder" class="primary">+ Add reminder</button></div><div id="reminders-help" class="section-help"></div><div id="reminder-list"></div><p class="muted small">Phone alerts depend on notification setup in Nexus.</p></section>
<section id="usage" role="tabpanel" aria-labelledby="usage-tab" hidden><div class="heading"><div><h2>Know where you stand.</h2><span class="muted small">Nexus-hosted AI</span></div></div><div id="usage-data"></div><div id="usage-help" class="section-help"></div></section>
<section id="editor" class="editor" hidden tabindex="-1" aria-label="Selected item editor"></section>
</main>
<footer><div id="feedback"><span id="status" role="status" aria-live="polite">Waiting for the connector.</span><button id="retry" hidden>Retry</button></div><span id="updated"></span></footer>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('board'),by=id=>root.querySelector('#'+id),tabs=[...root.querySelectorAll('[role=tab]')],pending=new Map(),editor=by('editor');
let sequence=0,snapshot=null,busy=false,hostReady=false,selectedProject=null,retryTask=null,returnFocus=null;
const savedState=window.openai?.widgetState;
const zone=()=>Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
function status(text,error=false){by('status').textContent=text;by('status').classList.toggle('error',error);by('status').setAttribute('role',error?'alert':'status');}
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,fn){const b=node('button',text);b.type='button';b.onclick=fn;b.disabled=busy;return b;}
function notify(method,params){window.parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params){return new Promise((resolve,reject)=>{const id=++sequence;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Connection timed out. Refresh to check saved state before trying again.'));},30000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');});}
async function tool(name,args={}){
 if(!window.openai?.callTool && !hostReady)throw new Error('Use the Nexus tools in chat; this host has not connected the board controls.');
 const result=window.openai?.callTool?await window.openai.callTool(name,args):await request('tools/call',{name,arguments:args});
 if(result?.isError)throw new Error(result.structuredContent?.error || result.content?.find(c=>c.type==='text')?.text || 'Nexus could not complete that action.');
 if(!result?.structuredContent)throw new Error('Nexus returned no saved data. Refresh to check the result.');
 return result.structuredContent;
}
async function message(prompt){
 if(window.openai?.sendFollowUpMessage)return window.openai.sendFollowUpMessage({prompt});
 if(!hostReady)throw new Error('Ask your assistant in chat; this host cannot send a handoff yet.');
 return request('ui/message',{role:'user',content:[{type:'text',text:prompt}]});
}
function persistSelection(kind,id,label){
 try{window.openai?.setWidgetState?.({tab:tabs.find(t=>t.getAttribute('aria-selected')==='true')?.getAttribute('aria-controls'),selection:kind?{kind,id,label}:null});}catch{}
}
function closeEditor(){editor.hidden=true;by('main').append(editor);if(returnFocus?.isConnected)returnFocus.focus();returnFocus=null;}
function mountEditor(container){closeEditor();returnFocus=document.activeElement;container.append(editor);editor.hidden=false;editor.focus({preventScroll:true});}
function select(tab){
 closeEditor();tabs.forEach(t=>{const active=t===tab;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;by(t.getAttribute('aria-controls')).hidden=!active;});
 persistSelection(selectedProject?'project':null,selectedProject?.project_id,selectedProject?.label);
}
tabs.forEach((tab,index)=>{tab.onclick=()=>select(tab);tab.onkeydown=e=>{let next;if(e.key==='Home')next=tabs[0];if(e.key==='End')next=tabs.at(-1);if(['ArrowRight','ArrowLeft'].includes(e.key))next=tabs[(index+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];if(next){e.preventDefault();select(next);next.focus();}};});
function lock(value){busy=value;root.setAttribute('aria-busy',String(value));root.querySelectorAll('button').forEach(b=>b.disabled=value);}
async function refresh(){render(await tool('read_nexus_workspace'));}
async function run(task,{success='Updated from Nexus.',write=false}={}){
 if(busy)return false;lock(true);retryTask=null;by('retry').hidden=true;status('Working…');
 try{await task();status(success);return true;}catch(e){status(e.message,true);retryTask=write?async()=>{await refresh();if(selectedProject)await openProject(selectedProject.project_id);}:task;by('retry').textContent=write?'Check saved state':'Retry';by('retry').hidden=false;return false;}finally{lock(false);}
}
by('retry').onclick=()=>{if(retryTask)run(retryTask);};
function empty(container,text){container.replaceChildren(node('div',text,'empty'));}
function localDate(value){if(!value)return 'No date';const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short',timeZone:zone()}):String(value);}
function timeOnly(value){return new Date(value).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',timeZone:zone()});}
function localInput(value){if(!value)return '';const date=new Date(value);if(!Number.isFinite(date.getTime()))return '';const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:zone(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(p=>[p.type,p.value]));return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`;}
function history(container,label,items,draw){if(!items.length)return;const details=node('details',undefined,'history');details.append(node('summary',label+' · '+items.length));for(const item of items)draw(details,item);container.append(details);}
function assist(container,context,{label='What would you like help with?',suggestions=[]}={}){
 const wrap=node('form',undefined,'assist'),field=node('textarea');field.id='help-'+(++sequence);field.maxLength=4000;field.placeholder='Describe the change or ask a question…';const caption=node('label',label);caption.htmlFor=field.id;wrap.append(caption,field);
 if(suggestions.length){const chips=node('div',undefined,'chips');for(const text of suggestions)chips.append(button(text,()=>{field.value=text;field.focus();}));wrap.append(chips);}
 const actions=node('div',undefined,'actions'),send=node('button','Ask assistant','primary');send.type='submit';actions.append(send);wrap.append(actions);
 wrap.onsubmit=e=>{e.preventDefault();const text=field.value.trim();if(!text){field.setCustomValidity('Describe what you want help with.');field.reportValidity();return;}field.setCustomValidity('');run(()=>message(context+'\n\nMy request: '+text),{success:'Sent to the assistant. Continue in chat.',write:false});};field.oninput=()=>field.setCustomValidity('');container.append(wrap);
}
function helpWith(kind,item,container){
 persistSelection(kind,item.id,item.title);editor.replaceChildren(node('h3','Help with '+item.title));
 const reference=kind==='reminder'?'reminder ID':'Schedule event ID';
 assist(editor,'Help me with my private Nexus '+reference+' '+JSON.stringify(item.id)+'. Read the current record and related commitments first. My timezone is '+zone()+'. Do not change or delete records unless my request specifies that action.',{suggestions:kind==='reminder'?['Help me choose an alert time','Review this reminder']:['Help me reschedule this','Review this event']});mountEditor(container);
}
async function openProject(project_id){
 closeEditor();const result=await tool('read_nexus_project',{project_id});selectedProject=result;persistSelection('project',project_id,result.label);renderProject();
}
function renderProject(){
 const detail=by('project-detail');detail.replaceChildren();detail.hidden=!selectedProject;by('import-form').hidden=Boolean(selectedProject) || !snapshot?.account.owner || snapshot.projects.some(p=>p.project_id==='form-bodyweight-showcase');by('project-list').hidden=Boolean(selectedProject);if(!selectedProject)return;
 const p=selectedProject;detail.append(button('← All projects',()=>{closeEditor();selectedProject=null;persistSelection();renderProject();}));detail.append(node('h3',p.label || 'Untitled project','detail-heading'),node('div','Saved draft · changes stay private until you publish in Nexus','muted small'));
 const preview=node('div',undefined,'preview'),frame=node('iframe');frame.title=(p.label || 'Project')+' preview';frame.setAttribute('sandbox','allow-scripts');frame.setAttribute('referrerpolicy','no-referrer');
 // Opaque origin: the saved page cannot access the board, host bridge, cookies or storage.
 // Keep preview requests offline, including images/fonts; the full Nexus view retains its normal assets.
 const csp='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:; font-src data:; base-uri \'none\'; form-action \'none\'">';
 const document=new DOMParser().parseFromString(p.html,'text/html');document.head.prepend(new DOMParser().parseFromString(csp,'text/html').head.firstElementChild);frame.srcdoc='<!doctype html>'+document.documentElement.outerHTML;preview.append(frame,node('div','Isolated preview · external assets may appear only in Nexus','preview-label'));detail.append(preview);
 const actions=node('div',undefined,'actions'),link=node('a','Open in Nexus','action');link.href='https://nexus-labs-sigma.vercel.app/forge.html?surface=workbench&build='+encodeURIComponent(p.baseline);link.target='_blank';link.rel='noopener noreferrer';actions.append(link,button('Rename',()=>form('Rename project',[{key:'label',label:'Project name',required:true,value:p.label,maxLength:80}],async(input,request_id)=>{await tool('rename_nexus_project',{project_id:p.project_id,baseline:p.baseline,label:input.label.trim(),request_id});await openProject(p.project_id);},{container:detail})),button('Reload preview',()=>run(()=>openProject(p.project_id))));detail.append(actions);
 assist(detail,'Continue editing my Nexus project '+JSON.stringify(p.project_id)+'. Read its current baseline before saving. Preserve its project_id and save the complete working HTML draft through save_nexus_project. Do not publish.',{label:'Edit this project with your assistant',suggestions:['Improve the mobile layout','Fix a problem','Add a feature']});
}
function eventRow(container,item){
 const wrap=node('div'),row=node('div',undefined,'row'),main=node('div',undefined,'row-main'),actions=node('div',undefined,'actions');
 main.append(node('div',localDate(item.starts_at)+(!item.calendar_marker && item.ends_at?' – '+timeOnly(item.ends_at):''),'time'),node('h3',item.title));
 const meta=node('div');if(item.calendar_marker)meta.append(node('span','Reminder · alert only','badge'));else{meta.append(node('span',item.status || 'planned','badge'),node('span',item.protected?'Protected':item.flexibility || 'fixed','badge'));}main.append(meta);
 actions.append(button('Edit',()=>eventForm(item,wrap)),button('Help with this',()=>{const reminder=item.calendar_marker?snapshot.reminders.find(r=>r.id===item.reminder_id):null;if(item.calendar_marker && !reminder)return status('Reminder unavailable. Refresh the board.',true);helpWith(reminder?'reminder':'event',reminder || item,wrap);}));row.append(main,actions);wrap.append(row);container.append(wrap);
}
function reminderRow(container,item){
 const wrap=node('div'),row=node('div',undefined,'row'),main=node('div',undefined,'row-main'),actions=node('div',undefined,'actions');main.append(node('div',item.due_at?localDate(item.due_at):item.due_date || 'Anytime','time'),node('h3',item.title,item.status==='done'?'complete':''));
 actions.append(button('Edit',()=>reminderForm(item,wrap)),button('Help',()=>{const event=item.source_calendar_id?snapshot.schedule.find(r=>r.id===item.source_calendar_id):null;helpWith(event?'event':'reminder',event || item,wrap);}),button(item.status==='done'?'Reopen':'Done',()=>{const request_id=crypto.randomUUID();run(async()=>{await tool('update_nexus_reminder',{id:item.id,status:item.status==='done'?'planned':'done',request_id});await refresh();},{write:true});}));row.append(main,actions);wrap.append(row);container.append(wrap);
}
function usageView(data){
 const usage=by('usage-data');usage.replaceChildren();const grid=node('div',undefined,'grid'),u=data.usage;
 const plan=node('div',undefined,'metric');plan.append(node('span','Your plan','muted small'),node('strong',u?.plan || 'Not available'),node('span',u?.exempt?'Owner access':data.workbench?.count!==undefined?data.workbench.count+' saved projects'+(data.workbench.limit!=null?' of '+data.workbench.limit:''):'','small'));grid.append(plan);
 if(u?.exempt){const metric=node('div',undefined,'metric');metric.append(node('span','Hosted AI allowance','muted small'),node('strong','Owner access'),node('span','Your account is exempt from allowance limits.','small'));grid.append(metric);}else for(const [label,window] of [['Current window',u?.short],['This week',u?.weekly]]){const metric=node('div',undefined,'metric'),percent=window?.percentRemaining;metric.append(node('span',label,'muted small'),node('strong',Number.isFinite(percent)?percent+'% left':'Not available'));if(Number.isFinite(percent)){const meter=node('progress');meter.max=100;meter.value=Math.min(100,Math.max(0,percent));meter.setAttribute('aria-label',label+' allowance remaining');metric.append(meter);}if(window?.resetAt)metric.append(node('div','Resets '+localDate(window.resetAt),'muted small'));grid.append(metric);}
 usage.append(grid);const notes=node('div',undefined,'usage-notes');notes.append(node('p','This allowance covers Nexus-hosted AI. Your separate chat-provider usage is not billed by Nexus.'),node('p','Board edits, Schedule and Reminders do not consume this AI allowance.'));usage.append(notes);
 by('usage-help').replaceChildren(button('Help me understand my usage',()=>run(()=>message('Explain my current Nexus-hosted AI usage. Read get_nexus_usage first. Do not change billing or invoke a model.'))));
}
function startProject(){
 select(by('projects-tab'));
 form(snapshot?.onboarding?.showWelcome?'Build your first idea':'Start a fresh project',[{key:'idea',label:'What would you like to build?',required:true,multiline:true,maxLength:4000}],async input=>{await message('Help me start a fresh Nexus Project. My idea: '+input.idea+'. Ask one short question about any missing requirements before building. Use a fresh stable project_id when I am ready and save the complete working HTML through save_nexus_project as a private draft. Do not publish.');},{handoff:true,note:'A website, tracker, or useful tool. A sentence is enough to start.'});
 const chips=node('div',undefined,'chips');for(const idea of ['A business website','A workout planner','A simple tracker'])chips.append(button(idea,()=>{by('nexus-field-idea').value=idea;by('nexus-field-idea').focus();}));editor.querySelector('form').prepend(chips);
}
function startSchedule(){
 select(by('schedule-tab'));
 form('Plan your time',[{key:'goal',label:'What needs to fit into your week?',required:true,multiline:true,maxLength:4000}],async input=>{await message('Help me plan my private Nexus Schedule in '+zone()+'. Here is what I want to fit in: '+input.goal+'. Read current commitments first. Ask one short question to fill in missing days, times, or priorities. Show the proposed plan before saving; do not create events until I choose to apply it.');},{container:by('schedule'),handoff:true,note:'Start with work, family time, a workout, or anything important to you.'});
}
function welcomeView(data){
 const welcome=by('welcome'),show=Boolean(data.onboarding?.showWelcome);welcome.hidden=!show;by('projects-heading').hidden=show;
 if(!show){welcome.replaceChildren();return;}
 welcome.replaceChildren(node('div','YOUR WORKSPACE','muted small'),node('h2',data.onboarding.heading),node('p',data.onboarding.question));
 const starters=node('div',undefined,'starters'),actions={project:startProject,schedule:startSchedule,reminder:()=>{select(by('reminders-tab'));reminderForm();}};
 for(const item of data.onboarding.starters || []){if(!actions[item.id])continue;const card=button('',actions[item.id]);card.className='starter';const text=node('span');text.append(node('strong',item.label),node('small',item.description));const arrow=node('span','→','arrow');arrow.setAttribute('aria-hidden','true');card.append(text,arrow);starters.append(card);}welcome.append(starters,node('p','Start with one thing. You can always add more.','welcome-note'));
}
function render(data){
 if(!data?.account || !Array.isArray(data.projects) || !Array.isArray(data.schedule) || !Array.isArray(data.reminders))return;
 const changedAccount=snapshot && snapshot.account.id!==data.account.id;
 // Hosts can replay the initial tool output when widget state or layout changes.
 // Never let that older snapshot replace data read by the board itself.
 if(snapshot && !changedAccount){const incoming=Date.parse(data.updated_at),current=Date.parse(snapshot.updated_at);if(Number.isFinite(incoming) && Number.isFinite(current) && incoming<=current)return;}
 if(changedAccount){selectedProject=null;closeEditor();persistSelection();}
 // Park the shared editor before rebuilding lists, so it cannot be removed with a row.
 const editorOpen=!editor.hidden;if(editorOpen)closeEditor();snapshot=data;by('account').textContent=data.account.id+' · '+(data.account.owner?'Owner workspace':'Your workspace');by('updated').textContent='Updated '+localDate(data.updated_at);by('project-count').textContent=data.projects.length+' saved projects';by('schedule-zone').textContent='Private Nexus Schedule · '+zone();by('import-form').hidden=!data.account.owner || data.projects.some(p=>p.project_id==='form-bodyweight-showcase');
 const projects=by('project-list');projects.replaceChildren();for(const p of data.projects){const card=node('article',undefined,'project');card.append(node('div','▣','project-mark'),node('h3',p.label || 'Untitled project'),node('div','Saved draft','muted small'));const actions=node('div',undefined,'actions');actions.append(button('Open project',()=>run(()=>openProject(p.project_id))));card.append(actions);projects.append(card);}if(!data.projects.length)empty(projects,'Start with an idea. Your saved projects will appear here.');
 if(selectedProject){const record=data.projects.find(p=>p.project_id===selectedProject.project_id);if(!record)selectedProject=null;else selectedProject.label=record.label || selectedProject.label;}welcomeView(data);renderProject();if(data.onboarding?.showWelcome)projects.hidden=true;
 const events=by('event-list');events.replaceChildren();const current=[],past=[];for(const item of [...data.schedule].sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at))){const end=new Date(item.ends_at || item.starts_at).getTime();(item.status==='done' || item.status==='cancelled' || end<Date.now()?past:current).push(item);}for(const item of current)eventRow(events,item);if(!current.length)empty(events,'No upcoming events. Add a time block or plan with your assistant.');history(events,'Past events',past.reverse(),eventRow);
 const reminders=by('reminder-list');reminders.replaceChildren();const planned=data.reminders.filter(i=>i.status!=='done').sort((a,b)=>(new Date(a.due_at || a.due_date).getTime() || Infinity)-(new Date(b.due_at || b.due_date).getTime() || Infinity));for(const item of planned)reminderRow(reminders,item);if(!planned.length)empty(reminders,'All clear. Add a reminder when you need one.');history(reminders,'Completed',data.reminders.filter(i=>i.status==='done'),reminderRow);
 by('schedule-help').replaceChildren(button('Plan with assistant',()=>run(()=>message('Help me plan my private Nexus Schedule in '+zone()+'. Read current commitments first, show me your proposed plan and wait for my instruction before saving changes.'))));by('reminders-help').replaceChildren(button('Organize with assistant',()=>run(()=>message('Help me organize my private Nexus reminders. Read the current reminders first and ask what I want changed. Do not delete or reschedule them without my instruction.'))));usageView(data);status('Loaded from Nexus.');
}
function form(title,fields,onSave,{container=by(tabs.find(t=>t.getAttribute('aria-selected')==='true').getAttribute('aria-controls')),note='',help,handoff=false}={}){
 if(busy)return;editor.replaceChildren(node('h3',title));if(note)editor.append(node('p',note,'note'));const element=node('form'),grid=node('div',undefined,'fields'),controls={};
 for(const field of fields){const label=node('label',field.label,field.wide || field.multiline?'field-wide':undefined),input=node(field.multiline?'textarea':field.options?'select':'input');if(!field.multiline && !field.options)input.type=field.type || 'text';if(field.options)for(const [value,text] of field.options){const option=node('option',text);option.value=value;input.append(option);}input.value=field.value ?? '';input.required=Boolean(field.required);if(field.maxLength)input.maxLength=field.maxLength;input.id='nexus-field-'+field.key;label.htmlFor=input.id;controls[field.key]=input;label.append(input);grid.append(label);}element.append(grid);
 const actions=node('div',undefined,'actions'),submit=node('button',handoff?'Ask assistant':'Save to Nexus','primary');submit.type='submit';actions.append(submit,button('Cancel',closeEditor));element.append(actions);editor.append(element);if(help)assist(editor,help,{label:'Or describe what you want to change'});mountEditor(container);
 if(container===by('schedule'))container.insertBefore(editor,by('event-list'));if(container===by('reminders'))container.insertBefore(editor,by('reminder-list'));if(container===by('projects'))container.insertBefore(editor,by('project-detail'));
 let previous='',request_id;const activeEditor=editor;
 element.onsubmit=e=>{e.preventDefault();const input=Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.value]));const signature=JSON.stringify(input);if(signature!==previous){previous=signature;request_id=crypto.randomUUID();}run(async()=>{await onSave(input,request_id);if(activeEditor===editor)closeEditor();if(!handoff)await refresh();},{write:!handoff,success:handoff?'Sent to the assistant. Continue in chat.':'Updated from Nexus.'});};
}
function eventForm(item,container){
 if(busy)return;if(item?.calendar_marker){const reminder=snapshot.reminders.find(r=>r.id===item.reminder_id);return reminder?reminderForm(reminder,container):status('Reminder unavailable. Refresh the board.',true);}
 const start=localInput(item?.starts_at || new Date(Date.now()+3600000).toISOString()),end=localInput(item?.ends_at || new Date(new Date(item?.starts_at || new Date(Date.now()+3600000)).getTime()+3600000).toISOString());
 persistSelection('event',item?.id,item?.title);form(item?'Edit event':'Add event',[
 {key:'title',label:'Title',required:true,value:item?.title,wide:true,maxLength:160},
 {key:'starts_at',label:'Start · local date and time',type:'datetime-local',required:true,value:start,wide:true},
 {key:'ends_at',label:'End · local date and time',type:'datetime-local',required:true,value:end,wide:true},
 {key:'flexibility',label:'Timing',value:item?.flexibility || 'fixed',options:[['fixed','Fixed'],['flexible','Flexible']]},
 {key:'category',label:'Category',value:item?.category || 'other',options:['work','project','gym','health','family','social','appointment','errands','learning','creative','rest','travel','other'].map(v=>[v,v[0].toUpperCase()+v.slice(1)])},
 {key:'notes',label:'Notes',multiline:true,value:item?.notes,maxLength:4000}],async(input,request_id)=>{if(input.ends_at<=input.starts_at)throw new Error('End time must be after the start.');await tool(item?'update_nexus_event':'create_nexus_event',{...input,timezone:zone(),...(item?{id:item.id}:{}),request_id});},{container:container || by('schedule'),note:'Times shown in '+zone()+(item?.protected?' · This commitment is protected. Saving applies your explicit edits.':''),help:item?'Help me with my private Nexus Schedule event ID '+JSON.stringify(item.id)+'. Read it and current commitments first. My timezone is '+zone()+'.':undefined});
}
function reminderForm(item,container){
 if(busy)return;if(item?.source_calendar_id){const event=snapshot.schedule.find(r=>r.id===item.source_calendar_id);return event?eventForm(event,container):status('Event unavailable. Refresh the board.',true);}
 persistSelection('reminder',item?.id,item?.title);form(item?'Edit reminder':'Add reminder',[
 {key:'title',label:'Title',required:true,value:item?.title,wide:true,maxLength:160},
 {key:'due_date',label:'Date · optional',type:'date',value:item?.due_at?localInput(item.due_at).slice(0,10):item?.due_date},
 {key:'due_time',label:'Alert time · optional',type:'time',value:item?.due_at?localInput(item.due_at).slice(11):''},
 {key:'repeat',label:'Repeat',value:item?.repeat || 'none',options:[['none','Does not repeat'],['daily','Daily'],['weekly','Weekly']],wide:true},
 {key:'notes',label:'Notes',multiline:true,value:item?.notes,maxLength:4000}],async(input,request_id)=>{if(input.due_time && !input.due_date)throw new Error('Choose a date for this alert.');await tool(item?'update_nexus_reminder':'create_nexus_reminder',{title:input.title,notes:input.notes,repeat:input.repeat,due_date:input.due_date || null,due_at:input.due_time?input.due_date+'T'+input.due_time:null,timezone:zone(),...(item?{id:item.id}:{}),request_id});},{container:container || by('reminders'),note:'Alerts use '+zone()+'. Leave the date empty for an anytime task.',help:item?'Help me with my private Nexus reminder ID '+JSON.stringify(item.id)+'. Read it first. My timezone is '+zone()+'.':undefined});
}
by('refresh').onclick=()=>run(async()=>{await refresh();if(selectedProject)await openProject(selectedProject.project_id);});
by('add-event').onclick=()=>eventForm();by('add-reminder').onclick=()=>reminderForm();
by('new-project').onclick=startProject;
const importId=crypto.randomUUID();by('import-form').onclick=()=>run(async()=>{await tool('import_form_project',{request_id:importId});await refresh();},{write:true});
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const msg=event.data;if(!msg || msg.jsonrpc!=='2.0')return;if(msg.id!==undefined && pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);clearTimeout(p.timer);msg.error?p.reject(new Error(msg.error.message || 'Host request failed')):p.resolve(msg.result);return;}if(msg.method==='ui/notifications/tool-result')render(msg.params?.structuredContent);if(msg.method==='ui/notifications/host-context-changed' && msg.params?.theme)document.documentElement.style.colorScheme=msg.params.theme;});
window.addEventListener('openai:set_globals',event=>render(event.detail?.globals?.toolOutput));
if(window.openai?.toolOutput)render(window.openai.toolOutput);
if(savedState?.tab && by(savedState.tab+'-tab'))select(by(savedState.tab+'-tab'));
async function restoreBoard(){await refresh();const id=savedState?.selection?.kind==='project'?savedState.selection.id:null;if(id && snapshot?.projects.some(p=>p.project_id===id))await openProject(id);}
// A remounted widget must read current storage, not rely on its original tool output.
if(!window.openai?.callTool){request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'nexus-board',version:'2.1.0'},appCapabilities:{}}).then(()=>{hostReady=true;notify('ui/notifications/initialized',{});run(restoreBoard);}).catch(e=>status(e.message,true));}else run(restoreBoard);
})();
