<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/ads.webmanifest">
<link rel="apple-touch-icon" href="/ads-icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ads">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nexus Ads</title>
<meta name="description" content="Every Nexus ad in one feed. Open, plan and post from here.">
<link rel="stylesheet" href="/ads.css">
</head>
<body>
<header class="bar">
  <a class="bar-link" href="/ad-maker.html?new=1">Studio</a>
  <span class="bar-title">nexus.ads</span>
  <div class="bar-actions">
    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh ads">&#8635;</button>
    <a class="icon-btn" href="/ad-maker.html?new=1" aria-label="New ad">+</a>
  </div>
</header>
<main>
  <section class="profile" aria-label="Profile">
    <div class="avatar" aria-hidden="true">N</div>
    <div class="stats">
      <div><b id="stat-ads">-</b><span>ads</span></div>
      <div><b id="stat-cine">-</b><span>cinematic</span></div>
      <div><b id="stat-studio">-</b><span>studio</span></div>
    </div>
  </section>
  <div class="bio">
    <h1>Nexus Ads</h1>
    <p>Every ad you, ChatGPT and Claude have saved, in one place. Tap one to open it.</p>
  </div>
  <div class="actions">
    <a class="btn primary" href="/ad-maker.html?new=1">New ad</a>
    <a class="btn" href="/tiktok-planner.html">Post plan</a>
  </div>
  <div class="tabs" role="tablist" aria-label="Filter ads">
    <button type="button" role="tab" aria-selected="true" data-filter="all">All</button>
    <button type="button" role="tab" aria-selected="false" data-filter="cinematic">Cinematic</button>
    <button type="button" role="tab" aria-selected="false" data-filter="studio">Studio</button>
  </div>
  <p id="status" class="status" role="status" aria-live="polite">Loading your ads...</p>
  <div id="message" class="message" hidden></div>
  <ul id="grid" class="grid"></ul>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 id="sheet-title"></h2>
    <p id="sheet-meta" class="sheet-meta"></p>
    <p id="sheet-id" class="sheet-id"></p>
    <div id="sheet-video" hidden></div>
    <section id="post" class="post" aria-labelledby="post-h">
      <h3 id="post-h">Posting</h3>
      <div id="post-platform" class="seg three" role="group" aria-label="Platform">
        <button type="button" data-platform="tiktok" aria-pressed="true">TikTok</button>
        <button type="button" data-platform="instagram" aria-pressed="false">Instagram</button>
        <button type="button" data-platform="facebook" aria-pressed="false">Facebook</button>
      </div>
      <div id="post-status" class="seg" role="group" aria-label="Posting status">
        <button type="button" data-status="idea" aria-pressed="false">Not ready</button>
        <button type="button" data-status="ready" aria-pressed="false">Ready</button>
        <button type="button" data-status="scheduled" aria-pressed="false">Scheduled</button>
        <button type="button" data-status="posted" aria-pressed="false">Posted</button>
      </div>
      <div id="post-fields" class="post-fields">
        <label id="post-date-row">Post date<input id="post-date" type="date"></label>
        <label>Caption<textarea id="post-caption" rows="3" maxlength="2200" placeholder="What you will post with it"></textarea></label>
        <label id="post-url-row">Live post link<input id="post-url" type="url" inputmode="url" placeholder="https://..."></label>
      </div>
      <button id="post-save" class="btn primary" type="button">Save posting</button>
      <p id="post-msg" class="post-msg" role="status" aria-live="polite"></p>
    </section>
    <div class="sheet-actions">
      <button id="sheet-watch" class="btn primary" type="button" hidden>Watch video</button>
      <a id="sheet-open" class="btn primary" href="/ad-maker.html">Open</a>
      <button id="sheet-copy" class="btn" type="button">Copy ID</button>
      <button id="sheet-close" class="btn ghost" type="button">Close</button>
    </div>
    <p class="sheet-note">Copy the ID to tell Claude or ChatGPT which ad to render or change.</p>
  </div>
</div>
<script src="/ads.js"></script>
</body>
</html>
