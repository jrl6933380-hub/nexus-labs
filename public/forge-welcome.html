<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome aboard</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f6f3ee; color:#1f1a14; padding:24px; }
  .card { max-width:420px; background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { font-size:15px; line-height:1.5; color:#4a4238; margin:0 0 10px; }
  .check { font-size:40px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="check">&#10003;</div>
    <h1>You're all set!</h1>
    <p>Payment received. We're putting the finishing touches on your new website now.</p>
    <p>You can hang up whenever you're ready. Your rep will follow up when it's live.</p>
  </div>
<script>
  if (new URLSearchParams(location.search).get('cancelled')) {
    document.getElementById('card').innerHTML =
      '<h1>No problem</h1><p>Nothing was charged. If you change your mind, just let your rep know and they can send a new link.</p>';
  }
</script>
</body>
</html>
