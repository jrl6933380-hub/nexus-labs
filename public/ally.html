<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Ally pairing</title><style>body{font:16px system-ui;background:#101625;color:#edf2ff;max-width:680px;margin:32px auto;padding:18px}button{background:#4979ef;color:#fff;border:0;border-radius:10px;padding:14px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;word-break:break-word;background:#232c44;padding:15px;border-radius:10px}small{color:#aebad1}</style></head><body><h1>Nexus Ally — owner pairing</h1><p>Use your Nexus owner login. This is an early connection test: it allows only pairing and live heartbeat, not remote control.</p><button id="pair">Generate five-minute code</button><button id="refresh">Check Ally connection</button><button id="stop">Stop current session</button><button id="revoke">Revoke Ally pairing</button><pre id="out" aria-live="polite">Ready.</pre><small>Only enter the code into the trusted Nexus Ally script. Do not share the pairing code or device token.</small><script>
const out=document.querySelector('#out'); async function call(action){out.textContent='Checking…';try{const r=await fetch('/api/ally',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');out.textContent=JSON.stringify(j,null,2);}catch(e){out.textContent=e.message;}}
document.querySelector('#pair').onclick=()=>call('pair_code');document.querySelector('#refresh').onclick=()=>call('status');document.querySelector('#stop').onclick=()=>call('stop');document.querySelector('#revoke').onclick=()=>{if(confirm('Revoke this Ally pairing? Re-pairing will be required.'))call('revoke');};
</script></body></html>
