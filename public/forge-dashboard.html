<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus Forge — Operator Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0b0d12; color:#e8eaed; padding:16px 14px 48px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { color:#9aa0a6; font-size:13px; margin-bottom:18px; }
  .nav { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .nav a { color:#8ab4f8; text-decoration:none; font-size:13px; border:1px solid #262b36; padding:7px 12px; border-radius:8px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
  .card { background:#14171f; border:1px solid #262b36; border-radius:12px; padding:12px; }
  .card .num { font-size:22px; font-weight:700; }
  .card .label { color:#9aa0a6; font-size:11px; margin-top:2px; }
  h2 { font-size:14px; color:#c7cad1; margin:22px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 6px; border-bottom:1px solid #1d212b; }
  th { color:#9aa0a6; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .funnel-bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .funnel-label { width:130px; font-size:12px; color:#c7cad1; flex-shrink:0; }
  .funnel-track { flex:1; height:10px; background:#1a1e28; border-radius:6px; overflow:hidden; }
  .funnel-fill { height:100%; background:#3b5bfd; }
  .funnel-count { width:34px; text-align:right; font-size:12px; color:#9aa0a6; }
  .overdue { color:#e57373; font-weight:600; }
  .empty { color:#9aa0a6; font-size:13px; padding:8px 0; }
  #state { color:#9aa0a6; padding:20px 0; }
</style>
</head>
<body>
  <h1>Operator Dashboard</h1>
  <div class="sub">Nexus Forge — how the sales operation is actually running.</div>
  <div class="nav">
    <a href="/forge-admin.html">Forge Admin</a>
    <a href="/room.html?builder=1">Open Builder</a>
  </div>
  <div id="state">Loading…</div>
  <div id="content" hidden>
    <div class="cards" id="cards"></div>

    <h2>Funnel</h2>
    <div id="funnel"></div>

    <h2>Follow-up queue</h2>
    <table id="followup-table">
      <thead><tr><th>Business</th><th>Phone</th><th>Worker</th><th>Follow-up</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="followup-empty" hidden>Nothing on the follow-up queue.</div>

    <h2>Per worker</h2>
    <table id="worker-table">
      <thead><tr><th>Worker</th><th>Assigned</th><th>Contacted</th><th>Interested</th><th>Booked</th><th>DNC</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="worker-empty" hidden>No leads assigned to anyone yet.</div>
  </div>

<script>
const FUNNEL_LABELS = { assigned: 'Assigned', interested: 'Interested', demo_requested: 'Demo requested', appointment_booked: 'Appointment booked' };

async function load() {
  const stateEl = document.getElementById('state');
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/forge-metrics', { credentials: 'include' });
    if (res.status === 401) { window.location.href = '/room-login.html'; return; }
    if (res.status === 403) { stateEl.textContent = 'Operator access required.'; return; }
    if (!res.ok) throw new Error('load failed');
    const m = await res.json();
    stateEl.hidden = true;
    content.hidden = false;
    renderCards(m.totals);
    renderFunnel(m.funnel);
    renderFollowups(m.followUpQueue);
    renderWorkers(m.byWorker);
  } catch (err) {
    stateEl.textContent = 'Could not load metrics.';
  }
}

function renderCards(totals) {
  const items = [
    ['Total leads', totals.leads],
    ['Assigned', totals.assigned],
    ['Unassigned', totals.unassigned],
    ['Contacted', totals.contacted],
    ['Never contacted', totals.neverContacted],
    ['Suppressed', totals.suppressed],
  ];
  document.getElementById('cards').innerHTML = items.map(function (pair) {
    return '<div class="card"><div class="num">' + pair[1] + '</div><div class="label">' + pair[0] + '</div></div>';
  }).join('');
}

function renderFunnel(funnel) {
  const max = Math.max(1, funnel.assigned || 0);
  document.getElementById('funnel').innerHTML = Object.keys(FUNNEL_LABELS).map(function (key) {
    const label = FUNNEL_LABELS[key];
    const count = funnel[key] || 0;
    const pct = Math.round((count / max) * 100);
    return '<div class="funnel-bar">' +
      '<div class="funnel-label">' + label + '</div>' +
      '<div class="funnel-track"><div class="funnel-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="funnel-count">' + count + '</div>' +
      '</div>';
  }).join('');
}

function renderFollowups(queue) {
  const tbody = document.querySelector('#followup-table tbody');
  const empty = document.getElementById('followup-empty');
  if (!queue.length) { tbody.innerHTML = ''; empty.hidden = false; return; }
  empty.hidden = true;
  tbody.innerHTML = queue.map(function (f) {
    return '<tr>' +
      '<td>' + escapeHtml(f.businessName) + '</td>' +
      '<td>' + escapeHtml(f.phone) + '</td>' +
      '<td>' + escapeHtml(f.assignedTo || '—') + '</td>' +
      '<td class="' + (f.overdue ? 'overdue' : '') + '">' + escapeHtml(f.followUpDate) + (f.overdue ? ' (overdue)' : '') + '</td>' +
      '</tr>';
  }).join('');
}

function renderWorkers(workers) {
  const tbody = document.querySelector('#worker-table tbody');
  const empty = document.getElementById('worker-empty');
  if (!workers.length) { tbody.innerHTML = ''; empty.hidden = false; return; }
  empty.hidden = true;
  tbody.innerHTML = workers.map(function (w) {
    return '<tr>' +
      '<td>' + escapeHtml(w.username) + '</td>' +
      '<td>' + w.assigned + '</td>' +
      '<td>' + w.contacted + '</td>' +
      '<td>' + (w.byDisposition.interested || 0) + '</td>' +
      '<td>' + (w.byDisposition.appointment_booked || 0) + '</td>' +
      '<td>' + (w.byDisposition.do_not_call || 0) + '</td>' +
      '</tr>';
  }).join('');
}

function escapeHtml(s) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(s || '').replace(/[&<>"']/g, function (c) { return map[c]; });
}

load();
</script>
</body>
</html>
