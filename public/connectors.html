<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nexus // Connectors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; }
  .connectors-panel { padding: 16px; font: 13px/1.5 Inter, -apple-system, sans-serif; color: #e8eefb; height: 100%; box-sizing: border-box; overflow-y: auto; }
  .section-label {
    font: 600 10px 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
    color: #5e6b81; margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }
  .card { background: #ffffff03; border: 1px solid #26334d; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .card-name { font: 700 13px 'JetBrains Mono', monospace; }
  .badge { font: 700 9px 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; }
  .badge-live { background: #58edb01c; color: #58edb0; }
  .badge-soon { background: #5e6b8122; color: #5e6b81; }
  .card-desc { font-size: 12px; color: #91a0b9; line-height: 1.55; margin-bottom: 12px; }
  .card-tools { font: 400 10px 'JetBrains Mono', monospace; color: #5e6b81; margin-bottom: 12px; line-height: 1.8; }
  .card-tools span { background: #ffffff04; border: 1px solid #26334d; padding: 2px 7px; border-radius: 4px; margin-right: 6px; display: inline-block; margin-bottom: 4px; }
  .url-row { display: flex; gap: 8px; }
  .url-box { flex: 1; background: #00000030; border: 1px solid #26334d; border-radius: 6px; padding: 8px 10px; font: 11px 'JetBrains Mono', monospace; color: #91a0b9; overflow-x: auto; white-space: nowrap; }
  .copy-btn { font: 700 10px 'JetBrains Mono', monospace; letter-spacing: 0.03em; background: #4b8dff; color: #06090f; border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; text-transform: uppercase; flex-shrink: 0; }
  .copy-btn:active { opacity: 0.7; }

  .canvas-title-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10000;
    font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
    color: #58d7ff; background: #111827e8; border: 1px solid #3c5a84; border-radius: 8px;
    padding: 7px 16px; backdrop-filter: blur(12px);
  }
  .return-link {
    position: fixed; top: 12px; left: 12px; z-index: 10000;
    font: 700 10px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
    color: #91a0b9; text-decoration: none; background: #111827e8; border: 1px solid #26334d;
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(12px);
  }
  .return-link:hover { color: #58d7ff; border-color: #4b8dff77; }
</style>
</head>
<body>
<script type="module">
  import { mountCanvas } from '/canvas-engine.js';
  import '/nex-chat-bar.js';

  const titleBar = document.createElement('div');
  titleBar.className = 'canvas-title-bar';
  titleBar.textContent = 'Connector Bay';
  document.body.appendChild(titleBar);

  const returnLink = document.createElement('a');
  returnLink.className = 'return-link';
  returnLink.href = '/';
  returnLink.textContent = '← Dashboard';
  document.body.appendChild(returnLink);

  const canvas = mountCanvas({ canvasId: 'connectors' });

  const body = document.createElement('div');
  body.className = 'connectors-panel';
  body.innerHTML = `
    <div class="section-label">Live</div>
    <div class="card">
      <div class="card-top"><span class="card-name">github-write</span><span class="badge badge-live">Live</span></div>
      <p class="card-desc">Read and write files in a GitHub repo — create, update, delete, and list. Built and tested end to end, used every night to ship this whole project.</p>
      <div class="card-tools"><span>create_file</span><span>update_file</span><span>delete_file</span><span>list_files</span></div>
      <div class="url-row">
        <div class="url-box" id="url-github">https://github-write-mcp.vercel.app/api/mcp</div>
        <button class="copy-btn" id="copy-github">Copy</button>
      </div>
    </div>

    <div class="section-label">Coming soon</div>
    <div class="card">
      <div class="card-top"><span class="card-name">email</span><span class="badge badge-soon">Planned</span></div>
      <p class="card-desc">Send emails on your behalf — client updates, notifications, follow-ups.</p>
    </div>
    <div class="card">
      <div class="card-top"><span class="card-name">domains</span><span class="badge badge-soon">Planned</span></div>
      <p class="card-desc">Check availability, register, and point domains at a live deployment.</p>
    </div>
    <div class="card">
      <div class="card-top"><span class="card-name">figma</span><span class="badge badge-soon">Planned</span></div>
      <p class="card-desc">Read real design files and turn them into working code.</p>
    </div>
    <div class="card">
      <div class="card-top"><span class="card-name">stripe</span><span class="badge badge-soon">Planned</span></div>
      <p class="card-desc">Payments and billing — for you, or for the businesses you build sites for.</p>
    </div>
  `;
  canvas.addPanel({ id: 'connectors-list', title: 'CONNECTORS', content: body, x: 80, y: 80, w: 420, h: 520 });

  document.getElementById('copy-github').addEventListener('click', (event) => {
    const text = document.getElementById('url-github').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      const original = btn.innerText;
      btn.innerText = 'Copied';
      setTimeout(() => { btn.innerText = original; }, 1500);
    });
  });
</script>
</body>
</html>
