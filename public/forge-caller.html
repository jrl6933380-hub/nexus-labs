<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus Forge — Field</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #14100b; color: #f2e9dd; padding-bottom: 40px;
  }
  .topbar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: #1c150d; border-bottom: 2px solid #d97b2f;
  }
  .hamburger {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid #3a2c1c; background: #241a10;
    color: #f2e9dd; font-size: 18px; cursor: pointer;
  }
  .topbar h1 { font-size: 15px; margin: 0; flex: 1; }
  .badge { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: #14100b; background: #d97b2f; padding: 3px 8px; border-radius: 999px; font-weight: 700; }

  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: none; }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(300px, 85vw); z-index: 41;
    background: #1c150d; border-right: 1px solid #3a2c1c; transform: translateX(-100%); transition: transform .2s ease;
    overflow-y: auto; padding: 14px 10px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #c9a97a; margin: 6px 8px 10px; }
  .queue-item {
    display: block; width: 100%; text-align: left; background: #241a10; border: 1px solid #3a2c1c;
    border-radius: 10px; padding: 10px; margin-bottom: 8px; color: #f2e9dd; cursor: pointer;
  }
  .queue-item.selected { border-color: #d97b2f; background: #2b1f13; }
  .queue-item .biz { font-weight: 600; font-size: 14px; }
  .queue-item .meta { font-size: 11px; color: #a9977d; margin-top: 2px; }
  .queue-item .disp { display: inline-block; margin-top: 5px; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #3a2c1c; color: #d9b98a; }

  main { padding: 16px 14px; max-width: 640px; margin: 0 auto; }
  .empty-main { color: #a9977d; text-align: center; padding: 60px 20px; }
  .lead-header h2 { font-size: 19px; margin: 0 0 2px; }
  .lead-header .meta { color: #a9977d; font-size: 13px; margin-bottom: 14px; }

  .call-btn {
    display: block; text-align: center; background: #2e7d32; color: white; text-decoration: none;
    padding: 13px; border-radius: 10px; font-weight: 700; font-size: 16px; margin-bottom: 8px;
  }
  .answered-btn {
    display: block; width: 100%; text-align: center; background: #241a10; color: #d97b2f;
    border: 1px solid #d97b2f; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-bottom: 16px; cursor: pointer;
  }

  section.panel { background: #1c150d; border: 1px solid #3a2c1c; border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  section.panel > .panel-head {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; cursor: pointer;
    font-weight: 600; font-size: 13px; color: #f0dfc5;
  }
  section.panel > .panel-body { padding: 0 14px 14px; display: none; font-size: 13.5px; line-height: 1.55; }
  section.panel.open > .panel-body { display: block; }
  .panel-head .chev { color: #a9977d; }

  .script-line { margin-bottom: 10px; }
  .script-label { color: #d97b2f; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .obj { border-top: 1px solid #3a2c1c; padding-top: 8px; margin-top: 8px; }
  .obj .q { color: #f0dfc5; font-weight: 600; }
  .obj .a { color: #d9cdb8; }

  .site-actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .site-actions button, .site-actions a {
    background: #d97b2f; color: #14100b; border: none; border-radius: 8px; padding: 9px 13px; font-weight: 700; font-size: 12px; cursor: pointer;
  }
  .site-actions button.secondary, .site-actions a.secondary { background: #241a10; color: #f0dfc5; border: 1px solid #3a2c1c; }
  .template-choices { display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px; }
  .template-choices button { min-height:44px;padding:9px 13px;border:1px solid #73502b;border-radius:9px;background:#241a10;color:#f2e9dd;cursor:pointer; }
  .template-choices button[aria-pressed=true] { background:#d97b2f;color:#14100b; }
  .site-frame-wrap { border: 1px solid #3a2c1c; border-radius: 10px; overflow: hidden; height: 360px; margin-bottom: 10px; background: #0b0806; }
  .site-frame-wrap iframe { width: 100%; height: 100%; border: 0; }
  .site-status { font-size: 12px; color: #a9977d; margin-bottom: 8px; }
  .cust { margin-top: 12px; } .cust summary { font-weight: 600; padding: 10px 0; cursor: pointer; }
  .cust label { display: block; font-size: 13px; margin: 8px 0; } .cust input, .cust textarea, .cust select { display: block; width: 100%; box-sizing: border-box; padding: 9px; margin-top: 4px; font: inherit; border: 1px solid #ccc; border-radius: 8px; }
  .cu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; } .cu-grid button { padding: 0; border: 2px solid transparent; border-radius: 8px; background: #222; overflow: hidden; aspect-ratio: 1; } .cu-grid button.on { border-color: #d97b2f; } .cu-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cu-help { font-size: 13px; opacity: .8; margin: 2px 0 8px; } .cu-dots { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 8px; } .cu-dot { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: #2a2118; opacity: .6; } .cu-dot.on { background: #d97b2f; color: #fff; opacity: 1; } .cu-nav { display: flex; gap: 8px; margin-top: 10px; }
  .ord-look { display: block; padding: 6px 0; font-size: 14px; } .ord-look input { display: inline; width: auto; margin: 0 6px 0 0; }
  .cu-h { font-weight: 600; font-size: 13px; margin: 12px 0 4px; } .cu-row { display: flex; gap: 8px; } .cu-row input:last-child { max-width: 110px; }
  .share-box { margin-top: 14px; padding-top: 10px; border-top: 1px solid #ddd; }
  .edit-row { display: flex; gap: 8px; }
  .edit-row input {
    flex: 1; background: #0b0806; border: 1px solid #3a2c1c; border-radius: 8px; padding: 9px; color: #f2e9dd; font-size: 13px;
  }
  .edit-row button { background: #3b5bfd; color: white; border: none; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 13px; }

  select, textarea, input[type=date] {
    width: 100%; background: #0b0806; color: #f2e9dd; border: 1px solid #3a2c1c;
    border-radius: 8px; padding: 8px; font-size: 14px; margin-bottom: 8px;
  }
  textarea { min-height: 60px; resize: vertical; }
  .save-btn { width: 100%; background: #3b5bfd; color: white; border: none; border-radius: 8px; padding: 10px; font-weight: 600; font-size: 14px; }
  .saved { color: #4caf50; font-size: 12px; margin-top: 6px; display: none; }
  #state { color: #a9977d; padding: 24px 14px; }

  /* Earnings strip (drawer) */
  .earnings { background: #241a10; border: 1px solid #3a2c1c; border-radius: 12px; padding: 12px; margin: 0 0 14px; }
  .earnings .row { display: flex; justify-content: space-between; align-items: baseline; }
  .earnings .owed { font-size: 22px; font-weight: 800; color: #4caf50; }
  .earnings .label { font-size: 11px; color: #a9977d; text-transform: uppercase; letter-spacing: .05em; }
  .earnings .clients { font-size: 13px; color: #f0dfc5; margin-top: 6px; }

  /* Close-the-deal panel */
  .tier-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .tier-opt {
    flex: 1; background: #0b0806; border: 1px solid #3a2c1c; border-radius: 10px; padding: 10px 6px;
    color: #f2e9dd; text-align: center; cursor: pointer;
  }
  .tier-opt .name { font-weight: 700; font-size: 13px; }
  .tier-opt .price { font-size: 12px; color: #a9977d; margin-top: 2px; }
  .tier-opt.selected { border-color: #4caf50; background: #13220f; }
  .tier-opt.selected .price { color: #8fd18c; }
  .tier-note { font-size: 12px; color: #a9977d; margin-bottom: 10px; min-height: 16px; }
  .signup-btn { width: 100%; background: #2e7d32; color: white; border: none; border-radius: 10px; padding: 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
  .signup-btn:disabled { opacity: .5; cursor: default; }
  .signed-banner { background: #13220f; border: 1px solid #4caf50; color: #8fd18c; border-radius: 10px; padding: 12px; font-weight: 700; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="hamburger" id="menu-btn" aria-label="Open lead queue">☰</button>
    <h1>Nexus Forge — Field</h1>
    <span class="badge">On shift</span>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="drawer" id="drawer">
    <div class="earnings" id="earnings" hidden>
      <div class="row"><span class="label">You're owed</span><span class="owed" id="owed-amount">&#36;0.00</span></div>
      <div class="row"><span class="label">Paid so far</span><span id="paid-amount">&#36;0.00</span></div>
      <div class="clients" id="client-count"></div>
      <button type="button" class="answered-btn" id="payouts-btn" style="margin:10px 0 0" hidden>Set up payouts</button>
    </div>
    <h2>Your leads</h2>
    <div id="queue-list"></div>
  </div>

  <div id="state">Loading…</div>
  <main id="main" hidden>
    <div class="empty-main" id="empty-main">Tap ☰ and pick a lead to get started.</div>
    <div id="lead-view" hidden></div>
  </main>

<script type="module">
import {generatePitchScript} from "./forge-pitch.js";
const DISPOSITIONS = [
  ['', 'Log outcome…'], ['no_answer', 'No answer'], ['voicemail_left', 'Voicemail left'],
  ['follow_up', 'Follow up'], ['interested', 'Interested'], ['demo_requested', 'Demo requested'],
  ['appointment_booked', 'Appointment booked'], ['not_interested', 'Not interested'],
  ['do_not_call', 'Do not call'], ['wrong_number', 'Wrong number'], ['already_has_provider', 'Already has provider'],
];

let leads = [];
let selectedId = null;
let signedLeads = {}; // Redis lead id -> Stripe payment link, this session

// Filled from the server's approved offer, shared with the pitch and billing rules.
let TIERS = [];
function approvedTiers(offer) {
  return (offer?.tiers || []).map(function (tier) {
    if (tier.signUpCents) return {key:tier.key,name:tier.name,
      price:money(tier.signUpCents)+' today · then '+money(tier.priceCents)+'/mo',
      note:'Website and hosting. First month included in signup price. Unlimited website edits during launch.'};
    return { key: tier.key, name: tier.name, price: money(tier.priceCents) + '/mo',
      note: 'Site + hosting, ' + (tier.editsPerMonth === null ? 'unlimited minor edits' : tier.editsPerMonth + ' edit' + (tier.editsPerMonth === 1 ? '' : 's') + ' a month') + (tier.aiAssistant ? ', AI assistant included.' : '.') };
  });
}

function money(cents) { return '\x24' + ((cents || 0) / 100).toFixed(2); }

async function loadEarnings() {
  try {
    const res = await fetch('/api/forge-clients', { credentials: 'include' });
    if (!res.ok) return;
    const data = await res.json();
    const active = (data.clients || []).filter(function (c) { return c.status === 'active'; }).length;
    const waiting = (data.clients || []).filter(function (c) { return c.status === 'pending_payment'; }).length;
    document.getElementById('owed-amount').textContent = money(data.owedCents);
    document.getElementById('paid-amount').textContent = money(data.paidCents);
    document.getElementById('client-count').textContent = active + (active === 1 ? ' active client' : ' active clients') +
      (waiting ? ' \u00b7 ' + waiting + ' waiting to pay' : '');
    document.getElementById('earnings').hidden = false;
    // Payouts are handled by hand for now (no Stripe Connect yet), so the
    // "Set up payouts" button stays hidden. Re-enable once Connect is on:
    if (window.FORGE_CONNECT_PAYOUTS) loadPayoutStatus();
  } catch (err) { /* earnings are a bonus; never block the calling flow */ }
}

async function loadPayoutStatus() {
  const btn = document.getElementById('payouts-btn');
  try {
    const res = await fetch('/api/forge-connect', { credentials: 'include' });
    if (!res.ok) return;
    const s = await res.json();
    if (s.payoutsEnabled) { btn.hidden = true; return; }
    btn.textContent = s.connected ? 'Finish payout setup' : 'Set up payouts';
    btn.hidden = false;
  } catch (err) { /* optional */ }
}

async function startPayoutSetup() {
  const btn = document.getElementById('payouts-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/forge-connect', { method: 'POST', credentials: 'include' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not start payout setup.');
    window.location.href = data.url;
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
  }
}

function defaultSignupTier() {
  return TIERS.find(t=>t.key==='launch') || TIERS.find(t=>t.key==='standard') || TIERS[0];
}

function closeDealHtml(lead) {
  if (signedLeads[lead.id]) {
    const url = signedLeads[lead.id];
    if (url === 'pending') {
      return '<div class="signed-banner">Signed. Payment link failed to generate; ask a manager to resend it from Forge Ops.</div>';
    }
    const smsBody = encodeURIComponent('Here is your secure link to get your new website started: ' + url);
    return '<div class="signed-banner">Signed! Now send them the payment link while you are still on the phone.</div>' +
      '<a class="call-btn" style="margin-top:10px" href="sms:' + escapeHtml(lead.phone) + '?&body=' + smsBody + '">Text them the payment link</a>' +
      '<button type="button" class="answered-btn" id="copy-pay-link" data-url="' + escapeHtml(url) + '">Copy link</button>' +
      '<div class="tier-note">Commissions are recorded only after payment clears.</div>';
  }
  if (!TIERS.length) return '<p>Approved offer unavailable. Reload before quoting a price or signing up.</p>';
  const firstChoice = defaultSignupTier();
  return '' +
    '<div class="tier-row">' + TIERS.map(function (t) {
      return '<button type="button" class="tier-opt' + (t.key === firstChoice.key ? ' selected' : '') + '" data-tier="' + t.key + '">' +
        '<div class="name">' + t.name + '</div><div class="price">' + t.price + '</div></button>';
    }).join('') + '</div>' +
    '<div class="tier-note" id="tier-note">' + firstChoice.note + '</div>' +
    '<button type="button" class="signup-btn" id="signup-btn">Sign them up: ' + firstChoice.name + '</button>';
}

function escapeHtml(s) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(s || '').replace(/[&<>"']/g, function (c) { return map[c]; });
}

async function loadLeads() {
  const stateEl = document.getElementById('state');
  const main = document.getElementById('main');
  try {
    const res = await fetch('/api/forge-leads', { credentials: 'include' });
    if (res.status === 401) { stateEl.textContent = 'Please sign in first.'; setTimeout(function () { window.location.href = '/room-login.html?next=' + encodeURIComponent('/forge-caller.html'); }, 800); return; }
    if (res.status === 403) { stateEl.textContent = "This account doesn't have Forge field access yet. Ask a manager to grant it."; return; }
    if (!res.ok) throw new Error('load failed');
    const data = await res.json();
    leads = (data.leads || []).filter(function (l) { return !l.suppressed; });
    try { const or = await fetch('/api/forge-orders', { credentials: 'include' }); if (or.ok) { orders = {}; (await or.json()).orders.forEach(function (x) { orders[x.leadId] = x; }); } } catch (e) { /* orders are optional */ }
    stateEl.hidden = true;
    main.hidden = false;
    renderQueue();
    if (selectedId) renderLead(selectedId);
  } catch (err) {
    stateEl.textContent = 'Could not load leads. Pull to refresh.';
  }
}

function renderQueue() {
  const list = document.getElementById('queue-list');
  if (!leads.length) { list.innerHTML = '<div style="color:#a9977d;font-size:13px;padding:10px;">No leads assigned yet.</div>'; return; }
  list.innerHTML = leads.map(function (l) {
    const dispLabel = l.lastDisposition ? l.lastDisposition.replace(/_/g, ' ') : 'new';
    return '<button type="button" class="queue-item' + (l.id === selectedId ? ' selected' : '') + '" data-id="' + l.id + '">' +
      '<div class="biz">' + escapeHtml(l.businessName) + '</div>' +
      '<div class="meta">' + escapeHtml(l.category || '') + '</div>' +
      '<span class="disp">' + escapeHtml(dispLabel) + '</span>' +
    '</button>';
  }).join('');
  list.querySelectorAll('.queue-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      selectedId = btn.dataset.id;
      closeDrawer();
      renderLead(selectedId);
      renderQueue();
    });
  });
}

function panelHtml(id, title, bodyHtml, openByDefault) {
  return '<section class="panel' + (openByDefault ? ' open' : '') + '" id="' + id + '">' +
    '<div class="panel-head" data-toggle="' + id + '"><span>' + title + '</span><span class="chev">▾</span></div>' +
    '<div class="panel-body">' + bodyHtml + '</div>' +
  '</section>';
}

function scriptBodyHtml(pitch) {
  const weaknesses = pitch.weaknesses.map(function (w) { return '<div>• ' + escapeHtml(w) + '</div>'; }).join('');
  const questions = pitch.discoveryQuestions.map(function (q) { return '<div>• ' + escapeHtml(q) + '</div>'; }).join('');
  const objections = pitch.objections.map(function (o) {
    return '<div class="obj"><div class="q">"' + escapeHtml(o.objection) + '"</div><div class="a">' + escapeHtml(o.response) + '</div></div>';
  }).join('');
  return '' +
    '<div class="script-line"><div class="script-label">Opener</div>' + escapeHtml(pitch.opener) + '</div>' +
    '<div class="script-line"><div class="script-label">Why you called</div>' + weaknesses + '</div>' +
    '<div class="script-line"><div class="script-label">Discovery questions</div>' + questions + '</div>' +
    '<div class="script-line"><div class="script-label">' + escapeHtml(pitch.demoLabel) + '</div>' + escapeHtml(pitch.demoLine) + '</div>' +
    '<div class="script-line"><div class="script-label">Approved offer</div>' + escapeHtml(pitch.pricingLine) + '</div>' +
    '<div class="script-line"><div class="script-label">Objections</div>' + objections + '</div>' +
    '<div class="script-line"><div class="script-label">Optional features</div>' + escapeHtml(pitch.upsell) + '</div>' +
    '<div class="script-line"><div class="script-label">Next step</div>' + escapeHtml(pitch.nextStep) + '</div>';
}

function siteBodyHtml(lead) {
  let statusLine = '';
  let frame = '';
  let showGenerate = !lead.siteStatus || lead.siteStatus === 'none' || lead.siteStatus === 'error' || (lead.siteStatus === 'ready' && !lead.siteHtml);
  if (lead.siteStatus === 'generating') statusLine = 'Building the preview… this can take up to a minute.';
  if (lead.siteStatus === 'error') statusLine = 'Something went wrong generating this one — try again.';
  if (lead.siteStatus === 'ready' && lead.siteHtml) {
    frame = '<div class="site-frame-wrap"><iframe id="site-frame" sandbox="allow-scripts allow-forms" title="Demo site preview"></iframe></div>';
  }
  const variants = Array.isArray(lead.siteVariants) ? lead.siteVariants : [];
  const choices = variants.length ? '<div class="template-choices" role="group" aria-label="Website direction">' + variants.map(function (v) { return '<button type="button" data-template="' + escapeHtml(v.id) + '" aria-pressed="' + String(v.id === lead.siteTemplateId) + '">' + escapeHtml(v.label) + '</button>'; }).join('') + '</div>' : '';
  return choices +
    '<div class="site-actions"><a class="secondary" href="/forge-templates.html" target="_blank" rel="noopener">Browse starters ↗</a>' +
      (showGenerate ? '<button type="button" id="generate-site-btn">Build previews</button>' : '') +
      (lead.siteStatus === 'ready' ? '<button type="button" class="secondary" id="regen-site-btn">Rebuild 3 looks</button><button type="button" class="secondary" id="expand-site-btn">Full screen ↗</button>' : '') +
    '</div>' +
    (statusLine ? '<div class="site-status">' + statusLine + '</div>' : '') +
    frame +
    (lead.siteStatus === 'ready' ? customizeHtml(lead) + shareHtml(lead) + orderHtml(lead) : '');
}

var COLORS = [['', 'Keep current'], ['paper-green', 'Warm paper'], ['lime-night', 'Lime night'], ['mint-air', 'Mint'], ['barber-red', 'Barber red'], ['navy-gold', 'Navy + gold'], ['blush', 'Blush'], ['ink-bone', 'Ink + bone'], ['forest', 'Forest'], ['terracotta', 'Terracotta'], ['sky', 'Sky'], ['plum', 'Plum'], ['sand', 'Sand']];
var CU_STEPS = ['Name', 'Services', 'Hours', 'Photos', 'Look'];
var cuStep = 0;
function customizeHtml(lead) {
  var c = lead.siteContent || {};
  var svc = (c.services || []).filter(function (x) { return x && x.name; }).concat([{}, {}, {}, {}, {}, {}]).slice(0, 6);
  var hrs = (c.hours || []).concat([{}, {}, {}, {}]).slice(0, 4);
  var v = function (x) { return escapeHtml(x || ''); };
  var step = function (n, title, help, body) { return '<div class="cu-step" data-step="' + n + '"' + (n === cuStep ? '' : ' hidden') + '><div class="cu-h">' + (n + 1) + ' of ' + CU_STEPS.length + ' · ' + title + '</div><div class="cu-help">' + help + '</div>' + body + '</div>'; };
  return '<details class="cust"' + (cuStep > 0 ? ' open' : '') + '><summary>Edit this demo</summary><div class="cu-dots">' + CU_STEPS.map(function (t, i) { return '<span class="cu-dot' + (i === cuStep ? ' on' : '') + '">' + t + '</span>'; }).join('') + '</div>' +
    step(0, 'Name and headline', 'Say the shop\'s name the way they do. Keep the headline short and plain. Skip big claims like "best in town": they are not allowed on a sample.',
      '<label>Headline<input id="cu-headline" maxlength="90" value="' + v(c.headline) + '"></label><label>Intro line<input id="cu-intro" maxlength="220" value="' + v(c.intro) + '"></label><label>About (optional)<textarea id="cu-about" maxlength="600" rows="3">' + v(c.about) + '</textarea></label>') +
    step(1, 'Services and prices', 'Add what they do most, 3 to 5 is plenty. Only put a price if the owner told you. Blank price is fine.',
      svc.map(function (x) { return '<div class="cu-row"><input class="cu-sn" placeholder="Service" maxlength="60" value="' + v(x.name) + '"><input class="cu-sp" placeholder="$" maxlength="20" value="' + v(x.price) + '"></div>'; }).join('')) +
    step(2, 'Hours', 'Only what they told you. Example: Mon-Fri, 9-6. Leave blank if you do not know yet.',
      hrs.map(function (x) { return '<div class="cu-row"><input class="cu-hd" placeholder="Day" maxlength="30" value="' + v(x.day) + '"><input class="cu-ht" placeholder="9-5" maxlength="40" value="' + v(x.time) + '"></div>'; }).join('')) +
    step(3, 'Photos', 'Pick 3 to 6. These are stock photos and are labelled that way on the page. The first one is the top picture.',
      '<div class="cu-row"><input id="cu-pq" maxlength="80" value="' + v(/barber/i.test(lead.category || '') ? 'barber haircut' : (lead.category || '')) + '"><button type="button" id="cu-pfind" class="secondary">Find</button></div><div class="site-status" id="cu-pmsg">Tap a photo to add it. Tap a picked one to remove it.</div><div class="cu-grid" id="cu-psel"></div><div class="cu-grid" id="cu-pres"></div>') +
    step(4, 'Look and finish', 'Pick a color that fits the shop. Then update, and the same link shows the new version.',
      '<label>Color<select id="cu-palette">' + COLORS.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === (lead.sitePalette || '') ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label><button type="button" id="cu-save">Update all 3 looks</button>') +
    '<div class="cu-nav"><button type="button" class="secondary" id="cu-back"' + (cuStep === 0 ? ' hidden' : '') + '>Back</button><button type="button" id="cu-next"' + (cuStep === CU_STEPS.length - 1 ? ' hidden' : '') + '>Next</button></div>' +
    '<div class="site-status" id="cu-msg"></div></details>';
}
var orders = {};
function orderHtml(lead) {
  var looks = Array.isArray(lead.siteVariants) ? lead.siteVariants : [];
  if (!looks.length) return '';
  var o = orders[lead.id];
  return '<div class="share-box"><div class="cu-h">They picked one? Send it to build</div>' +
    '<div class="cu-help">Tick the look they liked and add anything they asked for. We build the final site from it. You do not build it.</div>' +
    looks.map(function (v) { return '<label class="ord-look"><input type="radio" name="ord-look" value="' + escapeHtml(v.id) + '"' + (v.id === lead.siteTemplateId ? ' checked' : '') + '> ' + escapeHtml(v.label) + '</label>'; }).join('') +
    '<label>Notes from the owner<textarea id="ord-notes" maxlength="1500" rows="3" placeholder="Colors, services to add, hours, anything they said"></textarea></label>' +
    '<button type="button" id="ord-save">Send to build</button>' +
    '<div class="site-status" id="ord-msg">' + (o ? 'Sent: ' + escapeHtml(o.lookLabel) + ' (' + escapeHtml(o.status) + '). Send again to change it.' : 'Nothing sent yet.') + '</div></div>';
}
function shareHtml(lead) {
  return '<div class="share-box"><div class="cu-h">Send the demo</div>' +
    '<div class="site-actions"><button type="button" id="share-copy">Copy private link</button><a class="secondary" id="share-sms" href="#">Text it</a><button type="button" class="secondary" id="share-revoke">Turn link off</button></div>' +
    '<div class="site-status" id="share-msg">One link, all 3 looks, swipe to see them. Forge never sends anything for you.</div></div>';
}

var cuLeadId = null;
function renderLead(id) {
  if (cuLeadId !== id) { cuLeadId = id; cuStep = 0; }
  const lead = leads.find(function (l) { return l.id === id; });
  document.getElementById('empty-main').hidden = true;
  const view = document.getElementById('lead-view');
  view.hidden = false;
  if (!lead) { view.innerHTML = ''; return; }
  lead.pitch = generatePitchScript(lead, lead.pitch?.offer);
  TIERS = approvedTiers(lead.pitch.offer);

  const options = DISPOSITIONS.map(function (pair) {
    return '<option value="' + pair[0] + '"' + (lead.lastDisposition === pair[0] ? ' selected' : '') + '>' + pair[1] + '</option>';
  }).join('');

  view.innerHTML = '' +
    '<div class="lead-header"><h2>' + escapeHtml(lead.businessName) + '</h2>' +
      '<div class="meta">' + escapeHtml(lead.category || '') + (lead.location ? ' · ' + escapeHtml(lead.location) : '') + '</div>' +
    '</div>' +
    '<a class="call-btn" href="tel:' + escapeHtml(lead.phone) + '">Call ' + escapeHtml(lead.phone) + '</a>' +
    '<button type="button" class="answered-btn" id="answered-btn">They answered — open call workspace</button>' +
    '<p id="call-session-note" role="status" hidden></p>' +
    panelHtml('panel-script', 'Pitch script', scriptBodyHtml(lead.pitch), true) +
    panelHtml('panel-site', 'Site preview', siteBodyHtml(lead), lead.siteStatus !== 'none') +
    panelHtml('panel-close', "They're in: sign them up", closeDealHtml(lead), Boolean(signedLeads[lead.id])) +
    panelHtml('panel-log', 'Log this call', '' +
      '<select id="disposition">' + options + '</select>' +
      '<textarea id="notes" placeholder="Notes from the call…">' + escapeHtml(lead.notes || '') + '</textarea>' +
      '<input type="date" id="followup" value="' + (lead.followUpDate || '') + '" />' +
      '<button class="save-btn" id="save-outcome">Save outcome</button>' +
      '<div class="saved" id="saved-msg">Saved.</div>', false);

  view.querySelectorAll('.panel-head').forEach(function (head) {
    head.addEventListener('click', function () {
      document.getElementById(head.dataset.toggle).classList.toggle('open');
    });
  });

  const siteFrame = document.getElementById('site-frame');
  if (siteFrame && lead.siteHtml) siteFrame.srcdoc = lead.siteHtml;

  view.querySelectorAll('[data-template]').forEach(function (btn) {
    btn.addEventListener('click', function () { runSiteAction(lead.id, 'select_template', undefined, btn.dataset.template); });
  });
  const expandBtn = document.getElementById('expand-site-btn');
  if (expandBtn) expandBtn.addEventListener('click', function () {
    const dialog = document.createElement('dialog');
    dialog.setAttribute('aria-label', 'Full website preview');
    dialog.style.cssText = 'position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#14100b;color:#f2e9dd;';
    const box = document.createElement('div');
    box.style.cssText = 'height:100%;display:flex;flex-direction:column;';
    const close = document.createElement('button');
    close.type = 'button'; close.textContent = '← Back to call';
    close.style.cssText = 'flex-shrink:0;min-height:48px;padding:12px;border:0;background:#241a10;color:#f2e9dd;font:inherit;';
    const frame = document.createElement('iframe');
    frame.title = 'Full website preview';frame.setAttribute('sandbox', 'allow-scripts allow-forms');
    frame.style.cssText = 'border:0;width:100%;flex:1;min-height:0;';frame.srcdoc = lead.siteHtml;
    close.addEventListener('click', function () { dialog.close(); });
    dialog.addEventListener('close', function () { dialog.remove();expandBtn.focus(); });
    box.append(close, frame);dialog.append(box);document.body.append(dialog);dialog.showModal();
  });

  let chosenTier = defaultSignupTier()?.key || '';
  view.querySelectorAll('.tier-opt').forEach(function (opt) {
    opt.addEventListener('click', function () {
      chosenTier = opt.dataset.tier;
      view.querySelectorAll('.tier-opt').forEach(function (o) { o.classList.toggle('selected', o === opt); });
      const tier = TIERS.find(function (t) { return t.key === chosenTier; });
      document.getElementById('tier-note').textContent = tier.note;
      document.getElementById('signup-btn').textContent = 'Sign them up: ' + tier.name;
    });
  });

  const signupBtn = document.getElementById('signup-btn');
  if (signupBtn) signupBtn.addEventListener('click', async function () {
    const tier = TIERS.find(function (t) { return t.key === chosenTier; });
    if (!confirm('Sign ' + lead.businessName + ' up for ' + tier.name + ' (' + tier.price + ')?')) return;
    signupBtn.disabled = true;
    signupBtn.textContent = 'Signing...';
    try {
      const res = await fetch('/api/forge-clients', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'convert', leadId: lead.id, tier: chosenTier }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not sign them up.');
      signedLeads[lead.id] = data.checkoutUrl || 'pending';
      renderLead(lead.id);
      loadEarnings();
    } catch (err) {
      alert(err.message);
      signupBtn.disabled = false;
      signupBtn.textContent = 'Sign them up: ' + tier.name;
    }
  });

  const copyBtn = document.getElementById('copy-pay-link');
  if (copyBtn) copyBtn.addEventListener('click', async function () {
    try { await navigator.clipboard.writeText(copyBtn.dataset.url); copyBtn.textContent = 'Copied'; }
    catch (err) { prompt('Copy this link:', copyBtn.dataset.url); }
  });

  const answeredBtn = document.getElementById('answered-btn');
  if (answeredBtn) {
    // Answering a call only opens the workspace. Preview builds need a separate action.
    answeredBtn.addEventListener('click', function () {
      document.getElementById('panel-script').classList.add('open');
      document.getElementById('panel-log').classList.add('open');
      document.getElementById('panel-site').classList.add('open');
      const note = document.getElementById('call-session-note');
      note.hidden = false;
      note.textContent = 'Call workspace open. Use Build previews when you and the business are ready.';
      answeredBtn.disabled = true;
    });
  }

  const generateBtn = document.getElementById('generate-site-btn');
  if (generateBtn) generateBtn.addEventListener('click', function () { runSiteAction(lead.id, 'templates'); });
  const regenBtn = document.getElementById('regen-site-btn');
  if (regenBtn) regenBtn.addEventListener('click', function () { runSiteAction(lead.id, 'templates'); });
  const ordSave = document.getElementById('ord-save');
  if (ordSave) ordSave.addEventListener('click', async function () {
    const pick = view.querySelector('input[name="ord-look"]:checked'), msg = document.getElementById('ord-msg');
    if (!pick) { msg.textContent = 'Tick the look they liked first.'; return; }
    ordSave.disabled = true; msg.textContent = 'Sending…';
    try {
      const r = await fetch('/api/forge-orders', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ leadId: lead.id, lookId: pick.value, notes: document.getElementById('ord-notes').value }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Could not send.');
      orders[lead.id] = d.order; msg.textContent = 'Sent: ' + d.order.lookLabel + ' (' + d.order.status + '). We will build it.';
    } catch (e) { msg.textContent = e.message; } ordSave.disabled = false;
  });
  const cuSave = document.getElementById('cu-save');
  const cuGo = function (n) {
    cuStep = Math.max(0, Math.min(CU_STEPS.length - 1, n));
    view.querySelectorAll('.cu-step').forEach(function (el) { el.hidden = Number(el.dataset.step) !== cuStep; });
    view.querySelectorAll('.cu-dot').forEach(function (el, i) { el.classList.toggle('on', i === cuStep); });
    if (cuBack) cuBack.hidden = cuStep === 0; if (cuNext) cuNext.hidden = cuStep === CU_STEPS.length - 1;
  };
  const cuNext = document.getElementById('cu-next'), cuBack = document.getElementById('cu-back');
  if (cuNext) cuNext.addEventListener('click', function () { cuGo(cuStep + 1); });
  if (cuBack) cuBack.addEventListener('click', function () { cuGo(cuStep - 1); });
  let picked = ((lead.siteContent && lead.siteContent.photos) || []).filter(function (p) { return p && p.url; }).map(function (p) { return { url: p.url, alt: p.alt, credit: p.credit, thumb: p.url }; });
  function drawPicked() {
    const box = document.getElementById('cu-psel'); if (!box) return; box.replaceChildren();
    picked.forEach(function (p, i) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'on'; b.title = 'Remove';
      const im = document.createElement('img'); im.src = p.thumb || p.url; im.alt = p.alt || ''; im.referrerPolicy = 'no-referrer'; b.append(im);
      b.addEventListener('click', function () { picked.splice(i, 1); drawPicked(); }); box.append(b);
    });
  }
  drawPicked();
  const pFind = document.getElementById('cu-pfind');
  if (pFind) pFind.addEventListener('click', async function () {
    const msg = document.getElementById('cu-pmsg'), res = document.getElementById('cu-pres');
    pFind.disabled = true; msg.textContent = 'Searching…'; res.replaceChildren();
    try {
      const r = await fetch('/api/forge-photos', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: document.getElementById('cu-pq').value }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Search failed.');
      msg.textContent = d.photos.length ? 'Tap a photo to add it. Tap a picked one to remove it.' : 'No photos found. Try another word.';
      d.photos.forEach(function (p) {
        const b = document.createElement('button'); b.type = 'button'; b.title = p.credit;
        const im = document.createElement('img'); im.src = p.thumb; im.alt = p.alt || ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer'; b.append(im);
        b.addEventListener('click', function () { if (picked.length >= 6) { msg.textContent = 'Six is the most. Remove one first.'; return; } if (!picked.some(function (x) { return x.url === p.url; })) { picked.push(p); drawPicked(); } });
        res.append(b);
      });
    } catch (e) { msg.textContent = e.message; } pFind.disabled = false;
  });
  if (cuSave) cuSave.addEventListener('click', async function () {
    const val = function (id) { return document.getElementById(id).value; };
    const sn = view.querySelectorAll('.cu-sn'), sp = view.querySelectorAll('.cu-sp'), hd = view.querySelectorAll('.cu-hd'), ht = view.querySelectorAll('.cu-ht');
    const services = [], hours = [];
    sn.forEach(function (n, i) { if (n.value.trim()) services.push({ name: n.value, price: sp[i].value }); });
    hd.forEach(function (n, i) { if (n.value.trim() && ht[i].value.trim()) hours.push({ day: n.value, time: ht[i].value }); });
    const msg = document.getElementById('cu-msg');
    cuSave.disabled = true; msg.textContent = 'Updating…';
    try {
      const res = await fetch('/api/forge-site', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ leadId: lead.id, action: 'customize', changes: { headline: val('cu-headline'), intro: val('cu-intro'), about: val('cu-about'), services: services, hours: hours, photos: picked.map(function (p) { return { url: p.url, alt: p.alt, credit: p.credit }; }), palette: val('cu-palette') } }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not update.');
      const idx = leads.findIndex(function (l) { return l.id === lead.id; });
      if (idx !== -1) leads[idx] = Object.assign({}, leads[idx], data.lead, { pitch: leads[idx].pitch });
      cuStep = 0; renderLead(lead.id); renderQueue();
      const m2 = document.getElementById('cu-msg'); if (m2) m2.textContent = 'Updated. All 3 looks changed; the demo link shows the new version.';
    } catch (err) { msg.textContent = err.message; cuSave.disabled = false; }
  });

  async function demoCall(action) {
    const res = await fetch('/api/forge-demo', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ leadId: lead.id, action: action }) });
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || 'Demo link unavailable.');
    return data;
  }
  const shareCopy = document.getElementById('share-copy'), shareSms = document.getElementById('share-sms'), shareRevoke = document.getElementById('share-revoke');
  if (shareCopy) {
    const note = function (t) { document.getElementById('share-msg').textContent = t; };
    shareCopy.addEventListener('click', async function () {
      try {
        const d = await demoCall('create'); const url = location.origin + d.path;
        try { await navigator.clipboard.writeText(url); note('Link copied. Anyone with it can view the 3 looks for 30 days.'); } catch (e) { prompt('Copy this link:', url); }
        shareSms.href = 'sms:?&body=' + encodeURIComponent('Here are 3 website ideas for ' + lead.businessName + ': ' + url);
      } catch (e) { note(e.message); }
    });
    shareSms.addEventListener('click', async function (ev) {
      if (shareSms.getAttribute('href') === '#') { ev.preventDefault(); try { const d = await demoCall('create'); const url = location.origin + d.path; shareSms.href = 'sms:?&body=' + encodeURIComponent('Here are 3 website ideas for ' + lead.businessName + ': ' + url); location.href = shareSms.href; } catch (e) { note(e.message); } }
    });
    shareRevoke.addEventListener('click', async function () { try { await demoCall('revoke'); shareSms.href = '#'; note('Link turned off. Old copies stop working.'); } catch (e) { note(e.message); } });
  }

  document.getElementById('save-outcome').addEventListener('click', async function () {
    const disposition = document.getElementById('disposition').value;
    const notes = document.getElementById('notes').value;
    const followUpDate = document.getElementById('followup').value;
    if (!disposition) { alert('Pick an outcome first.'); return; }
    const res = await fetch('/api/forge-leads', {
      method: 'PATCH', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: lead.id, disposition, notes, followUpDate: followUpDate || null }),
    });
    if (res.ok) {
      document.getElementById('saved-msg').style.display = 'block';
      setTimeout(loadLeads, 800);
    } else {
      alert('Could not save. Try again.');
    }
  });
}

async function runSiteAction(leadId, action, instruction, templateId) {
  const lead = leads.find(function (l) { return l.id === leadId; });
  if (lead && action !== 'select_template') { lead.siteStatus = 'generating'; renderLead(leadId); }
  try {
    const res = await fetch('/api/forge-site', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadId: leadId, action: action, instruction: instruction, templateId: templateId }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Site action failed.'); await loadLeads(); return; }
    const idx = leads.findIndex(function (l) { return l.id === leadId; });
    if (idx !== -1) leads[idx] = Object.assign({}, leads[idx], data.lead, { pitch: leads[idx].pitch });
    renderLead(leadId);
    renderQueue();
  } catch (err) {
    alert('Network error.');
    await loadLeads();
  }
}

function openDrawer() { document.getElementById('drawer').classList.add('open'); document.getElementById('drawer-backdrop').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); document.getElementById('drawer-backdrop').classList.remove('open'); }

document.getElementById('menu-btn').addEventListener('click', openDrawer);
document.getElementById('payouts-btn').addEventListener('click', startPayoutSetup);
document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);

loadLeads();
loadEarnings();
</script>
</body>
</html>
