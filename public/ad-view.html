<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ad viewer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0b0f;color:#f2f2f5;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header a{color:#f2f2f5;text-decoration:none;padding:8px 12px;border-radius:99px;background:#1c1c24}
header h1{margin:0;font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px 16px}
#frame{border:0;border-radius:14px;background:#000;max-width:100%;max-height:100%;aspect-ratio:9/16;height:100%}
#msg{padding:24px 16px;text-align:center}
#msg a{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:99px;background:#fff;color:#000;text-decoration:none;font-weight:700}
[hidden]{display:none!important}
</style></head><body>
<header><a href="/ads.html">&larr; Ads</a><h1 id="title">Loading&hellip;</h1></header>
<main><iframe id="frame" title="Ad preview" sandbox="allow-scripts" hidden></iframe><div id="msg" role="status"></div></main>
<script src="/ad-view.js"></script>
</body></html>
