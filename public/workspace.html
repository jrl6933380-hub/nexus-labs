<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>Nexus // Workspace</title>
<!--
  /workspace.html — the whole system as one conversation.

  Rooms are views inside this shell, not pages you get sent to. One tap from the
  hamburger reaches any of them and there is no second level of navigation
  anywhere; if something needs a sub-page it belongs in the thread as an answer
  instead. The legacy pages still exist and still work, but nothing here links
  to them — this is meant to replace the flow, not wrap it.

  Two paths out of the composer:
    - a known room name switches the view locally, with no model call
    - anything else goes to Nex
  The matcher takes exact phrases only. It is a router, not a classifier:
  unknown input must fall through to Nex rather than guess, because navigation
  that silently goes somewhere wrong is worse than navigation that takes a beat.

  The Nex head is a draggable overlay so he can sit on top of any view while you
  work in it, rather than you leaving the view to talk to him.
-->
<style>
  :root{
    --bg:#0e0e0e; --rail:#141414; --tx:#f2f0ed; --dm:#8f8b85; --ln:#262626;
    --card:#131313; --chip:#1f1f1f; --rw:214px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rail);color:var(--tx);overflow:hidden;
    font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left}

  .rail{position:fixed;inset:0 auto 0 0;width:var(--rw);display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 20px) 12px 14px}
  .brand{font:400 26px ui-serif,Georgia,"Times New Roman",serif;padding:0 10px 18px}
  .item{display:flex;align-items:center;gap:13px;width:100%;padding:10px;border-radius:10px;
    font-size:15px;color:#e4e1dd;transition:background .13s}
  .item:hover{background:#1e1e1e}
  .item.on{background:#2a2a2a}
  .ic{width:17px;text-align:center;font-size:14px;color:#a5a09a;flex-shrink:0}
  .grp{font-size:12.5px;color:var(--dm);padding:0 10px;margin:16px 0 6px}
  .scrollpart{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .scrollpart .item{font-size:14.5px;color:#cfcbc5;padding:9px 10px}
  .dot{width:6px;height:6px;border-radius:50%;background:#4a4a4a;flex-shrink:0;margin-left:5px}
  .tr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .new{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#f2f0ed;color:#0e0e0e;border-radius:24px;padding:12px;font-size:15px;font-weight:500}

  .screen{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;
    transition:transform .32s cubic-bezier(.32,.72,0,1);will-change:transform;
    box-shadow:-16px 0 44px rgba(0,0,0,.65)}
  .screen.open{transform:translateX(var(--rw))}

  .top{display:flex;align-items:center;gap:16px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
  .burger{width:21px;display:flex;flex-direction:column;gap:4.5px;flex-shrink:0;padding:6px 0}
  .burger i{display:block;height:1.8px;background:#d8d4cf;border-radius:2px}
  .burger i:nth-child(2){width:14px}.burger i:nth-child(3){width:17px}
  .vt{font-size:15px;color:#c4c0ba}
  .grow{flex:1}
  .ticon{font-size:17px;color:#d8d4cf;opacity:.85;padding:4px}

  .thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 18px 4px}
  .msg{margin-bottom:24px}
  .msg.u{display:flex;justify-content:flex-end}
  .msg.u .body{background:#1f1f1f;padding:12px 17px;border-radius:20px;max-width:82%;font-size:16px;line-height:1.5}
  .msg.a .body{font:400 16.5px/1.72 ui-serif,Georgia,"Times New Roman",serif;color:#efece8}
  .msg.a .body p{margin-bottom:15px}
  .msg.a .body p:last-child{margin-bottom:0}
  .msg.sys .body{font-size:14px;color:var(--dm);line-height:1.6}

  .lgroup{margin-bottom:18px}
  .lhead{font-size:12.5px;color:var(--dm);margin-bottom:8px}
  .lrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;
    background:var(--card);border:1px solid var(--ln);margin-bottom:7px;transition:border-color .13s}
  button.lrow:hover{border-color:#3a3a3a}
  .lt{font-size:15px;line-height:1.35}
  .lm{font-size:12.5px;color:var(--dm);margin-top:4px;line-height:1.4}
  .tag{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap}
  .tag.f{background:#16281f;color:#68d9a4}
  .tag.g{background:#2b2318;color:#e3b467}
  .lempty{font-size:14px;color:#5f5b56;padding:10px 2px 18px}

  .visual{margin-top:14px;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--card)}
  .visual iframe{display:block;width:100%;border:0;background:var(--card)}
  .vbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ln)}
  .vname{font-size:12.5px;color:#cfcbc5}
  .vb{margin-left:auto;font-size:12px;color:var(--dm);padding:5px 10px;border-radius:7px;background:#191919}
  .vb:hover{color:var(--tx)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
  .chip{font-size:13.5px;padding:9px 15px;border-radius:20px;background:#191919;
    border:1px solid var(--ln);color:#c4c0ba;transition:.13s}
  .chip:hover{border-color:#3a3a3a;color:var(--tx)}

  .disc{font-size:12.5px;color:#6e6a64;padding:6px 18px 10px}
  .foot{padding:0 14px calc(env(safe-area-inset-bottom) + 14px)}
  .comp{border:1px solid #2e2e2e;border-radius:24px;padding:14px 15px 11px;background:var(--card)}
  .comp input{width:100%;background:none;border:0;outline:none;color:var(--tx);font-size:16px}
  .comp input::placeholder{color:#7a766f}
  .crow{display:flex;align-items:center;gap:9px;margin-top:13px}
  .round{width:31px;height:31px;border-radius:50%;background:var(--chip);display:flex;
    align-items:center;justify-content:center;font-size:17px;color:#cfcbc5;flex-shrink:0}
  .round:hover{color:var(--tx)}
  .send{width:33px;height:33px;border-radius:50%;background:#f2f0ed;color:#0e0e0e;display:flex;
    align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .send[disabled]{opacity:.4;cursor:default}

  /* --- Nex head: drag anywhere, tap to work with him over the current view --- */
  .head{position:fixed;z-index:40;width:52px;height:52px;border-radius:50%;
    background:linear-gradient(160deg,#5d9dff,#3564c4);color:#fff;display:none;
    align-items:center;justify-content:center;font:600 17px ui-serif,Georgia,serif;
    box-shadow:0 8px 26px rgba(0,0,0,.55);touch-action:none;user-select:none;cursor:grab}
  .head.show{display:flex}
  .head.dragging{cursor:grabbing;transform:scale(1.06)}
  .head .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;
    background:#e3b467;color:#221a09;font:700 10px system-ui;display:none;align-items:center;
    justify-content:center;padding:0 5px}
  .dock{position:fixed;z-index:41;width:min(330px,calc(100vw - 24px));background:var(--rail);
    border:1px solid #2e2e2e;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.6);
    display:none;overflow:hidden}
  .dock.show{display:block}
  .dhead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--ln)}
  .dname{font:400 15px ui-serif,Georgia,serif}
  .dclose{margin-left:auto;color:var(--dm);font-size:17px;padding:2px 6px}
  .dacts{display:flex;gap:7px;flex-wrap:wrap;padding:11px 13px 4px}
  .dact{font-size:12.5px;padding:7px 12px;border-radius:16px;background:#191919;
    border:1px solid var(--ln);color:#c4c0ba}
  .dbody{max-height:190px;overflow-y:auto;padding:10px 13px;font-size:14px;line-height:1.6;color:#cfcbc5}
  .dfoot{display:flex;align-items:center;gap:8px;padding:10px 13px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--ln)}
  .dfoot input{flex:1;background:#191919;border:1px solid var(--ln);border-radius:18px;
    padding:9px 13px;color:var(--tx);font-size:14.5px;outline:none;min-width:0}
  .dsend{width:30px;height:30px;border-radius:50%;background:#f2f0ed;color:#0e0e0e;
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

  @media (min-width:900px){
    .screen{left:var(--rw);transform:none!important;box-shadow:none;border-left:1px solid var(--ln)}
    .burger{display:none}
    .thread,.foot,.disc{max-width:780px;margin-left:auto;margin-right:auto;width:100%}
  }
</style>
</head>
<body>

<nav class="rail" id="rail">
  <div class="brand">Nexus</div>
  <button class="item on" data-view="chat"><span class="ic">◇</span>Workspace</button>
  <div id="viewNav"></div>
  <div class="grp">Recents</div>
  <div class="scrollpart" id="recents"></div>
  <div class="grp">Pinned</div>
  <div id="pinned"></div>
  <button class="new" id="newBtn">+&nbsp; New</button>
</nav>

<div class="screen" id="screen">
  <div class="top">
    <button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
    <div class="vt" id="viewTitle">Workspace</div>
    <div class="grow"></div>
    <button class="ticon" id="headBtn" aria-label="Nex">◉</button>
    <button class="ticon" id="newTop" aria-label="New">＋</button>
  </div>

  <div class="thread" id="thread"></div>
  <div class="disc">Nex can make mistakes.</div>

  <div class="foot">
    <div class="comp">
      <input id="input" placeholder="Command or question…" autocomplete="off" />
      <div class="crow">
        <button class="round" id="capBtn" title="What I can do">◫</button>
        <button class="round" id="pinBtn" title="Pin this view">▣</button>
        <button class="round" id="snapBtn" title="Read the screen">⌖</button>
        <div class="grow"></div>
        <button class="send" id="send" aria-label="Send">↑</button>
      </div>
    </div>
  </div>
</div>

<button class="head" id="head">N<span class="badge" id="headBadge"></span></button>
<div class="dock" id="dock">
  <div class="dhead">
    <span class="dname">Nex</span>
    <button class="dclose" id="dockClose">×</button>
  </div>
  <div class="dacts" id="dockActs"></div>
  <div class="dbody" id="dockBody">Ask me something without leaving this view.</div>
  <div class="dfoot">
    <input id="dockInput" placeholder="Ask Nex…" autocomplete="off" />
    <button class="dsend" id="dockSend">↑</button>
  </div>
</div>

<script type="module">
import { VIEWS, matchView, say, chips, esc } from '/workspace-views.js';

const el = (id) => document.getElementById(id);
const thread = el('thread');
const screenEl = el('screen');

// ---------------------------------------------------------------------------
// Shell state
// ---------------------------------------------------------------------------
let currentView = 'chat';
let busy = false;
let threadId = null;
const history = [];

const ctx = {
  ask: (text) => { el('input').value = text; submit(); },
  go: (id) => showView(id),
};

function railOpen(open){ screenEl.classList.toggle('open', open); }
el('burger').onclick = () => railOpen(!screenEl.classList.contains('open'));
screenEl.addEventListener('click', (e) => {
  if (screenEl.classList.contains('open') && !e.target.closest('#burger')) railOpen(false);
}, true);

// Rail entries are generated from the view table, so the menu can never offer
// somewhere that doesn't exist or miss somewhere that does.
const nav = el('viewNav');
for (const [id, view] of Object.entries(VIEWS)) {
  const button = document.createElement('button');
  button.className = 'item';
  button.dataset.view = id;
  button.innerHTML = `<span class="ic">${view.icon}</span>${esc(view.label)}`;
  button.onclick = () => showView(id);
  nav.appendChild(button);
}

function bubble(role, html){
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = html;
  wrap.appendChild(body);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return body;
}
function paragraphs(text){
  return String(text).split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
}

// ---------------------------------------------------------------------------
// Views render into the same thread the conversation uses. Switching a view
// replaces what's on screen but never touches `history` — the conversation
// survives you looking around, which is the whole point of rooms living here.
// ---------------------------------------------------------------------------
async function showView(id){
  currentView = id;
  railOpen(false);
  for (const button of document.querySelectorAll('[data-view]')) {
    button.classList.toggle('on', button.dataset.view === id);
  }
  el('viewTitle').textContent = id === 'chat' ? 'Workspace' : VIEWS[id].label;

  if (id === 'chat') { replayThread(); return; }

  thread.innerHTML = '';
  const loading = bubble('sys', 'Reading…');
  try {
    const nodes = await VIEWS[id].render(ctx);
    thread.innerHTML = '';
    for (const node of nodes) thread.appendChild(node);
  } catch (error) {
    thread.innerHTML = '';
    bubble('sys', `Couldn't load ${esc(VIEWS[id].label)} — ${esc(error.message)}`);
    thread.appendChild(chips([{ label: 'Ask Nex instead', run: () => ctx.ask(`Tell me what's going on in ${VIEWS[id].label}.`) }]));
  }
  loading.remove?.();
}

function replayThread(){
  thread.innerHTML = '';
  if (!history.length) { greet(); return; }
  for (const message of history) {
    if (message.role === 'user') bubble('u', esc(message.content));
    else bubble('a', paragraphs(message.content));
  }
}

// --- inline visuals --------------------------------------------------------
function renderVisual(widgetCode, title){
  const card = document.createElement('div');
  card.className = 'visual';
  const csp = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; media-src data:; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'";
  card.innerHTML = `<div class="vbar"><span class="vname">${esc(title || 'Visual')}</span><button class="vb">Pin</button></div>`;
  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox','allow-scripts');
  frame.setAttribute('referrerpolicy','no-referrer');
  frame.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="${csp}">
    <style>html,body{margin:0;background:#131313;color:#f2f0ed;
      font-family:-apple-system,system-ui,sans-serif}</style></head><body>${widgetCode}</body></html>`;
  frame.style.height = '420px';
  card.appendChild(frame);
  const pinButton = card.querySelector('.vb');
  pinButton.onclick = () => {
    const ok = pinVisual(widgetCode, title || 'Visual');
    pinButton.textContent = ok ? 'Pinned' : 'Too large';
    pinButton.disabled = true;
  };
  thread.appendChild(card);
  thread.scrollTop = thread.scrollHeight;
}
window.NexusWorkspaceRenderVisual = renderVisual;

// --- storage ---------------------------------------------------------------
// Per-device only. Persisting threads server-side is a real schema decision and
// shouldn't be made as a side effect of a UI change. Reads tolerate junk and
// writes are caught, so a full or blocked localStorage degrades to "no history"
// instead of a blank screen.
const THREADS_KEY='nexus:workspace:threads:v1', PINS_KEY='nexus:workspace:pins:v1';
function readStore(key){
  try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function writeStore(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
}
function saveThread(){
  if (!history.length) return;
  const threads = readStore(THREADS_KEY);
  const record = { id: threadId, title: String(history[0].content).slice(0,48), ts: Date.now(), messages: history.slice(-40) };
  writeStore(THREADS_KEY, [record, ...threads.filter((t) => t && t.id !== threadId)].slice(0,20));
  drawRecents();
}
function drawRecents(){
  const threads = readStore(THREADS_KEY), host = el('recents');
  if (!threads.length) { host.innerHTML = '<div style="font-size:13px;color:#5f5b56;padding:8px 10px">Nothing yet</div>'; return; }
  host.innerHTML = '';
  for (const record of threads) {
    const button = document.createElement('button');
    button.className = 'item';
    button.innerHTML = `<span class="dot"></span><span class="tr">${esc(record.title)}</span>`;
    button.onclick = () => {
      threadId = record.id;
      history.length = 0;
      for (const m of record.messages || []) history.push(m);
      showView('chat');
    };
    host.appendChild(button);
  }
}
function pinVisual(code, title){
  if (String(code).length > 120000) return false;
  const pins = readStore(PINS_KEY);
  if (!writeStore(PINS_KEY, [{ id:`p${Date.now().toString(36)}`, title, code }, ...pins].slice(0,12))) return false;
  drawPins();
  return true;
}
function drawPins(){
  const pins = readStore(PINS_KEY), host = el('pinned');
  if (!pins.length) { host.innerHTML = '<div style="font-size:13px;color:#5f5b56;padding:8px 10px">Nothing pinned</div>'; return; }
  host.innerHTML = '';
  for (const pin of pins) {
    const button = document.createElement('button');
    button.className = 'item';
    button.innerHTML = `<span class="ic">▣</span><span class="tr">${esc(pin.title)}</span>`;
    button.onclick = () => { showView('chat'); renderVisual(pin.code, pin.title); };
    host.appendChild(button);
  }
}
drawRecents(); drawPins();

// --- composer --------------------------------------------------------------
async function submit(){
  const raw = el('input').value.trim();
  if (!raw || busy) return;
  el('input').value = '';

  const target = matchView(raw);
  if (target) { showView(target); return; }

  if (currentView !== 'chat') showView('chat');
  bubble('u', esc(raw));
  if (!threadId) threadId = `t${Date.now().toString(36)}`;
  busy = true; el('send').disabled = true;
  const pending = bubble('a', '<p style="color:#6e6a64">Thinking…</p>');
  try {
    const response = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: raw, history }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
    const reply = data.reply || 'No reply came back.';
    pending.innerHTML = paragraphs(reply);
    history.push({ role:'user', content:raw }, { role:'assistant', content:reply });
    saveThread();
    // Nex asking the workspace to move is honoured as a view switch, not a page load.
    const wanted = data.navigation?.room || data.navigation?.url;
    if (wanted) {
      const id = matchView(String(wanted).replace(/^\/|\.html$/g,'').replace(/-/g,' '));
      if (id) showView(id);
    }
  } catch (error) {
    pending.innerHTML = `<p style="color:#c98b78">${esc(error.message)}</p>`;
  } finally { busy = false; el('send').disabled = false; }
}
el('send').onclick = submit;
el('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
el('capBtn').onclick = () => showView('skills');
el('snapBtn').onclick = () => ctx.ask('Here is what I am looking at — read the current view and tell me what stands out.');
el('pinBtn').onclick = () => ctx.ask(`Draw me a visual of ${currentView === 'chat' ? 'this conversation' : VIEWS[currentView].label} that I can pin.`);
el('newBtn').onclick = el('newTop').onclick = () => {
  history.length = 0; threadId = null; railOpen(false); showView('chat');
};

function greet(){
  thread.appendChild(say('Everything lives here now. Say a room name and I switch to it — “forge”, “approvals”, “memory”. Anything else is a question for me.'));
  thread.appendChild(chips(
    Object.entries(VIEWS).slice(0,4).map(([id,view]) => ({ label: view.label, run: () => showView(id) }))
  ));
}

// --- Nex head --------------------------------------------------------------
// Drags anywhere, snaps to the nearest side, stays put between sessions. Tap to
// open a small dock so he can be worked with on top of whatever view is open,
// rather than you leaving the view to reach him.
const head = el('head'), dock = el('dock');
let pos = (() => {
  try { return JSON.parse(localStorage.getItem('nexus:head') || 'null') || { x: window.innerWidth - 72, y: window.innerHeight - 190 }; }
  catch { return { x: window.innerWidth - 72, y: window.innerHeight - 190 }; }
})();
function place(){
  const x = Math.max(8, Math.min(pos.x, window.innerWidth - 60));
  const y = Math.max(8, Math.min(pos.y, window.innerHeight - 60));
  pos = { x, y };
  head.style.left = `${x}px`; head.style.top = `${y}px`;
  const left = x < window.innerWidth / 2;
  dock.style.left = left ? `${Math.max(8, x)}px` : 'auto';
  dock.style.right = left ? 'auto' : `${Math.max(8, window.innerWidth - x - 52)}px`;
  const above = y > window.innerHeight / 2;
  dock.style.top = above ? 'auto' : `${y + 60}px`;
  dock.style.bottom = above ? `${window.innerHeight - y + 8}px` : 'auto';
}
place();
let dragging = false, moved = false, offset = { x:0, y:0 };
head.addEventListener('pointerdown', (e) => {
  dragging = true; moved = false;
  offset = { x: e.clientX - pos.x, y: e.clientY - pos.y };
  head.setPointerCapture(e.pointerId);
  head.classList.add('dragging');
});
head.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const nx = e.clientX - offset.x, ny = e.clientY - offset.y;
  if (Math.abs(nx - pos.x) > 3 || Math.abs(ny - pos.y) > 3) moved = true;
  pos = { x: nx, y: ny }; place();
});
head.addEventListener('pointerup', (e) => {
  dragging = false; head.classList.remove('dragging');
  head.releasePointerCapture?.(e.pointerId);
  pos.x = pos.x + 26 < window.innerWidth / 2 ? 12 : window.innerWidth - 64; // snap to a side
  place();
  try { localStorage.setItem('nexus:head', JSON.stringify(pos)); } catch {}
  if (!moved) dock.classList.toggle('show');
});
el('headBtn').onclick = () => {
  head.classList.toggle('show');
  if (!head.classList.contains('show')) dock.classList.remove('show');
};
el('dockClose').onclick = () => dock.classList.remove('show');
window.addEventListener('resize', place);

// The dock's quick actions are the composer's tools, reachable without leaving
// the view you're in — which is the reason the head exists at all.
const DOCK_ACTIONS = [
  { label:'What needs me', text:'What actually needs me right now across the whole system?' },
  { label:'Read this view', text:'Read the view I have open and tell me what stands out.' },
  { label:'Approvals', view:'approvals' },
  { label:'Draw it', text:'Draw me a visual of what we just discussed.' },
];
for (const action of DOCK_ACTIONS) {
  const button = document.createElement('button');
  button.className = 'dact';
  button.textContent = action.label;
  button.onclick = () => {
    if (action.view) { showView(action.view); dock.classList.remove('show'); return; }
    dockAsk(action.text);
  };
  el('dockActs').appendChild(button);
}
async function dockAsk(text){
  const body = el('dockBody');
  body.textContent = 'Thinking…';
  try {
    const response = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, history }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
    body.textContent = data.reply || 'No reply came back.';
    history.push({ role:'user', content:text }, { role:'assistant', content:data.reply || '' });
    saveThread();
  } catch (error) { body.textContent = error.message; }
}
el('dockSend').onclick = () => {
  const value = el('dockInput').value.trim();
  if (!value) return;
  el('dockInput').value = '';
  dockAsk(value);
};
el('dockInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('dockSend').click(); });

showView('chat');
</script>
</body>
</html>
