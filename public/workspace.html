<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>Nexus Messages</title>
<!--
  /workspace.html — the whole system as one conversation.

  Rooms are conversations inside Nexus Messages, not a second navigation
  system. The inbox is the one home for Nex, products, specialists, and owner
  operations; each row opens the real connected workspace.

  Two paths out of the composer:
    - a known room name switches the view locally, with no model call
    - anything else goes to Nex
  The matcher takes exact phrases only. It is a router, not a classifier:
  unknown input must fall through to Nex rather than guess, because navigation
  that silently goes somewhere wrong is worse than navigation that takes a beat.

  The Nex head is a draggable overlay so he can sit on top of any view while you
  work in it, rather than you leaving the view to talk to him.
-->
<style>
  :root{
    --bg:#0e0e0e; --rail:#141414; --tx:#f2f0ed; --dm:#8f8b85; --ln:#262626;
    --card:#151515; --chip:#202020; --rw:252px; --blue:#74a7ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);overflow:hidden;
    font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left}

  .screen{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
  .messagebrand{display:none;width:42px;height:42px;place-items:center;flex:0 0 42px;border:1.5px solid #e2bd70;border-radius:50%;color:#e8c779;font:700 20px ui-serif,Georgia,serif;box-shadow:0 0 22px rgba(226,189,112,.13)}
  .backmessages{width:30px;height:30px;display:grid;place-items:center;flex-shrink:0;color:#d8d4cf;font-size:28px;line-height:1}
  body[data-view="messages"] .backmessages{display:none}
  .viewcopy{min-width:0}.vt{font-size:15px;color:#e4e1dd}.vsub{font-size:11px;color:#77736d;margin-top:2px}
  .grow{flex:1}
  .ticon{font-size:17px;color:#d8d4cf;opacity:.85;padding:4px}

  .thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 18px 4px}
  .welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(22px,5vh,54px) 0 24px;text-align:center}
  .welcome-mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;
    background:linear-gradient(145deg,#94bbff,#5488e8);color:#081322;font:700 22px ui-serif,Georgia,serif;
    box-shadow:0 12px 34px rgba(63,112,196,.24)}
  .welcome h1{font:400 clamp(30px,7vw,46px)/1.08 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.025em;max-width:620px}
  .welcome p{font:400 15px/1.55 ui-serif,Georgia,"Times New Roman",serif;color:#aaa59e;max-width:560px;margin-top:12px}
  .startergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:22px;max-width:620px;width:100%;text-align:left}
  .starter{min-height:78px;border:1px solid var(--ln);border-radius:15px;padding:13px 14px;background:#131313;color:#d7d3ce;font-size:13.5px;line-height:1.3}
  .starter:hover{border-color:#3b4f70;background:#161a21}.starter span{display:block;color:#73706a;font-size:11px;margin-top:5px}
  .plannerweek{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(88px,1fr);gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .plannerweek::-webkit-scrollbar{display:none}.plannerday{min-height:104px;border:1px solid var(--ln);border-radius:16px;background:#131313;padding:12px;text-align:center}
  .plannerday:hover{border-color:#3b4f70}.plannerday.today{border-color:#4f75ad;background:#151b25}.plannerday span,.plannerday small{display:block;color:#817d77;font-size:11px}
  .plannerday strong{display:block;font:400 28px/1.35 ui-serif,Georgia,serif}.plannerday small{color:#9fbcf3}
  .schedulebalance{margin:8px 0 18px;padding:16px;border:1px solid var(--ln);border-radius:17px;background:#131313}
  .schedulebalancehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.schedulebalancehead span{display:grid;gap:5px}
  .schedulebalancehead small{font-size:10px;letter-spacing:.12em;color:#cda968}.schedulebalancehead strong{font:400 19px ui-serif,Georgia,serif}
  .schedulebalancehead em{font-style:normal;font-size:11px;color:#8f8b85}.schedulebar{height:14px;display:flex;overflow:hidden;border-radius:999px;margin:15px 0 11px;background:#292929}
  .schedulebar button,.schedulebar i{display:block;height:100%;min-width:3px}.schedulelegend{display:flex;gap:8px 13px;flex-wrap:wrap;color:#8f8b85;font-size:11px}
  .schedulelegend button{display:flex;align-items:center;gap:5px;text-transform:capitalize;color:#8f8b85;font-size:11px}.schedulelegend i{width:7px;height:7px;border-radius:50%}
  .scheduletimeline{display:grid;gap:7px;width:100%}.schedulelane{display:grid;grid-template-columns:48px 1fr;gap:9px;align-items:stretch}
  .schedulelabel{border:1px solid var(--ln);border-radius:12px;background:#131313;text-align:center;padding:8px 5px}.schedulelabel strong,.schedulelabel small{display:block}
  .schedulelabel strong{font-size:11px;color:#aaa59e}.schedulelabel small{font:400 17px ui-serif,Georgia,serif;margin-top:2px}
  .scheduleblocks{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}.scheduleblocks::-webkit-scrollbar{display:none}
  .scheduleblock{--cat:#8e8a84;min-width:145px;max-width:220px;border:1px solid color-mix(in srgb,var(--cat) 44%,#282828);border-left:4px solid var(--cat);border-radius:12px;background:#151515;padding:9px 11px}
  .scheduleblock.draft{border-style:dashed}.scheduleblock strong,.scheduleblock small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scheduleblock strong{font-size:12.5px}.scheduleblock small{font-size:10.5px;color:#8f8b85;margin-top:4px}
  .scheduleopen{display:grid;place-items:center;min-width:100%;border:1px dashed #292929;border-radius:12px;color:#5f5b56;font-size:11px}
  .schedulewizard{margin:10px 0 22px;padding:18px;border:1px solid #313846;border-radius:19px;background:linear-gradient(155deg,#151922,#121212)}
  .schedulewizard small{display:block;color:#cda968;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.schedulewizard h2{font:400 25px/1.15 ui-serif,Georgia,serif;margin:8px 0}.schedulewizard p{color:#99948d;font-size:13px;line-height:1.5}
  .schedulechoices{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.schedulechoice{padding:10px 14px;border:1px solid #303744;border-radius:18px;background:#191d24;color:#d9d5d0;font-size:13px}
  .schedulechoice.on{background:#e1bd73;color:#17120a;border-color:#e1bd73}.schedulepreview{margin-top:16px;padding:14px;border:1px solid #323946;border-radius:14px;background:#101217}
  .schedulepreview strong,.schedulepreview span{display:block}.schedulepreview span{margin-top:6px;color:#aaa59e;font-size:12px;line-height:1.5}.schedulewizard input{width:100%;margin-top:14px;padding:12px;border:1px solid #363d49;border-radius:12px;background:#101217;color:var(--tx);font:inherit}
  .draftbanner{margin:8px 0 16px;padding:15px;border:1px solid #715d35;border-radius:15px;background:#211c13}.draftbanner strong,.draftbanner span{display:block}.draftbanner span{font-size:12px;color:#b8aa8e;margin-top:5px}
  .scheduletoast{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom) + 116px);transform:translateX(-50%);width:min(420px,calc(100vw - 28px));padding:14px 16px;border:1px solid #4b6080;border-radius:15px;background:#172033;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .scheduletoast strong,.scheduletoast span{display:block}.scheduletoast span{font-size:12px;color:#aebbd0;margin-top:4px}.scheduletoast button{position:absolute;right:11px;top:9px;color:#9fa9b9}
  .msg{display:flex;align-items:flex-end;gap:9px;margin-bottom:16px}
  .msg.u{justify-content:flex-end}
  .msgstack{display:grid;gap:4px;max-width:min(82%,620px)}
  .msg.u .msgstack{justify-items:end}.msgspeaker{padding:0 7px;color:#c9c5bf;font-size:11px;font-weight:650}.msgtime{padding:0 7px;color:#646a75;font-size:10px}
  .msgavatar{display:grid;place-items:center;flex:0 0 31px;width:31px;height:31px;border:1px solid #d8b666;border-radius:50%;color:#e5c371;background:#17150f;font:700 13px ui-serif,Georgia,serif;box-shadow:0 0 16px rgba(211,173,92,.12)}
  .msg .body{padding:11px 14px;border:1px solid #282e38;border-radius:16px;background:#171b22;color:#eeece8;font-size:14px;line-height:1.5}
  .msg.u .body{border-color:#34425f;background:linear-gradient(145deg,#303c59,#252d42);font-size:14px}
  .msg.a .body{font:400 14px/1.55 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif}
  .msg.a .body p{margin-bottom:15px}
  .msg.a .body p:last-child{margin-bottom:0}
  .msg.sys .body{font-size:14px;color:var(--dm);line-height:1.6}
  .msg.sys{display:block}.msg.sys .msgstack{max-width:none}.msg.sys .body{border:0;background:transparent;padding:4px 0}

  .lgroup{margin-bottom:18px}
  .lhead{font-size:12.5px;color:var(--dm);margin-bottom:8px}
  .lrow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;
    background:var(--card);border:1px solid var(--ln);margin-bottom:7px;transition:border-color .13s}
  .lmain{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
  .lrow:hover{border-color:#3a3a3a}
  .lt{font-size:15px;line-height:1.35}
  .lm{font-size:12.5px;color:var(--dm);margin-top:4px;line-height:1.4}
  .tag{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap}
  .tag.f{background:#16281f;color:#68d9a4}
  .tag.g{background:#2b2318;color:#e3b467}
  .rowdel{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:11px;color:var(--dm);margin-left:2px;opacity:.55;transition:.13s}
  .lrow:hover .rowdel{opacity:1}
  .rowdel:hover{background:#2a1d1d;color:#e39a8f}
  .rowdel[disabled]{opacity:.25;cursor:default}
  .lempty{font-size:14px;color:#5f5b56;padding:10px 2px 18px}
  .projectusage{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 14px;
    padding:13px 15px;border:1px solid var(--ln);border-radius:15px;background:#131313}
  .projectusage strong{display:block;font-size:14px;font-weight:500}.projectusage span{display:block;color:var(--dm);font-size:12px;margin-top:4px}
  .projectmeter{width:92px;height:6px;border-radius:999px;background:#292929;overflow:hidden;flex-shrink:0}
  .projectmeter i{display:block;height:100%;border-radius:inherit;background:var(--blue)}
  .projectgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:4px 0 20px}
  .projectcard{min-width:0;border:1px solid var(--ln);border-radius:17px;overflow:hidden;background:#131313}
  .projectthumb{position:relative;display:block;width:100%;aspect-ratio:16/10;overflow:hidden;background:#1b1b1b;border-bottom:1px solid var(--ln)}
  .projectthumb iframe{position:absolute;inset:0;width:500%;height:500%;border:0;background:#fff;transform:scale(.2);transform-origin:top left;pointer-events:none}
  .projectthumbempty{position:absolute;inset:0;display:grid;place-items:center;color:#76716b;font:400 15px ui-serif,Georgia,serif}
  .projectcardbody{padding:12px}.projectcardtitle{width:100%;font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .projectcardmeta{font-size:11.5px;color:var(--dm);margin-top:5px}.projectcardactions{display:flex;gap:7px;margin-top:11px}
  .projectcardactions button{flex:1;padding:8px 9px;border:1px solid #333;border-radius:9px;background:#1a1a1a;color:#d8d4cf;font-size:12px;text-align:center}
  .projectcardactions button:first-child{background:#edf1f8;color:#111;border-color:#edf1f8}
  .actionform{display:grid;gap:10px;margin:14px 0;padding:18px;border:1px solid var(--ln);border-radius:14px;background:var(--card)}
  .actionform input{width:100%;padding:12px;border:1px solid #414141;border-radius:9px;background:#171717;color:var(--tx);font:inherit}
  .actionform button{padding:11px 15px;border-radius:9px;background:#eee;color:#111;text-align:center}

  .visual{margin-top:14px;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--card)}
  .visual iframe{display:block;width:100%;border:0;background:var(--card)}
  .vbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ln)}
  .vname{font-size:12.5px;color:#cfcbc5}
  .vb{margin-left:auto;font-size:12px;color:var(--dm);padding:5px 10px;border-radius:7px;background:#191919}
  .vb:hover{color:var(--tx)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
  .chip{font-size:13.5px;padding:9px 15px;border-radius:20px;background:#191919;
    border:1px solid var(--ln);color:#c4c0ba;transition:.13s}
  .chip:hover{border-color:#3a3a3a;color:var(--tx)}

  .disc{font-size:12.5px;color:#6e6a64;padding:6px 18px 10px}
  .foot{padding:0 14px calc(env(safe-area-inset-bottom) + 14px)}
  .comp{border:1px solid #303030;border-radius:24px;padding:14px 15px 11px;background:var(--card);box-shadow:0 12px 42px rgba(0,0,0,.25)}
  .comp:focus-within{border-color:#4e6f9f;box-shadow:0 12px 42px rgba(0,0,0,.3),0 0 0 1px rgba(116,167,255,.12)}
  .comp input{width:100%;background:none;border:0;outline:none;color:var(--tx);font-size:16px}
  .comp input::placeholder{color:#7a766f}
  .plannerform{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plannerform label:first-child,.plannerform label:last-of-type,.plannerform button,.plannerform [role=status]{grid-column:1/-1}
  .plannerform label{display:grid;gap:7px;color:#aaa59e;font-size:12px}.plannerform input,.plannerform textarea{width:100%;background:#111;border:1px solid #303030;border-radius:11px;color:var(--tx);padding:11px;font:inherit}
  .plannerform textarea{min-height:92px;resize:vertical}.plannerform button{background:#f2f0ed;color:#111;border-radius:20px;padding:11px;text-align:center}
  .crow{display:flex;align-items:center;gap:9px;margin-top:13px}
  .composer-actions{display:flex;align-items:center;gap:7px;min-width:0;overflow-x:auto;scrollbar-width:none}
  .composer-actions::-webkit-scrollbar{display:none}
  .quickaction{flex-shrink:0;padding:8px 12px;border-radius:17px;background:var(--chip);border:1px solid var(--ln);
    color:#cfcac4;font-size:12.5px;line-height:1;white-space:nowrap}
  .quickaction:hover{border-color:#3b4f70;color:var(--tx)}
  .round{width:31px;height:31px;border-radius:50%;background:var(--chip);display:flex;
    align-items:center;justify-content:center;font-size:17px;color:#cfcbc5;flex-shrink:0}
  .round:hover{color:var(--tx)}
  .send{width:33px;height:33px;border-radius:50%;background:#f2f0ed;color:#0e0e0e;display:flex;
    align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .send[disabled]{opacity:.4;cursor:default}
  .messagenav{display:none;position:relative;z-index:20;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 14px calc(env(safe-area-inset-bottom) + 7px);border-top:1px solid #292b31;background:rgba(13,14,16,.97);backdrop-filter:blur(18px)}
  .messagenav button{display:grid;place-items:center;gap:3px;min-height:48px;color:#858b96;font-size:10px;text-align:center}.messagenav button span{font-size:20px;line-height:1}.messagenav button.active{color:#e1bd72}.messagenav button.active span{filter:drop-shadow(0 0 8px rgba(225,189,114,.28))}

  /* --- Nex head: drag anywhere, tap to work with him over the current view --- */
  .head{position:fixed;z-index:40;width:52px;height:52px;border-radius:50%;
    background:linear-gradient(160deg,#5d9dff,#3564c4);color:#fff;display:none;
    align-items:center;justify-content:center;font:600 17px ui-serif,Georgia,serif;
    box-shadow:0 8px 26px rgba(0,0,0,.55);touch-action:none;user-select:none;cursor:grab}
  .head.show{display:flex}
  .head.dragging{cursor:grabbing;transform:scale(1.06)}
  .head .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;
    background:#e3b467;color:#221a09;font:700 10px system-ui;display:none;align-items:center;
    justify-content:center;padding:0 5px}
  .dock{position:fixed;z-index:41;width:min(330px,calc(100vw - 24px));background:var(--rail);
    border:1px solid #2e2e2e;border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.6);
    display:none;overflow:hidden}
  .dock.show{display:block}
  .dhead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--ln)}
  .dname{font:400 15px ui-serif,Georgia,serif}
  .dclose{margin-left:auto;color:var(--dm);font-size:17px;padding:2px 6px}
  .dacts{display:flex;gap:7px;flex-wrap:wrap;padding:11px 13px 4px}
  .dact{font-size:12.5px;padding:7px 12px;border-radius:16px;background:#191919;
    border:1px solid var(--ln);color:#c4c0ba}
  .dbody{max-height:190px;overflow-y:auto;padding:10px 13px;font-size:14px;line-height:1.6;color:#cfcbc5}
  .dfoot{display:flex;align-items:center;gap:8px;padding:10px 13px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--ln)}
  .dfoot input{flex:1;background:#191919;border:1px solid var(--ln);border-radius:18px;
    padding:9px 13px;color:var(--tx);font-size:14.5px;outline:none;min-width:0}
  .dsend{width:30px;height:30px;border-radius:50%;background:#f2f0ed;color:#0e0e0e;
    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

  @media (min-width:900px){
    .thread,.foot,.disc{max-width:780px;margin-left:auto;margin-right:auto;width:100%}
  }
  @media (max-width:520px){
    .welcome{padding:18px 0 20px}
    .welcome h1{font-size:clamp(29px,8.5vw,38px);max-width:350px}
    .welcome p{font-size:14px;line-height:1.48;max-width:340px}
    .welcome-mark{width:40px;height:40px;margin-bottom:14px;font-size:20px}
    .startergrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
    .starter{min-height:76px;padding:12px;font-size:13px}
    .vsub{display:none}
    .projectgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.projectcardbody{padding:10px}.projectcardactions{flex-direction:column}
  }
  body[data-view="messages"] .messagebrand{display:grid}
  body[data-view="messages"] .top{padding-left:18px;padding-right:18px}
  body[data-view="messages"] .viewcopy{display:flex;align-items:center}
  body[data-view="messages"] .vt{font-size:28px;font-weight:750;letter-spacing:-.035em;color:#f4f2ee}
  body[data-view="messages"] .vsub{display:none}
  body[data-view="messages"] #newTop{display:grid;place-items:center;width:42px;height:42px;padding:0;border-radius:50%;background:linear-gradient(145deg,#f2d58f,#cf9f43);color:#181207;font-size:25px;opacity:1;box-shadow:0 8px 24px rgba(211,169,84,.22)}
  body[data-view="messages"] #headBtn{display:none}
  body[data-view="messages"] .messagenav{display:grid}
  body.messages-panel[data-view="messages"] .top,body.messages-panel[data-view="messages"] .messagenav{display:none}
  body.messages-panel[data-view="messages"] .thread{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
  body[data-view="chat"] .top{border-bottom:1px solid #242830;background:rgba(14,15,18,.96)}
  body[data-view="chat"] .viewcopy{position:absolute;left:54px;right:54px;text-align:center;pointer-events:none}
  body[data-view="chat"] .vt{font-size:16px;font-weight:700;color:#f4f2ee}
  body[data-view="chat"] .vsub{display:none}
  body[data-view="chat"] #headBtn{display:none}
  body[data-view="chat"] #newTop{font-size:0}
  body[data-view="chat"] #newTop::after{content:"•••";font-size:17px;letter-spacing:2px}
  body[data-view="chat"] .thread{padding-top:0}
  body[data-view="chat"] .disc{display:none}
  body[data-view="chat"] .foot{padding-top:8px;border-top:1px solid #252830;background:#0e0f12}
  body[data-view="chat"] .comp{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-radius:22px;background:#171a20}
  body[data-view="chat"] .comp input{min-width:0;flex:1;font-size:14px}
  body[data-view="chat"] .crow{margin:0}
  body[data-view="chat"] .composer-actions,body[data-view="chat"] .crow>.grow{display:none}
</style>

<body>

<div class="screen" id="screen">
  <div class="top">

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const stack = document.createElement('div'); stack.className = 'msgstack';
  const body = document.createElement('div');
  body.className = 'body';
  body.innerHTML = html;
  if(role==='a'){
    const mark=document.createElement('span');mark.className='msgavatar';mark.textContent=(activeConversation?.kind==='specialist'?activeConversation.name:'Nex').slice(0,1).toUpperCase();
    const speaker=document.createElement('span');speaker.className='msgspeaker';speaker.textContent=activeConversation?.kind==='specialist'?activeConversation.name:'Nex';stack.append(speaker,body);wrap.append(mark,stack);
  }else if(role==='u'){stack.append(body);const time=document.createElement('span');time.className='msgtime';time.textContent='You';stack.append(time);wrap.append(stack);}
  else{stack.append(body);wrap.append(stack);}
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
  return body;
}
function paragraphs(text){
  return String(text).split(/\n{2,}/).map((p) => `<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
}

// ---------------------------------------------------------------------------
// Views render into the same thread the conversation uses. Switching a view
// replaces what's on screen but never touches `history` — the conversation
// survives you looking around, which is the whole point of rooms living here.
// ---------------------------------------------------------------------------
async function showView(id){
  document.body.classList.remove('messages-panel');
  currentView = id;
  document.body.dataset.view = id;
  for(const button of el('messageNav').querySelectorAll('button'))button.classList.remove('active');
  if(id==='messages')el(messagesStartMore?'navMore':'navMessages').classList.add('active');
  else if(id==='workbench')el('navProjects').classList.add('active');
  else if(id==='life')el('navLife').classList.add('active');
  el('input').placeholder = id === 'planner' ? 'Ask Nex about your schedule…' : id === 'reminders' ? 'Ask Nex about your reminders…' : id === 'life' ? 'Talk with Nex about your life…' : 'Message Nex…';
  el('viewTitle').textContent = id === 'chat' ? (activeConversation?.name || activeConversation?.title || 'Nex') : VIEWS[id].label;
  el('viewSubtitle').textContent = id === 'workbench' ? 'Your websites, apps, and tools' : id === 'messages' ? 'One intelligence. A team when you need one.' : id === 'chat' ? conversationSubtitle() : 'Connected through Messages';

  if (id === 'chat') { replayThread(); return; }

  thread.innerHTML = '';
  const loading = bubble('sys', 'Reading…');
  try {
    const nodes = await VIEWS[id].render(ctx);
    thread.innerHTML = '';
    for (const node of nodes) thread.appendChild(node);
  } catch (error) {
    thread.innerHTML = '';
    bubble('sys', esc(friendlyError(error,{action:'load',subject:VIEWS[id].label})));
    thread.appendChild(chips([{ label:'Try again', run:() => showView(id) }, { label: 'Ask Nex instead', run: () => ctx.ask(`Tell me what's going on in ${VIEWS[id].label}.`) }]));
  }
  loading.remove?.();
}

function replayThread(){
  thread.innerHTML = '';
  renderConversationBanner();
  if (!history.length) { conversationGreeting(); return; }
  for (const message of history) {
    if (message.role === 'user') bubble('u', esc(message.content));
    else bubble('a', paragraphs(message.content));
  }
}
function conversationSubtitle(){
  if(activeConversation?.kind==='specialist')return `${activeConversation.role || 'Specialist'} · ${activeConversation.scopes?.map(scope=>scope==='conversation'?'this chat':scope).join(', ') || 'this chat'}`;
  if(activeConversation?.kind==='group')return `Nex + ${(activeConversation.members || []).map(member=>typeof member==='string'?member:member.name).join(' + ')}`;
  return 'Talk about anything';
}
function renderConversationBanner(){
  if(!activeConversation)return;
  const banner=document.createElement('div');banner.className='conversationbanner';
  const participants=activeConversation.kind==='group'?['Nex',...(activeConversation.members || []).map(member=>typeof member==='string'?member:member.name)]:[activeConversation.name || 'Nex'];
  const chips=document.createElement('div');chips.className='participantchips';for(const name of participants){const chip=document.createElement('i');const mark=document.createElement('b');mark.textContent=name.slice(0,1).toUpperCase();chip.append(mark,document.createTextNode(name));chips.append(chip);}banner.append(chips);thread.append(banner);
}
function conversationGreeting(){
  if(activeConversation?.kind==='specialist'){
    bubble('a',`<p>I'm ${esc(activeConversation.name)}, your ${esc(activeConversation.role || 'specialist')} specialist. My job is ${esc(activeConversation.job)}.</p><p>What should I take on?</p>`);
    thread.appendChild(chips([
      {label:'Give me a task',run:()=>{el('input').value='I need you to help with ';el('input').focus();}},
      {label:'What can you help with?',run:()=>{el('input').value='Show me what you can help with in this role.';submit();}},
    ]));return;
  }
  if(activeConversation?.kind==='group'){
    bubble('a',`<p>Nex here. I'll coordinate ${esc((activeConversation.members || []).map(member=>typeof member==='string'?member:member.name).join(' and '))} in this conversation and keep the handoffs clear.</p><p>What are we working on?</p>`);
    thread.appendChild(chips([
      {label:'Assign a project',run:()=>{el('input').value='I need this group to work together on ';el('input').focus();}},
      {label:'Review the team',run:()=>{el('input').value='Explain each specialist’s role in this group.';submit();}},
    ]));return;
  }
  greet();
}
function renderResponseActions(data){
  const options=data.question?.options?.length?data.question.options:data.suggestedReplies;
  if(Array.isArray(options) && options.length)thread.appendChild(chips(options.slice(0,4).map(label=>({label,run:()=>{el('input').value=label;submit();}}))));
  if(data.pendingApproval){
    const card=document.createElement('section');card.className='approvalcard';
    const title=document.createElement('strong');title.textContent='Your approval is needed';
    const copy=document.createElement('p');copy.textContent=data.pendingApproval.description || 'Review this action before Nex continues.';
    const approve=document.createElement('button');approve.type='button';approve.className='uxprimary';approve.textContent=data.pendingApproval.label || 'Approve';
    const status=document.createElement('p');status.setAttribute('role','status');
    approve.onclick=async()=>{approve.disabled=true;try{const response=await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:data.pendingApproval.id,action:'approve'})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error || 'Approval failed');status.textContent='Approved. Nex can continue.';}catch(error){status.textContent=friendlyError(error,{subject:'this approval'});approve.disabled=false;}};
    card.append(title,copy,approve,status);thread.append(card);
  }
}

// --- inline visuals --------------------------------------------------------
function renderVisual(widgetCode, title){
  const card = document.createElement('div');
  card.className = 'visual';
  const csp = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; media-src data:; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'";
  card.innerHTML = `<div class="vbar"><span class="vname">${esc(title || 'Visual')}</span><button class="vb">Pin</button></div>`;
  const frame = document.createElement('iframe');
  frame.setAttribute('sandbox','allow-scripts');
  frame.setAttribute('referrerpolicy','no-referrer');
  frame.srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="${csp}">
    <style>html,body{margin:0;background:#131313;color:#f2f0ed;
      font-family:-apple-system,system-ui,sans-serif}</style></head><body>${widgetCode}</body></html>`;
  frame.style.height = '420px';
  card.appendChild(frame);
  const pinButton = card.querySelector('.vb');
  pinButton.onclick = () => {
    const ok = pinVisual(widgetCode, title || 'Visual');

    pinButton.disabled = true;
  };
  thread.appendChild(card);
  thread.scrollTop = thread.scrollHeight;
}
window.NexusWorkspaceRenderVisual = renderVisual;

// --- storage ---------------------------------------------------------------
// Threads are authoritative on the server so the visible conversations and
// Nex's model context stay isolated and survive moving between devices. The
// old local cache remains as an offline fallback and keeps pre-cloud threads
// visible until the owner continues them, at which point they are saved.
const THREADS_KEY='nexus:workspace:threads:v1', PINS_KEY='nexus:workspace:pins:v1';
let recentThreads = [];
function readStore(key){
  try { const v = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}
function writeStore(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
}
function saveThread(){
  if (!history.length) return;
  const threads = readStore(THREADS_KEY);
  const record = { id: threadId, title: String(history[0].content).slice(0,48), ts: Date.now(), messages: history.slice(-40) };
  writeStore(THREADS_KEY, [record, ...threads.filter((t) => t && t.id !== threadId)].slice(0,20));
  recentThreads = [
    { id:record.id, title:record.title, updated_at:record.ts, message_count:record.messages.length },
    ...recentThreads.filter((item) => item?.id !== record.id),
  ].slice(0,20);
  drawRecents();
}
async function loadThreads(){
  const local = readStore(THREADS_KEY);
  try {
    const response = await fetch('/api/chat?threads=1', { headers:{ Accept:'application/json' }, cache:'no-store' });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
    const cloud = Array.isArray(data.threads) ? data.threads : [];
    const localOnly = local.filter((item) => item?.id && !cloud.some((saved) => saved.id === item.id));
    const migrated = await Promise.all(localOnly.map(async (item) => {
      try {
        const saved = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ action:'save_thread', threadId:item.id, title:item.title, updated_at:item.ts, messages:item.messages }) });
        const result = await saved.json().catch(() => ({}));
        return saved.ok && result.thread ? result.thread : item;
      } catch { return item; }
    }));
    recentThreads = [...cloud, ...migrated].sort((a,b) => (b.updated_at || b.ts || 0) - (a.updated_at || a.ts || 0)).slice(0,20);
  } catch {
    recentThreads = local;
  }
  drawRecents();
}
async function openThread(record){
  let messages = Array.isArray(record?.messages) ? record.messages : null;
  if (!messages) {
    try {
      const response = await fetch(`/api/chat?threadId=${encodeURIComponent(record.id)}`, { headers:{ Accept:'application/json' }, cache:'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      messages = Array.isArray(data.messages) ? data.messages : [];
    } catch {
      messages = readStore(THREADS_KEY).find((item) => item?.id === record.id)?.messages || [];
    }
  }
  threadId = record.id;
  activeConversation = {kind:'nex',name:'Nex'};
  history.length = 0;
  for (const message of messages) history.push(message);
  showView('chat');
}
async function clearRecentConversationThreads(keepThreadIds=[]){
  const keep=new Set(Array.isArray(keepThreadIds)?keepThreadIds:[]);
  const clearable=(item)=>item?.id && !/^(agent-|group-|nex-main$)/u.test(item.id) && !keep.has(item.id);
  const targets=recentThreads.filter(clearable).map(item=>item.id);
  if(!targets.length)return {deleted:0};
  const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'clear_threads',keepThreadIds:[...keep]})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error || 'Those conversations could not be cleared');
  const removed=new Set(targets);
  writeStore(THREADS_KEY,readStore(THREADS_KEY).filter(item=>!removed.has(item?.id)));
  recentThreads=recentThreads.filter(item=>!removed.has(item?.id));
  drawRecents();
  return {...data,deleted:removed.size};
}
async function openMessagesConversation(conversation,fresh=false){
  activeConversation=conversation?.kind==='nex'?{kind:'nex',name:'Nex'}:conversation;
  threadId=['specialist','group'].includes(conversation?.kind)?conversation.id:fresh?`t${Date.now().toString(36)}`:'nex-main';
  history.length=0;
  if(!fresh){
    try{const response=await fetch(`/api/chat?threadId=${encodeURIComponent(threadId)}`,{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json().catch(()=>({}));if(response.ok)for(const message of data.messages || [])history.push(message);}catch{}
  }
  await showView('chat');
}
function drawRecents(){
  const threads = recentThreads, host = el('recents');
  if (!host) return;
  if (!threads.length) { host.innerHTML = '<div style="font-size:13px;color:#5f5b56;padding:8px 10px">Nothing yet</div>'; return; }
  host.innerHTML = '';
  for (const record of threads) {
    const button = document.createElement('button');
    button.className = 'item';
    button.innerHTML = `<span class="dot"></span><span class="tr">${esc(record.title)}</span>`;
    button.onclick = () => openThread(record);
    host.appendChild(button);
  }
}
function pinVisual(code, title){
  if (String(code).length > 120000) return false;
  const pins = readStore(PINS_KEY);
  if (!writeStore(PINS_KEY, [{ id:`p${Date.now().toString(36)}`, title, code }, ...pins].slice(0,12))) return false;
  drawPins();
  return true;
}
function drawPins(){
  const pins = readStore(PINS_KEY), host = el('pinned');
  if (!host) return;
  if (!pins.length) { host.innerHTML = '<div style="font-size:13px;color:#5f5b56;padding:8px 10px">Nothing pinned</div>'; return; }
  host.innerHTML = '';
  for (const pin of pins) {
    const button = document.createElement('button');
    button.className = 'item';
    button.innerHTML = `<span class="ic">▣</span><span class="tr">${esc(pin.title)}</span>`;
    button.onclick = () => { showView('chat'); renderVisual(pin.code, pin.title); };
    host.appendChild(button);
  }
}
drawPins();

// --- composer --------------------------------------------------------------
async function submit(){
  const raw = el('input').value.trim();
  if (!raw || busy) return;
  el('input').value = '';

  const target = matchView(raw);
  if (target) { showView(target); return; }

  if (currentView !== 'chat') { askFromView(raw); return; }
  bubble('u', esc(raw));
  if (!threadId) threadId = `t${Date.now().toString(36)}`;
  busy = true; el('send').disabled = true;
  const pending = bubble('a', '<p style="color:#6e6a64">Thinking…</p>');
  try {
    const response = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: raw, threadId, workspace: workspaceContext() }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
    const reply = data.reply || 'No reply came back.';
    pending.innerHTML = paragraphs(reply);
    history.push({ role:'user', content:raw }, { role:'assistant', content:reply });
    saveThread();
    renderResponseActions(data);
    // Nex asking the workspace to move is honoured as a view switch, not a page load.
    const wanted = data.navigation?.room || data.navigation?.url;
    if (wanted) {
      const id = matchView(String(wanted).replace(/^\/|\.html$/g,'').replace(/-/g,' '));
      if (id) showView(id);
    }
  } catch (error) {
    if(!el('input').value)el('input').value=raw;
    pending.innerHTML = `<p style="color:#c98b78">${esc(friendlyError(error,{action:'reply'}))} Your message is still in this conversation.</p>`;
  } finally { busy = false; el('send').disabled = false; }
}
el('send').onclick = submit;
el('input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
function workspaceContext() {
  const visible = [...thread.querySelectorAll('.msg, .lrow, .lhead')]
    .filter((node) => !node.closest('.secret-card'));
  const mode = currentView === 'workbench' ? 'workbench' : 'chat';
  return { active_view: `${location.pathname}#${currentView}`, mode, build_tools: NEX_CHAT_MODES[mode].buildTools,
    conversation: activeConversation && ['specialist','group'].includes(activeConversation.kind) ? {kind:activeConversation.kind,id:activeConversation.id} : null,
    screen: { title: currentView === 'chat' ? 'Nex Chat' : VIEWS[currentView].label,
      viewport_text: visible.map((node) => node.innerText).filter(Boolean).slice(0, 30),
      controls: [...thread.querySelectorAll('button')].filter((node) => !node.closest('.secret-card'))
        .map((node) => node.textContent).filter(Boolean).slice(0, 40),
    },
  };
}
function askFromView(text) {
  if (currentView === 'chat') { el('input').value = text; return submit(); }
  head.classList.add('show'); dock.classList.add('show'); place();
  dockAsk(text);
}
el('plannerQuickBtn').onclick = () => showView('planner');
el('projectsQuickBtn').onclick = () => showView('workbench');
el('connectedQuickBtn').onclick = () => showView('messages');
el('navMessages').onclick = () => showView('messages');
el('navProjects').onclick = () => showView('workbench');
el('navLife').onclick = () => showView('life');
el('navMore').onclick = () => { messagesStartMore=true;showView('messages'); };
el('newTop').onclick = () => {
  if(currentView==='chat'){
    document.getElementById('conversationMenu')?.remove();
    const card=document.createElement('section');card.id='conversationMenu';card.className='approvalcard conversationmenu';
    const title=document.createElement('strong');title.textContent='Conversation options';
    const fresh=document.createElement('button');fresh.className='uxprimary';fresh.textContent='Start a new conversation';fresh.onclick=()=>{messagesStartNew=true;activeConversation=null;history.length=0;threadId=null;showView('messages');};
    const inbox=document.createElement('button');inbox.className='messagesecondary';inbox.textContent='Back to Messages';inbox.onclick=()=>{activeConversation=null;showView('messages');};
    card.append(title,fresh,inbox);thread.append(card);thread.scrollTop=thread.scrollHeight;return;
  }
  messagesStartNew=true;activeConversation=null;history.length=0;threadId=null;showView('messages');
};
el('backMessages').onclick = () => { activeConversation=null;showView('messages'); };

function greet(){thread.appendChild(renderWelcome(ctx));}

// --- Nex head --------------------------------------------------------------
// Drags anywhere, snaps to the nearest side, stays put between sessions. Tap to
// open a small dock so he can be worked with on top of whatever view is open,
// rather than you leaving the view to reach him.
const head = el('head'), dock = el('dock');
let pos = (() => {
  try { return JSON.parse(localStorage.getItem('nexus:head') || 'null') || { x: window.innerWidth - 72, y: window.innerHeight - 190 }; }
  catch { return { x: window.innerWidth - 72, y: window.innerHeight - 190 }; }
})();
function place(){
  const x = Math.max(8, Math.min(pos.x, window.innerWidth - 60));
  const y = Math.max(8, Math.min(pos.y, window.innerHeight - 60));
  pos = { x, y };
  head.style.left = `${x}px`; head.style.top = `${y}px`;
  const left = x < window.innerWidth / 2;
  dock.style.left = left ? `${Math.max(8, x)}px` : 'auto';
  dock.style.right = left ? 'auto' : `${Math.max(8, window.innerWidth - x - 52)}px`;
  const above = y > window.innerHeight / 2;
  dock.style.top = above ? 'auto' : `${y + 60}px`;
  dock.style.bottom = above ? `${window.innerHeight - y + 8}px` : 'auto';
}
place();
let dragging = false, moved = false, offset = { x:0, y:0 };
head.addEventListener('pointerdown', (e) => {
  dragging = true; moved = false;
  offset = { x: e.clientX - pos.x, y: e.clientY - pos.y };
  head.setPointerCapture(e.pointerId);
  head.classList.add('dragging');
});
head.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const nx = e.clientX - offset.x, ny = e.clientY - offset.y;
  if (Math.abs(nx - pos.x) > 3 || Math.abs(ny - pos.y) > 3) moved = true;
  pos = { x: nx, y: ny }; place();
});
head.addEventListener('pointerup', (e) => {
  dragging = false; head.classList.remove('dragging');
  head.releasePointerCapture?.(e.pointerId);
  pos.x = pos.x + 26 < window.innerWidth / 2 ? 12 : window.innerWidth - 64; // snap to a side
  place();
  try { localStorage.setItem('nexus:head', JSON.stringify(pos)); } catch {}
  if (!moved) dock.classList.toggle('show');
});
el('headBtn').onclick = () => {
  head.classList.toggle('show');
  if (!head.classList.contains('show')) dock.classList.remove('show');
};
el('dockClose').onclick = () => dock.classList.remove('show');
window.addEventListener('resize', place);

// The dock's quick actions are the composer's tools, reachable without leaving
// the view you're in — which is the reason the head exists at all.
const DOCK_ACTIONS = [
  { label:'What needs me', text:'What actually needs me right now across the whole system?' },
  { label:'Read this view', text:'Read the view I have open and tell me what stands out.' },
  { label:'Approvals', view:'approvals' },
  { label:'Draw it', text:'Draw me a visual of what we just discussed.' },
];
for (const action of DOCK_ACTIONS) {
  const button = document.createElement('button');
  button.className = 'dact';
  button.textContent = action.label;
  button.onclick = () => {
    if (action.view) { showView(action.view); dock.classList.remove('show'); return; }
    dockAsk(action.text);
  };
  el('dockActs').appendChild(button);
}
async function dockAsk(text){
  const body = el('dockBody');
  body.textContent = 'Thinking…';
  if (!threadId) threadId = `t${Date.now().toString(36)}`;
  try {
    const response = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: text, threadId, workspace: workspaceContext() }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
    body.textContent = data.reply || 'No reply came back.';
    history.push({ role:'user', content:text }, { role:'assistant', content:data.reply || '' });
    saveThread();
  } catch (error) { body.textContent = friendlyError(error); }
}
el('dockSend').onclick = () => {
  const value = el('dockInput').value.trim();
  if (!value) return;
  el('dockInput').value = '';
  dockAsk(value);
};
el('dockInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('dockSend').click(); });

const requestedView = new URLSearchParams(location.search).get('view');
await loadThreads();
await showView(requestedView && VIEWS[requestedView] ? requestedView : 'messages');
startReminderAlerts(()=>showView('reminders'));
startReminderAlerts(()=>showView('life'),{endpoint:'/api/life?alerts=1'});
</script>
