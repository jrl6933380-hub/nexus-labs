<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Web Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; }

  /* Room Builder is a chat + live-build-preview tool, not a set of
     independent widgets — its whole point is one big live canvas
     where a generated page renders full-size next to the chat that's
     building it. Splitting that into several small draggable panels
     (like Memory/Queue/Tenants) would make it worse to use. So this
     migration puts the ENTIRE existing builder UI into one large
     panel on its own canvas (canvas_id: 'room-builder') — it's still
     genuinely "on a canvas" (draggable, resizable, on-brand), just as
     one cohesive block rather than fragmented pieces. Everything
     below this comment is the original room.html content, unchanged
     except height calcs that assumed being the whole page and are now
     relative to the panel instead of the viewport.
  */
  .room-builder-wrap {
    --bg: #0A0E14;
    --panel: #12192A;
    --border: #1F2B42;
    --blue: #2E7FFF;
    --cyan: #4DD8E8;
    --text: #E4E9F2;
    --text-dim: #8891A3;
    --text-faint: #5B6577;
    --amber: #E8A94D;
    --red: #E85D5D;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;

    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  .room-builder-wrap * { box-sizing: border-box; }

  .header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: relative;
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
  }

  .title { font-family: var(--mono); font-size: 15px; font-weight: 700; }

  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .back-link, .history-btn {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }

  .history-btn.active { color: var(--cyan); border-color: var(--cyan); }

  .push-btn {
    color: var(--amber);
    border-color: #E8A94D44;
  }

  .push-btn:disabled { opacity: 0.4; cursor: default; }

  #whoami {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-right: 2px;
  }

  #history-panel {
    display: none;
    position: absolute;
    top: 52px;
    right: 16px;
    width: 300px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  #history-panel.open { display: block; }

  .history-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }

  .history-item:hover { background: rgba(255,255,255,0.05); }

  .history-item .label {
    font-family: var(--sans);
    color: var(--text);
    margin-bottom: 2px;
  }

  .history-item .meta {
    font-family: var(--mono);
    color: var(--text-faint);
    font-size: 11px;
  }

  .history-empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px;
  }

  .room {
    display: grid;
    grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
    flex: 1;
    min-height: 0;
  }

  .chat-panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
    min-height: 0;
    overflow: hidden;
  }

  .chat-toolbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
  }

  .chat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: var(--cyan);
    font: 600 11px/1 var(--mono);
    letter-spacing: .08em;
    cursor: pointer;
  }

  .chat-toggle::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px rgba(77,216,232,.75);
  }

  .chat-toggle-label { color: var(--text-dim); letter-spacing: 0; }

  .chat-status {
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: .08em;
  }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    max-width: 90%;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--blue);
    color: #06090F;
  }

  .bubble.nex {
    align-self: flex-start;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .chat-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
  }

  .send-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--blue);
    color: #06090F;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .canvas {
    position: relative;
    background: #fff;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    font-size: 14px;
    font-family: var(--sans);
    padding: 0 32px;
  }

  #canvas-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }

  #canvas-frame.visible { display: block; }

  @media (max-width: 720px) {
    .header { padding: 10px 12px; }
    .title { font-size: 13px; }
    .back-link, .history-btn { padding: 6px 9px; }

    .room {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 200px;
    }

    .canvas {
      grid-column: 1;
      grid-row: 1;
    }

    .chat-panel {
      grid-column: 1;
      grid-row: 2;
      height: 108px;
      border-right: 0;
      border-top: 1px solid var(--border);
      box-shadow: 0 -10px 30px rgba(0,0,0,.28);
      transition: height .22s ease;
      z-index: 10;
    }

    .room-builder-wrap.chat-open .chat-panel {
      height: min(44dvh, 380px);
    }

    .chat-toolbar { display: flex; }
    .chat-history { display: none; padding: 10px; }
    .room-builder-wrap.chat-open .chat-history { display: flex; }

    .input-row { padding: 8px; }
    .chat-input { min-width: 0; padding: 10px; }
    .send-btn { padding: 10px 13px; }
    .bubble { font-size: 12px; max-width: 94%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat-panel { transition: none; }
  }

  .canvas-title-bar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10000;
    font: 700 11px 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase;
    color: #58d7ff; background: #111827e8; border: 1px solid #3c5a84; border-radius: 8px;
    padding: 7px 16px; backdrop-filter: blur(12px);
  }
  .return-link {
    position: fixed; top: 12px; left: 12px; z-index: 10000;
    font: 700 10px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
    color: #91a0b9; text-decoration: none; background: #111827e8; border: 1px solid #26334d;
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(12px);
  }
  .return-link:hover { color: #58d7ff; border-color: #4b8dff77; }

  /* Launch-grade builder cockpit. The inherited rules above preserve the
     original behavior; these rules establish the product hierarchy and
     phone-first working surface without changing the canvas engine. */
  .room-builder-wrap {
    --bg: #0b1018;
    --panel: #111822;
    --panel-raised: #18212e;
    --border: rgba(148,163,184,.18);
    --blue: #5db8ff;
    --cyan: #82d5ff;
    --text: #f4f7fb;
    --text-dim: #a0abba;
    --text-faint: #748094;
    --amber: #f2ba63;
  }
  .header {
    min-height: 58px; padding: 10px 12px 10px 16px; gap: 10px;
    flex-wrap: nowrap; background: rgba(11,16,24,.96);
  }
  .builder-brand { display: grid; min-width: 0; gap: 1px; }
  .title { font-family: var(--sans); font-size: 14px; font-weight: 680; letter-spacing: .01em; }
  .project-state { color: var(--text-faint); font: 500 11px/1.2 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .header-actions { flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .header-actions::-webkit-scrollbar { display: none; }
  .back-link, .history-btn {
    min-height: 36px; padding: 7px 11px; border-radius: 9px; white-space: nowrap;
    color: var(--text-dim); font: 600 12px var(--sans); background: rgba(255,255,255,.025);
  }
  .back-link:hover, .history-btn:hover, .back-link:focus-visible, .history-btn:focus-visible {
    color: var(--text); border-color: rgba(148,163,184,.34); outline: none;
  }
  .history-btn.primary { color: #d9efff; border-color: rgba(93,184,255,.4); background: rgba(93,184,255,.1); }
  .history-btn[hidden] { display: none; }
  .usage-pill {
    display: inline-flex; align-items: center; min-height: 34px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim);
    font: 600 11px var(--sans); white-space: nowrap;
  }
  #whoami { display: none; }
  #history-panel {
    top: 62px; right: 12px; width: min(340px, calc(100% - 24px)); max-height: min(520px, 72vh);
    padding: 8px; border-radius: 13px; background: rgba(17,24,34,.98);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  .history-item { padding: 11px; border-radius: 10px; border-bottom: 1px solid var(--border); }
  .history-item .label { font-size: 13px; font-weight: 600; }
  .history-item .meta { margin-top: 3px; font-size: 11px; }
  .room { grid-template-columns: minmax(280px, 330px) minmax(0, 1fr); }
  .chat-panel { background: var(--panel); }
  .chat-toolbar { display: flex; min-height: 46px; padding: 7px 10px 7px 14px; }
  .chat-heading { color: var(--text); font: 650 12px var(--sans); }
  .chat-tools { display: flex; align-items: center; gap: 8px; }
  .chat-toggle { display: none; }
  .chat-status { color: var(--text-dim); font: 600 10px var(--mono); }
  .voice-btn, .mic-btn {
    min-width: 38px; height: 34px; padding: 0 9px; border: 1px solid var(--border);
    border-radius: 9px; background: rgba(255,255,255,.025); color: var(--text-dim);
    font: 650 10px var(--sans); cursor: pointer;
  }
  .voice-btn[aria-pressed="true"] { color: #88e0b9; border-color: rgba(86,214,160,.4); background: rgba(86,214,160,.08); }
  .mic-btn.listening { color: #ff9aa7; border-color: rgba(255,124,140,.5); background: rgba(255,124,140,.08); }
  .chat-history { padding: 16px; gap: 10px; }
  .bubble { padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
  .bubble.user { background: #bce2ff; color: #07101a; }
  .bubble.nex { background: rgba(255,255,255,.035); }
  .input-row { align-items: flex-end; padding: 10px; }
  .chat-input {
    min-height: 42px; max-height: 112px; resize: none; padding: 10px 11px; border-radius: 10px;
    font-size: 14px; line-height: 1.4; background: #0a0f16;
  }
  .send-btn { min-height: 42px; padding: 10px 14px; border-radius: 10px; color: #07101a; font: 700 12px var(--sans); }
  .canvas { display: flex; flex-direction: column; background: #090e15; }
  .preview-toolbar {
    display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); background: var(--panel); overflow-x: auto; scrollbar-width: none;
  }
  .preview-toolbar::-webkit-scrollbar { display: none; }
  .preview-label { margin-right: auto; color: var(--text); font: 650 12px var(--sans); white-space: nowrap; }
  .device-switcher { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--border); border-radius: 9px; background: #0a0f16; }
  .device-btn, .preview-action {
    height: 30px; padding: 0 9px; border: 0; border-radius: 7px; background: transparent;
    color: var(--text-dim); font: 600 10px var(--sans); cursor: pointer; white-space: nowrap;
  }
  .device-btn[aria-pressed="true"] { background: var(--panel-raised); color: var(--text); }
  .preview-action { border: 1px solid var(--border); }
  .device-btn:focus-visible, .preview-action:focus-visible, .voice-btn:focus-visible, .mic-btn:focus-visible {
    outline: 2px solid rgba(93,184,255,.62); outline-offset: 2px;
  }
  .preview-stage { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; padding: 12px; overflow: auto; }
  #canvas-frame {
    flex: 0 0 auto; width: 100%; height: 100%; min-height: 320px; border-radius: 10px;
    background: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.34); transition: width .2s ease;
  }
  .canvas[data-viewport="tablet"] #canvas-frame { width: min(768px, 100%); }
  .canvas[data-viewport="phone"] #canvas-frame { width: min(390px, 100%); }
  .canvas-empty { inset: 0; color: var(--text-dim); font-size: 14px; }
  .canvas-empty-inner { max-width: 420px; }
  .canvas-empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 7px; }
  .canvas-empty span { display: block; line-height: 1.55; }

  @media (max-width: 720px) {
    .header { min-height: 50px; padding: 7px 8px 7px 12px; }
    .builder-brand { min-width: 104px; }
    .title { font-size: 13px; }
    .project-state { font-size: 10px; }
    .usage-pill { display: none; }
    .header-actions { margin-left: auto; }
    .back-link, .history-btn { min-height: 36px; padding: 7px 10px; }
    .room { grid-template-rows: minmax(0, 1fr) auto; }
    .chat-panel { height: 112px; }
    .room-builder-wrap.chat-open .chat-panel { height: min(48dvh, 410px); }
    .chat-toggle { display: inline-flex; font-family: var(--sans); font-size: 12px; letter-spacing: 0; text-transform: none; }
    .chat-toggle::before { box-shadow: none; }
    .chat-heading { display: none; }
    .chat-history { padding: 12px; }
    .bubble { font-size: 14px; }
    .input-row { padding: 8px; }
    .chat-input { font-size: 16px; }
    .preview-toolbar { min-height: 42px; padding: 5px 7px; }
    .preview-label { display: none; }
    .device-switcher { margin-right: auto; }
    .preview-stage { padding: 7px; }
    #canvas-frame { min-height: 260px; border-radius: 7px; }
    .canvas-empty { inset: 0; padding: 24px; }
  }
</style>
</head>
<body>
<script type="module">
  import { mountCanvas } from '/canvas-engine.js';

  const titleBar = document.createElement('div');
  titleBar.className = 'canvas-title-bar';
  titleBar.textContent = 'Room Builder';
  document.body.appendChild(titleBar);

  const returnLink = document.createElement('a');
  returnLink.className = 'return-link';
  returnLink.href = '/';
  returnLink.textContent = '← Dashboard';
  document.body.appendChild(returnLink);

  const canvas = mountCanvas({ canvasId: 'room-builder', canvasTitle: 'Room Builder' });

  const wrap = document.createElement('div');
  wrap.className = 'room-builder-wrap';
  wrap.innerHTML = `
    <div class="header">
      <div class="builder-brand">
        <span class="title">Web Builder</span>
        <span class="project-state" id="project-state">New project</span>
      </div>
      <div class="header-actions">
        <span class="usage-pill" id="usage-pill">Usage —</span>
        <button class="history-btn" id="new-btn" type="button">New</button>
        <span id="whoami"></span>
        <button class="history-btn" id="import-btn" type="button">Import Nexus</button>
        <button class="history-btn" id="export-btn" type="button" disabled>Export</button>
        <button class="history-btn push-btn" id="push-btn" type="button" hidden disabled>Open PR</button>
        <button class="history-btn primary" id="history-btn" type="button">Projects</button>
        <button class="back-link" id="logout-btn" type="button">Sign out</button>
      </div>
      <div id="history-panel">
        <div id="history-list" class="history-empty">Loading…</div>
      </div>
    </div>

    <div class="room">
      <aside class="chat-panel">
        <div class="chat-toolbar">
          <button class="chat-toggle" id="chat-toggle" type="button" aria-expanded="false">
            Nex <span class="chat-toggle-label" id="chat-toggle-label">Open conversation</span>
          </button>
          <span class="chat-heading">Build with Nex</span>
          <div class="chat-tools">
            <span class="chat-status" id="chat-status" role="status" aria-live="polite">Ready</span>
            <button class="voice-btn" id="voice-btn" type="button" aria-label="Toggle spoken build updates" aria-pressed="false">Audio</button>
          </div>
        </div>
        <div class="chat-history" id="chat-history"></div>
        <div class="input-row">
          <textarea class="chat-input" id="chat-input" rows="1" aria-label="Describe what to build or change" placeholder="Describe what to build or change…"></textarea>
          <button class="mic-btn" id="mic-btn" type="button" aria-label="Speak to Nex">Mic</button>
          <button class="send-btn" id="send-btn" type="button">Build</button>
        </div>
      </aside>

      <main class="canvas" data-viewport="responsive">
        <div class="preview-toolbar">
          <span class="preview-label">Live preview</span>
          <div class="device-switcher" role="group" aria-label="Preview size">
            <button class="device-btn" type="button" data-viewport="responsive" aria-pressed="true">Fit</button>
            <button class="device-btn" type="button" data-viewport="tablet" aria-pressed="false">Tablet</button>
            <button class="device-btn" type="button" data-viewport="phone" aria-pressed="false">Phone</button>
          </div>
          <button class="preview-action" id="refresh-btn" type="button" disabled>Refresh</button>
          <button class="preview-action" id="open-preview-btn" type="button" disabled>Open</button>
        </div>
        <div class="preview-stage">
          <div class="canvas-empty" id="canvas-empty"><div class="canvas-empty-inner"><strong>Build your first project</strong><span>Describe the site or tool you want. Nex will create it here, save every version, and keep editing from your next request.</span></div></div>
          <iframe id="canvas-frame" sandbox="allow-scripts allow-forms" title="Live project preview"></iframe>
        </div>
      </main>
    </div>
  `;

  canvas.addPanel({ id: 'room-builder', title: 'Room Builder', content: wrap, x: 60, y: 60, w: 900, h: 640 });

  // ---- Auth gate: bounce to login if there's no valid session ----
  // Runs before anything else renders meaningfully. A 401 here means
  // no session cookie or an expired one — send to the login page
  // rather than showing a room that will just fail on first message.
  (async function requireSession() {
    try {
      const res = await fetch('/api/room-auth');
      if (!res.ok) {
        window.location.href = '/room-login.html';
        return;
      }
      const data = await res.json();
      document.getElementById('whoami').innerText = data.username;
    } catch (err) {
      window.location.href = '/room-login.html';
    }
  })();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    try {
      await fetch('/api/room-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' }),
      });
    } finally {
      window.location.href = '/room-login.html';
    }
  });

  // ---- Project state: the current document plus enough local metadata to
  // drive safe actions and a clear phone-first workflow. ----
  let currentHtml = '';
  let currentLabel = 'New project';

  const frame = document.getElementById('canvas-frame');
  const emptyState = document.getElementById('canvas-empty');
  const pushBtn = document.getElementById('push-btn');
  const exportBtn = document.getElementById('export-btn');
  const openPreviewBtn = document.getElementById('open-preview-btn');
  const refreshBtn = document.getElementById('refresh-btn');
  const projectState = document.getElementById('project-state');
  const usagePill = document.getElementById('usage-pill');

  function isNexusImport(html) {
    return /<!-- NEXUS_SAFETY_SHIM_START -->/i.test(html);
  }

  function renderHtml(html, { label } = {}) {
    currentHtml = html;
    currentLabel = label || currentLabel || 'Untitled project';
    frame.srcdoc = html;
    frame.classList.add('visible');
    emptyState.style.display = 'none';
    projectState.innerText = currentLabel;
    exportBtn.disabled = false;
    openPreviewBtn.disabled = false;
    refreshBtn.disabled = false;
    // Opening a PR changes the real Nexus homepage and therefore appears only
    // for an imported, visibly sandboxed Nexus copy — never for an ordinary
    // customer project generated from scratch.
    pushBtn.hidden = !isNexusImport(html);
    pushBtn.disabled = pushBtn.hidden;
  }

  function resetProject() {
    currentHtml = '';
    currentLabel = 'New project';
    projectState.innerText = currentLabel;
    frame.srcdoc = '';
    frame.classList.remove('visible');
    emptyState.style.display = '';
    exportBtn.disabled = true;
    openPreviewBtn.disabled = true;
    refreshBtn.disabled = true;
    pushBtn.hidden = true;
    pushBtn.disabled = true;
  }

  function stripLiveEditWidget(html) {
    return html.replace(/<!-- NEXUS_LIVE_EDIT_WIDGET_START -->[\s\S]*?<!-- NEXUS_LIVE_EDIT_WIDGET_END -->\n?/i, '');
  }

  function portableHtml() {
    return stripSafetyShim(stripLiveEditWidget(currentHtml));
  }

  function projectBlobUrl() {
    return URL.createObjectURL(new Blob([portableHtml()], { type: 'text/html;charset=utf-8' }));
  }

  document.getElementById('new-btn').addEventListener('click', () => {
    if (currentHtml && !window.confirm('Start a new project? Your saved versions will stay in Projects.')) return;
    resetProject();
    addBubble('nex', 'New project ready. What should we build?');
    setChatOpen(true);
    chatInput.focus();
  });

  exportBtn.addEventListener('click', () => {
    if (!currentHtml) return;
    const url = projectBlobUrl();
    const download = document.createElement('a');
    download.href = url;
    download.download = 'nexus-project.html';
    download.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  openPreviewBtn.addEventListener('click', () => {
    if (!currentHtml) return;
    const url = projectBlobUrl();
    window.open(url, '_blank', 'noopener,noreferrer');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });

  refreshBtn.addEventListener('click', () => {
    if (!currentHtml) return;
    frame.srcdoc = currentHtml;
  });

  document.querySelectorAll('.device-btn').forEach((button) => {
    button.addEventListener('click', () => {
      document.querySelector('.canvas').dataset.viewport = button.dataset.viewport;
      document.querySelectorAll('.device-btn').forEach((candidate) => {
        candidate.setAttribute('aria-pressed', String(candidate === button));
      });
    });
  });

  async function refreshUsage() {
    try {
      const res = await fetch('/api/room-usage', { headers: { Accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const { usage } = await res.json();
      usagePill.innerText = `${usage.remaining} credits left`;
      usagePill.title = `${usage.consumed} used of ${usage.limit} this period`;
    } catch {
      usagePill.innerText = 'Usage unavailable';
    }
  }

  refreshUsage();

  // ---- History panel -------------------------------------------
  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const historyList = document.getElementById('history-list');

  function formatWhen(ts) {
    const diffMin = Math.round((Date.now() - ts) / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return `${diffMin}m ago`;
    const diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return `${diffHr}h ago`;
    return new Date(ts).toLocaleDateString();
  }

  async function loadHistoryList() {
    historyList.className = 'history-empty';
    historyList.innerText = 'Loading…';
    try {
      const res = await fetch('/api/room-history');
      const data = await res.json();
      const builds = data.builds || [];
      if (builds.length === 0) {
        historyList.innerText = 'No saved builds yet.';
        return;
      }
      historyList.className = '';
      historyList.innerHTML = '';
      builds.forEach((b) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="label"></div><div class="meta"></div>`;
        item.querySelector('.label').innerText = b.label;
        item.querySelector('.meta').innerText = formatWhen(b.createdAt);
        item.addEventListener('click', () => loadBuild(b.id));
        const download = document.createElement('a');
        download.textContent = 'Download HTML';
        download.href = '/api/room-history?id=' + encodeURIComponent(b.id) + '&download=html';
        download.setAttribute('download', 'nexus-build.html');
        download.style.cssText = 'display:inline-block;padding:12px 0;color:var(--cyan)';
        download.title = 'Download generated code. Review before opening; external services are not bundled.';
        download.addEventListener('click', (event) => event.stopPropagation());
        item.appendChild(download);
        historyList.appendChild(item);
      });
    } catch (err) {
      historyList.className = 'history-empty';
      historyList.innerText = "Couldn't load history.";
    }
  }

  async function loadBuild(id) {
    try {
      const res = await fetch('/api/room-history?id=' + encodeURIComponent(id));
      const data = await res.json();
      if (data.build) {
        renderHtml(data.build.html, { label: data.build.label || 'Saved project' });
        addBubble('nex', `Loaded "${data.build.label}" from history.`);
        historyPanel.classList.remove('open');
        historyBtn.classList.remove('active');
      }
    } catch (err) {
      addBubble('nex', "Couldn't load that build.");
    }
  }

  historyBtn.addEventListener('click', () => {
    const opening = !historyPanel.classList.contains('open');
    historyPanel.classList.toggle('open', opening);
    historyBtn.classList.toggle('active', opening);
    if (opening) loadHistoryList();
  });

  // ---- Chat -------------------------------------------
  const chatHistory = document.getElementById('chat-history');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const chatToggle = document.getElementById('chat-toggle');
  const chatToggleLabel = document.getElementById('chat-toggle-label');
  const chatStatus = document.getElementById('chat-status');
  const mobileLayout = window.matchMedia('(max-width: 720px)');

  function setChatOpen(open) {
    wrap.classList.toggle('chat-open', open);
    chatToggle.setAttribute('aria-expanded', String(open));
    chatToggleLabel.innerText = open ? 'Hide conversation' : 'Open conversation';
  }

  chatToggle.addEventListener('click', () => {
    setChatOpen(!wrap.classList.contains('chat-open'));
  });

  setChatOpen(!mobileLayout.matches);
  mobileLayout.addEventListener('change', (event) => setChatOpen(!event.matches));

  function addBubble(role, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.innerText = text;
    chatHistory.appendChild(el);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return el;
  }

  // Voice uses the browser's built-in speech APIs and remains opt-in. No
  // recording or transcript is stored outside the normal build request.
  const micBtn = document.getElementById('mic-btn');
  const voiceBtn = document.getElementById('voice-btn');
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechOutputSupported = 'speechSynthesis' in window;
  let voiceEnabled = false;
  let recognition = null;

  try { voiceEnabled = localStorage.getItem('nexus-room-voice-v1') === 'true'; } catch {}

  function updateVoiceButton() {
    voiceBtn.setAttribute('aria-pressed', String(voiceEnabled));
    voiceBtn.innerText = voiceEnabled ? 'Audio on' : 'Audio';
  }

  function speakUpdate(text) {
    if (!voiceEnabled || !speechOutputSupported) return;
    window.speechSynthesis.cancel();
    const message = new SpeechSynthesisUtterance(text);
    message.rate = 1.02;
    window.speechSynthesis.speak(message);
  }

  if (speechOutputSupported) {
    updateVoiceButton();
    voiceBtn.addEventListener('click', () => {
      voiceEnabled = !voiceEnabled;
      try { localStorage.setItem('nexus-room-voice-v1', String(voiceEnabled)); } catch {}
      if (!voiceEnabled) window.speechSynthesis.cancel();
      updateVoiceButton();
    });
  } else {
    voiceBtn.remove();
  }

  if (SpeechRecognitionImpl) {
    recognition = new SpeechRecognitionImpl();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.addEventListener('start', () => {
      micBtn.classList.add('listening');
      micBtn.innerText = 'Listening';
      chatStatus.innerText = 'Listening';
    });
    recognition.addEventListener('end', () => {
      micBtn.classList.remove('listening');
      micBtn.innerText = 'Mic';
      if (!sendBtn.disabled) chatStatus.innerText = 'Ready';
    });
    recognition.addEventListener('error', () => {
      micBtn.classList.remove('listening');
      micBtn.innerText = 'Mic';
      chatStatus.innerText = 'Ready';
    });
    recognition.addEventListener('result', (event) => {
      let transcript = '';
      for (let index = event.resultIndex; index < event.results.length; index += 1) {
        transcript += event.results[index][0].transcript;
      }
      chatInput.value = transcript;
      chatInput.dispatchEvent(new Event('input'));
    });
    micBtn.addEventListener('click', () => {
      if (speechOutputSupported) window.speechSynthesis.cancel();
      recognition.start();
    });
  } else {
    micBtn.remove();
  }

  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = `${Math.min(chatInput.scrollHeight, 112)}px`;
  });

  addBubble('nex', 'Describe the project you want. I’ll build the first working version here, save it automatically, and make focused edits from each follow-up.');
  addBubble('nex', 'Try: “Build a polished one-page site for an insured painting company with a quote form.”');

  // ---- Import / Push -------------------------------------------
  // Import: fetch the ACTUAL live public/index.html (same-origin, so
  // this is a plain fetch, not an API call) and inject a safety shim
  // before rendering it into the canvas. The shim:
  //  - overrides window.fetch to always reject, so nothing in the
  //    imported page can hit a real endpoint (a real chat message, a
  //    real queue action) no matter how the sandboxed srcdoc iframe
  //    resolves relative URLs;
  //  - polyfills localStorage with an in-memory stand-in, because the
  //    canvas iframe has no allow-same-origin and the real page's
  //    unguarded localStorage.getItem call would otherwise throw and
  //    break the rest of its script;
  //  - shows a visible "SAFE COPY" banner so it's never mistaken for
  //    the live page.
  // Push: strips that shim back out and posts the result to
  // /api/room-push, which opens a real branch + PR — never merges.
  const SAFETY_SHIM = `<!-- NEXUS_SAFETY_SHIM_START -->
<div style="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#E8A94D;color:#0A0E14;font:600 12px 'JetBrains Mono',monospace;text-align:center;padding:6px;">SAFE COPY — imported from the real Nexus Labs, not live. Redesign freely.</div>
<script>
(function(){
  window.fetch = function(){ return Promise.reject(new Error('Live network calls are disabled in this copy.')); };
  var memoryStore = {};
  var fakeStorage = {
    getItem: function(k){ return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null; },
    setItem: function(k, v){ memoryStore[k] = String(v); },
    removeItem: function(k){ delete memoryStore[k]; },
    clear: function(){ memoryStore = {}; }
  };
  try { Object.defineProperty(window, 'localStorage', { value: fakeStorage, configurable: true }); } catch (e) {}
})();
<\/script>
<!-- NEXUS_SAFETY_SHIM_END -->`;

  function injectSafetyShim(html) {
    if (/<body[^>]*>/i.test(html)) {
      return html.replace(/<body([^>]*)>/i, '<body$1>\n' + SAFETY_SHIM);
    }
    return SAFETY_SHIM + html;
  }

  function stripSafetyShim(html) {
    return html.replace(/<!-- NEXUS_SAFETY_SHIM_START -->[\s\S]*?<!-- NEXUS_SAFETY_SHIM_END -->\n?/i, '');
  }

  document.getElementById('import-btn').addEventListener('click', async () => {
    try {
      const res = await fetch('/index.html');
      const raw = await res.text();
      renderHtml(injectSafetyShim(raw), { label: 'Nexus homepage redesign' });
      addBubble('nex', 'Imported a safe Nexus homepage copy. Network calls are disabled here. Make your changes, then Open PR when it is ready for review.');
    } catch (err) {
      addBubble('nex', "Couldn't import the home page.");
    }
  });

  pushBtn.addEventListener('click', async () => {
    if (!currentHtml || pushBtn.disabled || !isNexusImport(currentHtml)) return;
    pushBtn.disabled = true;
    addBubble('user', 'Open a PR for this Nexus design');
    const pushingBubble = addBubble('nex', 'Opening a PR with this design…');
    try {
      const res = await fetch('/api/room-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html: currentHtml }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        pushingBubble.innerText = 'Failed to open the PR: ' + (data.error || 'unknown error');
      } else {
        pushingBubble.innerText = `PR opened: ${data.html_url} — not merged, needs review.`;
      }
    } catch (err) {
      pushingBubble.innerText = 'Something went wrong opening the PR.';
    } finally {
      pushBtn.disabled = false;
    }
  });

  // sendMessage can be called from the chat box (no argument — reads
  // chatInput.value) or from the live-edit widget embedded in a
  // generated page (messageOverride — see the postMessage listener
  // below).
  async function sendMessage(messageOverride) {
    const message = (typeof messageOverride === 'string' ? messageOverride : chatInput.value).trim();
    if (!message || sendBtn.disabled) return;
    setChatOpen(true);
    chatStatus.innerText = 'Building';
    addBubble('user', message);
    chatInput.value = '';
    sendBtn.disabled = true;
    chatInput.disabled = true;
    const buildingBubble = addBubble('nex', 'Building… (complex builds like games can take up to a minute)');

    const slowNotice = setTimeout(() => {
      buildingBubble.innerText = 'Still building… interactive stuff takes longer, hang tight.';
    }, 20000);

    // The server aborts upstream generation at 110s. Keep a slightly longer
    // browser backstop for dead connections without cancelling valid builds.
    const abortCtrl = new AbortController();
    const clientTimeout = setTimeout(() => abortCtrl.abort(), 115000);

    try {
      const res = await fetch('/api/room-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, currentHtml }),
        signal: abortCtrl.signal,
      });

      if (res.status === 401) {
        clearTimeout(slowNotice);
        buildingBubble.innerText = 'Your session expired — redirecting to sign in.';
        setTimeout(() => { window.location.href = '/room-login.html'; }, 1200);
        return;
      }

      if (!res.ok) {
        const failure = await res.json().catch(() => ({}));
        if (res.status === 429 && failure.code === 'ROOM_CREDITS_EXHAUSTED') {
          buildingBubble.innerText = failure.error + ' Check your Room usage before trying again.';
        } else {
          buildingBubble.innerText = failure.error || 'The Room could not start that build.';
        }
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let gotHtml = false;
      let generatedHtml = '';
      let saveNote = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const chunks = buffer.split('\n\n');
        buffer = chunks.pop() || '';

        for (const chunk of chunks) {
          if (!chunk.startsWith('data: ')) continue;
          const event = JSON.parse(chunk.slice(6));

          if (event.action === 'html') {
            gotHtml = true;
            generatedHtml = event.html;
            clearTimeout(slowNotice);
            renderHtml(generatedHtml, { label: message.slice(0, 64) });
            chatStatus.innerText = 'Ready';
            if (mobileLayout.matches) setChatOpen(false);
          } else if (event.action === 'progress') {
            buildingBubble.innerText = event.message || 'Still building…';
          } else if (event.action === 'save_error') {
            saveNote = ' (' + event.message + ')';
          } else if (event.action === 'done') {
            clearTimeout(slowNotice);
            buildingBubble.innerText = gotHtml
              ? 'Done — take a look.' + saveNote
              : "Didn't get a page back — try rephrasing that.";
            if (gotHtml) speakUpdate('Your build is ready.');
          } else if (event.action === 'error') {
            clearTimeout(slowNotice);
            buildingBubble.innerText = 'Ran into an issue: ' + event.message;
          }
        }
      }
    } catch (err) {
      clearTimeout(slowNotice);
      if (err.name === 'AbortError') {
        buildingBubble.innerText = 'That build took too long and the connection was stopped. Try something simpler or build it in smaller steps.';
      } else {
        buildingBubble.innerText = 'Something went wrong reaching the room.';
      }
    } finally {
      clearTimeout(clientTimeout);
      chatStatus.innerText = 'Ready';
      sendBtn.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
      refreshUsage();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage());
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ---- Live-edit widget bridge -------------------------------------------
  // The chat bubble injected into every generated page (see
  // injectLiveEditWidget in api/room-chat.js) posts a message here when
  // someone submits something from inside the iframe. Only accept
  // messages that actually came from our own canvas iframe.
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;
    const data = event.data;
    if (data && data.source === 'nexus-live-edit-widget' && typeof data.message === 'string') {
      sendMessage(data.message);
    }
  });
</script>
</body>
</html>
