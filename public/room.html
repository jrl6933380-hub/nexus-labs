<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nexus Forge</title>
<!--
  The old Room Builder lived here. It was retired in favor of the Forge
  workspace (/forge.html), which reads the same saved projects. This page only
  forwards old links, bookmarks, and Stripe return URLs so nothing 404s.
  The old source is in git history if it is ever needed.
-->
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var view = params.get('checkout') ? 'billing' : 'chat';
    var next = '/forge.html?view=' + view;
    if (params.get('checkout')) next += '&checkout=' + encodeURIComponent(params.get('checkout'));
    window.location.replace(next);
  })();
</script>
<meta http-equiv="refresh" content="0; url=/forge.html?view=chat" />
<style>body{background:#0b0d12;color:#e8eaed;font:15px -apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#e6c07b}</style>
</head>
<body>
  <a href="/forge.html?view=chat">Opening Nexus Forge&hellip;</a>
</body>
</html>
