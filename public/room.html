<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus // Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E14;
    --panel: #12192A;
    --border: #1F2B42;
    --blue: #2E7FFF;
    --cyan: #4DD8E8;
    --text: #E4E9F2;
    --text-dim: #8891A3;
    --text-faint: #5B6577;
    --amber: #E8A94D;
    --red: #E85D5D;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: relative;
    flex-wrap: wrap;
    gap: 8px;
  }

  .title { font-family: var(--mono); font-size: 15px; font-weight: 700; }

  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .back-link, .history-btn {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    background: none;
    cursor: pointer;
  }

  .history-btn.active { color: var(--cyan); border-color: var(--cyan); }

  .push-btn {
    color: var(--amber);
    border-color: #E8A94D44;
  }

  .push-btn:disabled { opacity: 0.4; cursor: default; }

  #whoami {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    margin-right: 2px;
  }

  #history-panel {
    display: none;
    position: absolute;
    top: 52px;
    right: 16px;
    width: 300px;
    max-height: 70vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  #history-panel.open { display: block; }

  .history-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }

  .history-item:hover { background: rgba(255,255,255,0.05); }

  .history-item .label {
    font-family: var(--sans);
    color: var(--text);
    margin-bottom: 2px;
  }

  .history-item .meta {
    font-family: var(--mono);
    color: var(--text-faint);
    font-size: 11px;
  }

  .history-empty {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 10px;
  }

  .room {
    display: grid;
    grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
    height: calc(100vh - 109px);
    height: calc(100dvh - 109px);
    min-height: 0;
  }

  .chat-panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--panel);
    min-height: 0;
    overflow: hidden;
  }

  .chat-toolbar {
    display: none;
    align-items: center;
    justify-content: space-between;
    min-height: 36px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
  }

  .chat-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    background: transparent;
    color: var(--cyan);
    font: 600 11px/1 var(--mono);
    letter-spacing: .08em;
    cursor: pointer;
  }

  .chat-toggle::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px rgba(77,216,232,.75);
  }

  .chat-toggle-label { color: var(--text-dim); letter-spacing: 0; }

  .chat-status {
    color: var(--text-faint);
    font-size: 10px;
    letter-spacing: .08em;
  }

  .chat-history {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .bubble {
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    max-width: 90%;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--blue);
    color: #06090F;
  }

  .bubble.nex {
    align-self: flex-start;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .chat-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
  }

  .send-btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: var(--blue);
    color: #06090F;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .send-btn:disabled { opacity: 0.5; cursor: default; }

  .canvas {
    position: relative;
    background: #fff;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .canvas-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    font-size: 14px;
    font-family: var(--sans);
    padding: 0 32px;
  }

  #canvas-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }

  #canvas-frame.visible { display: block; }

  @media (max-width: 720px) {
    .header { padding: 10px 12px; }
    .title { font-size: 13px; }
    .back-link, .history-btn { padding: 6px 9px; }

    .room {
      grid-template-columns: 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      height: calc(100dvh - 173px);
      min-height: 300px;
    }

    .canvas {
      grid-column: 1;
      grid-row: 1;
    }

    .chat-panel {
      grid-column: 1;
      grid-row: 2;
      height: 108px;
      border-right: 0;
      border-top: 1px solid var(--border);
      box-shadow: 0 -10px 30px rgba(0,0,0,.28);
      transition: height .22s ease;
      z-index: 10;
    }

    .room.chat-open .chat-panel {
      height: min(44dvh, 380px);
    }

    .chat-toolbar { display: flex; }
    .chat-history { display: none; padding: 10px; }
    .room.chat-open .chat-history { display: flex; }

    .input-row { padding: 8px; }
    .chat-input { min-width: 0; padding: 10px; }
    .send-btn { padding: 10px 13px; }
    .bubble { font-size: 12px; max-width: 94%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chat-panel { transition: none; }
  }
</style>
<link rel="stylesheet" href="/nexus-stark.css">
</head>
<body>

<div class="header">
  <span class="title">NEX // ROOM</span>
  <div class="header-actions">
    <span id="whoami"></span>
    <button class="history-btn" id="import-btn">Import Home</button>
    <button class="history-btn push-btn" id="push-btn" disabled>Push Design</button>
    <button class="history-btn" id="history-btn">History</button>
    <button class="back-link" id="logout-btn">Logout</button>
    <a class="back-link" href="/">← Back to chat</a>
  </div>
  <div id="history-panel">
    <div id="history-list" class="history-empty">Loading…</div>
  </div>
</div>

<div class="room">
  <aside class="chat-panel">
    <div class="chat-toolbar">
      <button class="chat-toggle" id="chat-toggle" type="button" aria-expanded="false">
        CHAT <span class="chat-toggle-label" id="chat-toggle-label">Open log</span>
      </button>
      <span class="chat-status" id="chat-status">READY</span>
    </div>
    <div class="chat-history" id="chat-history"></div>
    <div class="input-row">
      <input class="chat-input" id="chat-input" placeholder="Tell Nex what to build...">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </aside>

  <main class="canvas">
    <div class="canvas-empty" id="canvas-empty">Ask for anything — a website, a game, a tool, whatever you can think of. It'll build here.</div>
    <iframe id="canvas-frame" sandbox="allow-scripts allow-forms" title="Live build canvas"></iframe>
  </main>
</div>

<script>
  // ---- Auth gate: bounce to login if there's no valid session ----
  // Runs before anything else renders meaningfully. A 401 here means
  // no session cookie or an expired one — send to the login page
  // rather than showing a room that will just fail on first message.
  (async function requireSession() {
    try {
      const res = await fetch('/api/room-auth');
      if (!res.ok) {
        window.location.href = '/room-login.html';
        return;
      }
      const data = await res.json();
      document.getElementById('whoami').innerText = data.username;
    } catch (err) {
      window.location.href = '/room-login.html';
    }
  })();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    try {
      await fetch('/api/room-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' }),
      });
    } finally {
      window.location.href = '/room-login.html';
    }
  });

  // ---- State: just the last-built HTML, so follow-up requests can edit it ----
  let currentHtml = '';

  const frame = document.getElementById('canvas-frame');
  const emptyState = document.getElementById('canvas-empty');
  const pushBtn = document.getElementById('push-btn');

  function renderHtml(html) {
    currentHtml = html;
    frame.srcdoc = html;
    frame.classList.add('visible');
    emptyState.style.display = 'none';
    pushBtn.disabled = false;
  }

  // ---- History panel -------------------------------------------
  const historyBtn = document.getElementById('history-btn');
  const historyPanel = document.getElementById('history-panel');
  const historyList = document.getElementById('history-list');

  function formatWhen(ts) {
    const diffMin = Math.round((Date.now() - ts) / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return `${diffMin}m ago`;
    const diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return `${diffHr}h ago`;
    return new Date(ts).toLocaleDateString();
  }

  async function loadHistoryList() {
    historyList.className = 'history-empty';
    historyList.innerText = 'Loading…';
    try {
      const res = await fetch('/api/room-history');
      const data = await res.json();
      const builds = data.builds || [];
      if (builds.length === 0) {
        historyList.innerText = 'No saved builds yet.';
        return;
      }
      historyList.className = '';
      historyList.innerHTML = '';
      builds.forEach((b) => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="label"></div><div class="meta"></div>`;
        item.querySelector('.label').innerText = b.label;
        item.querySelector('.meta').innerText = formatWhen(b.createdAt);
        item.addEventListener('click', () => loadBuild(b.id));
        historyList.appendChild(item);
      });
    } catch (err) {
      historyList.className = 'history-empty';
      historyList.innerText = "Couldn't load history.";
    }
  }

  async function loadBuild(id) {
    try {
      const res = await fetch('/api/room-history?id=' + encodeURIComponent(id));
      const data = await res.json();
      if (data.build) {
        renderHtml(data.build.html);
        addBubble('nex', `Loaded "${data.build.label}" from history.`);
        historyPanel.classList.remove('open');
        historyBtn.classList.remove('active');
      }
    } catch (err) {
      addBubble('nex', "Couldn't load that build.");
    }
  }

  historyBtn.addEventListener('click', () => {
    const opening = !historyPanel.classList.contains('open');
    historyPanel.classList.toggle('open', opening);
    historyBtn.classList.toggle('active', opening);
    if (opening) loadHistoryList();
  });

  // ---- Chat -------------------------------------------
  const chatHistory = document.getElementById('chat-history');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const room = document.querySelector('.room');
  const chatToggle = document.getElementById('chat-toggle');
  const chatToggleLabel = document.getElementById('chat-toggle-label');
  const chatStatus = document.getElementById('chat-status');
  const mobileLayout = window.matchMedia('(max-width: 720px)');

  function setChatOpen(open) {
    room.classList.toggle('chat-open', open);
    chatToggle.setAttribute('aria-expanded', String(open));
    chatToggleLabel.innerText = open ? 'Hide log' : 'Open log';
  }

  chatToggle.addEventListener('click', () => {
    setChatOpen(!room.classList.contains('chat-open'));
  });

  setChatOpen(!mobileLayout.matches);
  mobileLayout.addEventListener('change', (event) => setChatOpen(!event.matches));

  function addBubble(role, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.innerText = text;
    chatHistory.appendChild(el);
    chatHistory.scrollTop = chatHistory.scrollHeight;
    return el;
  }

  addBubble('nex', 'Tell me what to build — a website, a game, a tool, anything. Try: "build a landing page for a coffee shop called Rise & Grind"');
  addBubble('nex', 'Everything you build here is saved automatically — check History any time to pick up an old one.');
  addBubble('nex', 'Every page you build also gets its own chat bubble in the corner, so you (or anyone you show it to) can keep editing it from inside the page itself.');
  addBubble('nex', 'Tap "Import Home" to pull in a safe copy of the real Nexus Labs home page and redesign it right here — nothing you do to it is live. Like what you see? "Push Design" opens a real PR for review, same as everything else.');

  // ---- Import / Push -------------------------------------------
  // Import: fetch the ACTUAL live public/index.html (same-origin, so
  // this is a plain fetch, not an API call) and inject a safety shim
  // before rendering it into the canvas. The shim:
  //  - overrides window.fetch to always reject, so nothing in the
  //    imported page can hit a real endpoint (a real chat message, a
  //    real queue action) no matter how the sandboxed srcdoc iframe
  //    resolves relative URLs;
  //  - polyfills localStorage with an in-memory stand-in, because the
  //    canvas iframe has no allow-same-origin and the real page's
  //    unguarded localStorage.getItem call would otherwise throw and
  //    break the rest of its script;
  //  - shows a visible "SAFE COPY" banner so it's never mistaken for
  //    the live page.
  // Push: strips that shim back out and posts the result to
  // /api/room-push, which opens a real branch + PR — never merges.
  const SAFETY_SHIM = `<!-- NEXUS_SAFETY_SHIM_START -->
<div style="position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#E8A94D;color:#0A0E14;font:600 12px 'JetBrains Mono',monospace;text-align:center;padding:6px;">SAFE COPY — imported from the real Nexus Labs, not live. Redesign freely.</div>
<script>
(function(){
  window.fetch = function(){ return Promise.reject(new Error('Live network calls are disabled in this copy.')); };
  var memoryStore = {};
  var fakeStorage = {
    getItem: function(k){ return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null; },
    setItem: function(k, v){ memoryStore[k] = String(v); },
    removeItem: function(k){ delete memoryStore[k]; },
    clear: function(){ memoryStore = {}; }
  };
  try { Object.defineProperty(window, 'localStorage', { value: fakeStorage, configurable: true }); } catch (e) {}
})();
<\/script>
<!-- NEXUS_SAFETY_SHIM_END -->`;

  function injectSafetyShim(html) {
    if (/<body[^>]*>/i.test(html)) {
      return html.replace(/<body([^>]*)>/i, '<body$1>\n' + SAFETY_SHIM);
    }
    return SAFETY_SHIM + html;
  }

  function stripSafetyShim(html) {
    return html.replace(/<!-- NEXUS_SAFETY_SHIM_START -->[\s\S]*?<!-- NEXUS_SAFETY_SHIM_END -->\n?/i, '');
  }

  document.getElementById('import-btn').addEventListener('click', async () => {
    try {
      const res = await fetch('/index.html');
      const raw = await res.text();
      renderHtml(injectSafetyShim(raw));
      addBubble('nex', 'Imported a safe copy of the real home page — network calls are disabled so nothing here is live. Ask for whatever changes you want, then "Push Design" when you like it.');
    } catch (err) {
      addBubble('nex', "Couldn't import the home page.");
    }
  });

  pushBtn.addEventListener('click', async () => {
    if (!currentHtml || pushBtn.disabled) return;
    pushBtn.disabled = true;
    addBubble('user', 'Push this design');
    const pushingBubble = addBubble('nex', 'Opening a PR with this design…');
    try {
      const res = await fetch('/api/room-push', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html: stripSafetyShim(currentHtml) }),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        pushingBubble.innerText = 'Failed to open the PR: ' + (data.error || 'unknown error');
      } else {
        pushingBubble.innerText = `PR opened: ${data.html_url} — not merged, needs review.`;
      }
    } catch (err) {
      pushingBubble.innerText = 'Something went wrong opening the PR.';
    } finally {
      pushBtn.disabled = false;
    }
  });

  // sendMessage can be called from the chat box (no argument — reads
  // chatInput.value) or from the live-edit widget embedded in a
  // generated page (messageOverride — see the postMessage listener
  // below).
  async function sendMessage(messageOverride) {
    const message = (typeof messageOverride === 'string' ? messageOverride : chatInput.value).trim();
    if (!message || sendBtn.disabled) return;
    setChatOpen(true);
    chatStatus.innerText = 'BUILDING';
    addBubble('user', message);
    chatInput.value = '';
    sendBtn.disabled = true;
    chatInput.disabled = true;
    const buildingBubble = addBubble('nex', 'Building… (complex builds like games can take up to a minute)');

    const slowNotice = setTimeout(() => {
      buildingBubble.innerText = 'Still building… interactive stuff takes longer, hang tight.';
    }, 20000);

    // The server aborts upstream generation at 110s. Keep a slightly longer
    // browser backstop for dead connections without cancelling valid builds.
    const abortCtrl = new AbortController();
    const clientTimeout = setTimeout(() => abortCtrl.abort(), 115000);

    try {
      const res = await fetch('/api/room-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, currentHtml }),
        signal: abortCtrl.signal,
      });

      if (res.status === 401) {
        clearTimeout(slowNotice);
        buildingBubble.innerText = 'Your session expired — redirecting to sign in.';
        setTimeout(() => { window.location.href = '/room-login.html'; }, 1200);
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let gotHtml = false;
      let generatedHtml = '';
      let saveNote = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const chunks = buffer.split('\n\n');
        buffer = chunks.pop() || '';

        for (const chunk of chunks) {
          if (!chunk.startsWith('data: ')) continue;
          const event = JSON.parse(chunk.slice(6));

          if (event.action === 'html') {
            gotHtml = true;
            generatedHtml = event.html;
            clearTimeout(slowNotice);
            renderHtml(generatedHtml);
            chatStatus.innerText = 'READY';
            if (mobileLayout.matches) setChatOpen(false);
          } else if (event.action === 'progress') {
            buildingBubble.innerText = event.message || 'Still building…';
          } else if (event.action === 'save_error') {
            saveNote = ' (' + event.message + ')';
          } else if (event.action === 'done') {
            clearTimeout(slowNotice);
            buildingBubble.innerText = gotHtml
              ? 'Done — take a look.' + saveNote
              : "Didn't get a page back — try rephrasing that.";
          } else if (event.action === 'error') {
            clearTimeout(slowNotice);
            buildingBubble.innerText = 'Ran into an issue: ' + event.message;
          }
        }
      }
    } catch (err) {
      clearTimeout(slowNotice);
      if (err.name === 'AbortError') {
        buildingBubble.innerText = 'That build took too long and the connection was stopped. Try something simpler or build it in smaller steps.';
      } else {
        buildingBubble.innerText = 'Something went wrong reaching the room.';
      }
    } finally {
      clearTimeout(clientTimeout);
      chatStatus.innerText = 'READY';
      sendBtn.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
    }
  }

  sendBtn.addEventListener('click', () => sendMessage());
  chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  // ---- Live-edit widget bridge -------------------------------------------
  // The chat bubble injected into every generated page (see
  // injectLiveEditWidget in api/room-chat.js) posts a message here when
  // someone submits something from inside the iframe. Only accept
  // messages that actually came from our own canvas iframe.
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;
    const data = event.data;
    if (data && data.source === 'nexus-live-edit-widget' && typeof data.message === 'string') {
      sendMessage(data.message);
    }
  });
</script>

<script src="/nexus-shell.js"></script>
</body>
</html>
