<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Social Post Flow · Nexus</title>
<style>
:root{color-scheme:dark;--bg:#0b1413;--panel:#142321;--line:#35534e;--accent:#62ebce;--muted:#adbfba}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2faf7;font:16px/1.5 system-ui}header,main{max-width:1200px;margin:auto;padding:18px}header{border-bottom:1px solid var(--line)}h1{margin:10px 0;font-size:26px}h2{font-size:18px;margin:0 0 12px}p{color:var(--muted)}a{color:var(--accent)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button,input,textarea,select{font:inherit;max-width:100%}button,select,input,textarea{border:1px solid var(--line);border-radius:9px;background:#0b1916;color:inherit;padding:11px}button{min-height:46px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:var(--accent);color:#06241c;font-weight:700}button[aria-pressed=true]{outline:2px solid var(--accent)}:focus-visible{outline:3px solid #f6d775;outline-offset:3px}label{display:block;color:var(--muted);margin:10px 0}label input:not([type=checkbox]),textarea{display:block;width:100%;margin-top:4px}textarea{min-height:112px;resize:vertical}.sources{margin:20px 0}.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px;border-bottom:3px solid var(--accent);padding:0 0 26px}.branch{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.branch:after{content:'';height:27px;width:3px;background:var(--accent);position:absolute;bottom:-28px;left:50%}.connector{text-align:center;color:var(--accent);font-size:26px;line-height:30px}.batch,.destinations,.queue{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:0}.destinations{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.destinations button{flex:1;min-width:120px}.queue{margin:20px 0}.empty{padding:32px;border:1px dashed var(--line)}video{width:100%;max-height:320px;background:#000;border-radius:8px}.small{font-size:13px;color:var(--muted)}#message{position:sticky;top:0;z-index:2;padding:10px 18px;background:#1f3932;overflow-wrap:anywhere}#message:empty{display:none}.error{color:#ffbcb3}dialog{background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:12px;width:min(620px,94vw);max-height:85vh}dialog::backdrop{background:#000b}.choices{display:grid;gap:10px;margin:16px 0}.choices button{text-align:left;white-space:normal}.check{display:flex;gap:8px;align-items:center}.check input{width:22px;height:22px}#queueTitle{overflow-wrap:anywhere}@media(max-width:500px){header,main{padding:14px}.branch{padding:13px}.row>*{flex-grow:1}}
</style></head><body>
<header><div class="row"><a href="/board.html">← Board</a><a href="/tiktok-planner.html">Planner</a></div><h1>Social Post Flow</h1><p>Each video gets its own words. One batch, all your socials.</p><div class="row"><select id="batches" aria-label="Posting batch"></select><button id="newBatch">+ Batch</button></div></header>
<div id="message" role="status" aria-live="polite"></div>
<main><div class="row sources"><button id="addSaved" class="primary">+ Saved ads / videos</button><button id="upload">+ Upload videos</button><input id="files" hidden type="file" accept="video/*" multiple></div><section id="branches" class="branches" aria-label="Video branches"></section><div class="connector" aria-hidden="true">↓</div><section class="batch"><h2 id="summary">Your batch</h2><p class="small">Save each branch, choose a platform below, then work through its videos.</p></section><div class="connector" aria-hidden="true">↓</div><section id="destinations" class="destinations" aria-label="Social platforms"></section><section id="queue" class="queue" hidden></section></main><dialog id="picker"></dialog><script type="module" src="/social-post-flow.js"></script></body></html>
