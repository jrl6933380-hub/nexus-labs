<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Website ideas</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font:15px system-ui,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:2;padding:10px 14px;background:#111d;backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:15px;margin:0;font-weight:600} .tabs{display:flex;gap:6px}
.tabs button{background:#333;color:#fff;border:0;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
.tabs button[aria-pressed=true]{background:#fff;color:#111}
.track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;height:100%;padding-top:52px;box-sizing:border-box}
iframe{width:100%;height:100%;border:0;background:#fff}
p.m{padding:90px 20px;text-align:center}
.hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;opacity:.7;pointer-events:none}
</style></head><body>
<header><h1 id="t">Website ideas</h1><div class="tabs" id="tabs"></div></header>
<div class="track" id="track"></div><div class="hint" id="hint"></div>
<script>
(function(){
  var track=document.getElementById('track'),tabs=document.getElementById('tabs');
  var t=new URLSearchParams(location.search).get('t')||'';
  function msg(x){track.innerHTML='';var p=document.createElement('p');p.className='m';p.textContent=x;track.append(p);}
  fetch('/api/forge-demo?t='+encodeURIComponent(t),{credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'This demo link is not available.');return d;});}).then(function(d){
    document.getElementById('t').textContent=d.name?'Ideas for '+d.name:'Website ideas';document.title=document.getElementById('t').textContent;
    var btns=[];
    d.looks.forEach(function(l,i){
      var s=document.createElement('div');s.className='slide';var f=document.createElement('iframe');f.setAttribute('sandbox','');f.title=l.label;f.srcdoc=l.html;s.append(f);track.append(s);
      var b=document.createElement('button');b.type='button';b.textContent=l.label;b.addEventListener('click',function(){track.scrollTo({left:i*track.clientWidth,behavior:'smooth'});});tabs.append(b);btns.push(b);
    });
    function sync(){var i=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));btns.forEach(function(b,k){b.setAttribute('aria-pressed',String(k===i));});}
    track.addEventListener('scroll',sync,{passive:true});sync();
    document.getElementById('hint').textContent=d.looks.length>1?'Swipe sideways to see all '+d.looks.length+' looks':'';
  }).catch(function(e){msg(e.message);});
})();
</script></body></html>
