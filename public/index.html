<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Nexus — Venture Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05070c; }
  .board-summary, .agent-list, .room-list { padding: 14px; font: 13px/1.5 Inter, -apple-system, sans-serif; color: #e8eefb; }
  .board-summary h4, .agent-list h4, .room-list h4 {
    margin: 0 0 8px; font: 600 9px 'JetBrains Mono', monospace; text-transform: uppercase;
    letter-spacing: 0.16em; color: #5e6b81;
  }
  .board-summary .stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #ffffff0a; font-size: 12px; }
  .board-summary .stat-row span:last-child { font: 700 12px 'JetBrains Mono', monospace; color: #58d7ff; }
  .board-summary .messages { margin-top: 12px; }
  .board-summary .message { padding: 6px 0; font-size: 11px; color: #91a0b9; border-bottom: 1px solid #ffffff0a; }
  .board-summary .message .from { color: #58edb0; font-weight: 700; }
  .board-summary .empty, .agent-list .empty { color: #5e6b81; font-style: italic; font-size: 11px; }
  .board-summary .alert-banner {
    background: #ffc56b14; border: 1px solid #ffc56b44; border-radius: 8px; padding: 8px 10px;
    margin-bottom: 10px; font-size: 11px; color: #ffc56b; line-height: 1.5;
  }
  .board-summary .alert-banner strong { display: block; font: 700 9px 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .agent-list .agent-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #ffffff0a; }
  .agent-list .agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .agent-list .agent-dot.online { background: #58edb0; box-shadow: 0 0 8px #58edb0b0; }
  .agent-list .agent-dot.busy { background: #ffc56b; box-shadow: 0 0 8px #ffc56bb0; }
  .agent-list .agent-dot.available_on_demand { background: #4b8dff; box-shadow: 0 0 8px #4b8dffb0; }
  .agent-list .agent-dot.offline, .agent-list .agent-dot.disabled { background: #3c4a63; }
  .agent-list .agent-name { font-weight: 600; font-size: 12px; }
  .agent-list .agent-status { margin-left: auto; font: 600 9px 'JetBrains Mono', monospace; color: #5e6b81; text-transform: uppercase; letter-spacing: 0.05em; }
  .room-list a.room-link {
    display: block;
    padding: 9px 11px;
    margin-bottom: 6px;
    border-radius: 8px;
    background: #ffffff03;
    border: 1px solid #26334d;
    color: #e8eefb;
    text-decoration: none;
    font: 700 10px 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    transition: 0.18s;
  }
  .room-list a.room-link:hover { background: #4b8dff14; border-color: #4b8dff77; color: #58d7ff; }
  .room-list a.room-link small { display: block; font: 400 10px Inter, sans-serif; color: #91a0b9; margin-top: 3px; letter-spacing: 0; text-transform: none; }

  #nexus-canvas-backdrop-control {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 10000;
    display: flex;
    gap: 6px;
    background: #111827e8;
    border: 1px solid #3c5a84;
    border-radius: 10px;
    padding: 9px;
    backdrop-filter: blur(12px);
    box-shadow: 0 16px 40px #000a;
    font: 12px Inter, sans-serif;
  }
  #nexus-canvas-backdrop-control input {
    width: 220px;
    background: #ffffff08;
    border: 1px solid #26334d;
    border-radius: 6px;
    color: #e8eefb;
    padding: 6px 9px;
    font: 11px 'JetBrains Mono', monospace;
  }
  #nexus-canvas-backdrop-control input::placeholder { color: #5e6b81; }
  #nexus-canvas-backdrop-control button {
    background: #4b8dff18;
    border: 1px solid #4b8dff77;
    color: #58d7ff;
    border-radius: 6px;
    padding: 6px 12px;
    font: 700 9px 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: 0.18s;
  }
  #nexus-canvas-backdrop-control button:hover { background: #4b8dff32; }

  .board-summary, .agent-list, .room-list { padding: 18px; font-size: 14px; line-height: 1.5; }
  .board-summary h4, .agent-list h4, .room-list h4 {
    margin: 0 0 12px; color: var(--nx-muted); font: 600 10px var(--nx-mono);
    letter-spacing: .1em;
  }
  .room-list { display: grid; gap: 8px; }
  .room-list a.room-link {
    position: relative; display: grid; gap: 2px; min-height: 44px; box-sizing: border-box;
    margin: 0; padding: 11px 38px 11px 12px; border: 1px solid var(--nx-line);
    border-radius: 11px; background: rgba(255,255,255,.025); color: var(--nx-text);
    font: 650 13px var(--nx-sans); letter-spacing: 0;
  }
  .room-list a.room-link::after { content: '→'; position: absolute; right: 13px; top: 50%; translate: 0 -50%; color: var(--nx-faint); }
  .room-list a.room-link:hover, .room-list a.room-link:focus-visible {
    border-color: rgba(93,184,255,.42); background: rgba(93,184,255,.07); color: #d9efff; outline: none;
  }
  .room-list a.room-link small { margin: 0; color: var(--nx-muted); font: 400 11px var(--nx-sans); }
  .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .metric-card { min-width: 0; padding: 12px; border: 1px solid var(--nx-line); border-radius: 11px; background: rgba(255,255,255,.025); }
  .metric-card span { display: block; color: var(--nx-muted); font-size: 11px; white-space: nowrap; }
  .metric-card strong { display: block; margin-top: 4px; color: var(--nx-text); font: 650 22px/1.1 var(--nx-sans); }
  .board-summary .messages { margin-top: 18px; }
  .board-summary .message { padding: 9px 0; color: var(--nx-muted); font-size: 12px; line-height: 1.45; border-color: var(--nx-line); }
  .board-summary .message .from { color: var(--nx-text); font-weight: 650; }
  .board-summary .alert-banner { margin-bottom: 14px; padding: 11px 12px; border-radius: 11px; font-size: 12px; }
  .agent-list .agent-row { gap: 10px; min-height: 38px; padding: 7px 0; border-color: var(--nx-line); }
  .agent-list .agent-dot { width: 7px; height: 7px; box-shadow: none !important; }
  .agent-list .agent-name { color: var(--nx-text); font-size: 13px; }
  .agent-list .agent-status { color: var(--nx-muted); font: 500 9px var(--nx-mono); letter-spacing: .05em; }
  .board-summary .empty, .agent-list .empty { color: var(--nx-muted); font-size: 12px; }
  @media (max-width: 720px) {
    .board-summary, .agent-list, .room-list { padding: 16px; }
    .room-list a.room-link { min-height: 50px; }
  }
</style>
</head>
<body>
<script type="module">
  import { mountCanvas } from '/canvas-engine.js';
  import '/nex-chat-bar.js?v=20260912-2';

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = String(text ?? '');
    return div.innerHTML;
  }

  const canvas = mountCanvas({ canvasTitle: 'Venture Factory' });

  // Spaces are destinations, not previews. Every normal click opens the
  // requested workspace directly; only the explicit Room Builder entry may
  // open the Forge workspace at /room.html.
  const ROOMS = [
    { nav: 'Mission', title: 'Command Deck', detail: '/mission-control.html' },
    { nav: 'Conference', title: 'Conference Room', detail: '/conference-room.html' },
    { nav: 'Builder', title: 'Room Builder', detail: '/room.html' },
    { nav: 'Story', title: 'Story Studio', detail: '/story-studio.html' },
    { nav: 'Memory', title: 'Memory Archive', detail: '/memory.html' },
    { nav: 'Approvals', title: 'Approval Queue', detail: '/queue.html' },
    { nav: 'Connectors', title: 'Connector Bay', detail: '/connectors.html' },
    { nav: 'Tenants', title: 'Tenant Hub', detail: '/tenants.html' },
  ];

  const roomBody = document.createElement('div');
  roomBody.className = 'room-list';
  roomBody.innerHTML = `
    <h4>Rooms</h4>
    ${ROOMS.map((r) => `<a class="room-link" href="${escapeHtml(r.detail)}">${escapeHtml(r.title)}<small>${escapeHtml(r.nav)}</small></a>`).join('')}
  `;

  // Board summary panel — task counts + recent messages.
  const summaryBody = document.createElement('div');
  summaryBody.className = 'board-summary';
  summaryBody.innerHTML = '<span class="empty">Loading board…</span>';
  canvas.addPanel({ id: 'board-summary', title: 'Operations', content: summaryBody, x: 380, y: 80, w: 380, h: 360 });

  // Agent list panel — who's online right now.
  const agentBody = document.createElement('div');
  agentBody.className = 'agent-list';
  agentBody.innerHTML = '<span class="empty">Loading agents…</span>';
  canvas.addPanel({ id: 'agent-list', title: 'Agent Network', content: agentBody, x: 780, y: 80, w: 300, h: 280 });
  canvas.addPanel({ id: 'room-list', title: 'Spaces', content: roomBody, x: 80, y: 460, w: 280, h: 360 });

  // Builds a short, human summary of a system_status object (from
  // lib/systemMonitor.js, which piggybacks on this same poll) without
  // needing a server-formatted string — just the counts already present.
  function summarizeSystemStatus(status) {
    if (!status || !status.has_findings) return null;
    const parts = [];
    const boardCounts = status.board?.counts || {};
    const boardTotal = Object.values(boardCounts).reduce((sum, n) => sum + (n || 0), 0);
    if (boardTotal) parts.push(`${boardTotal} board issue${boardTotal === 1 ? '' : 's'}`);
    const collisions = status.pr_health?.file_collisions?.length || 0;
    if (collisions) parts.push(`${collisions} PR file collision${collisions === 1 ? '' : 's'}`);
    const stacked = status.pr_health?.stacked?.length || 0;
    if (stacked) parts.push(`${stacked} stacked PR${stacked === 1 ? '' : 's'}`);
    const crashes = status.crashes?.open_count || 0;
    if (crashes) parts.push(`${crashes} open crash${crashes === 1 ? '' : 'es'}`);
    return parts.length ? parts.join(', ') : 'something needs a look';
  }

  async function refreshLiveData() {
    try {
      const res = await fetch('/api/board', { headers: { Accept: 'application/json' }, cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();

      const t = data.telemetry || {};
      const messages = (data.messages || []).slice(0, 5);
      const alertSummary = summarizeSystemStatus(data.system_status);
      summaryBody.innerHTML = `
        ${alertSummary ? `<div class="alert-banner"><strong>Needs attention</strong>${escapeHtml(alertSummary)}</div>` : ''}
        <h4>Live board</h4>
        <div class="metric-grid">
          <div class="metric-card"><span>Total tasks</span><strong>${escapeHtml(t.total_tasks ?? 0)}</strong></div>
          <div class="metric-card"><span>Completed</span><strong>${escapeHtml(t.completed_tasks ?? 0)}</strong></div>
          <div class="metric-card"><span>Needs approval</span><strong>${escapeHtml(t.needs_approval ?? 0)}</strong></div>
          <div class="metric-card"><span>Active agents</span><strong>${escapeHtml(t.active_agents ?? 0)}</strong></div>
        </div>
        <div class="messages">
          <h4>Recent messages</h4>
          ${messages.length
            ? messages.map((m) => `<div class="message"><span class="from">${escapeHtml(m.from)}</span>: ${escapeHtml(m.message)}</div>`).join('')
            : '<span class="empty">No messages yet.</span>'}
        </div>
      `;

      const agents = data.agents || [];
      agentBody.innerHTML = `
        <h4>Agents</h4>
        ${agents.length
          ? agents.map((a) => `
              <div class="agent-row">
                <span class="agent-dot ${escapeHtml(a.status)}"></span>
                <span class="agent-name">${escapeHtml(a.display_name)}</span>
                <span class="agent-status">${escapeHtml(a.status)}</span>
              </div>
            `).join('')
          : '<span class="empty">No agents registered.</span>'}
      `;
    } catch {
      // Keep showing the last good render rather than blanking the panels.
    }
  }

  refreshLiveData();
  setInterval(refreshLiveData, 4000);

  // Backdrop control — the one manual control on this page. Not a
  // canvas panel itself (it's a tool, not content), so it stays fixed
  // in the corner rather than being draggable/resizable like the
  // content panels above it.
  const control = document.createElement('details');
  control.id = 'nexus-canvas-backdrop-control';
  control.innerHTML = `
    <summary>Appearance</summary>
    <div class="nexus-appearance-fields">
      <input type="url" id="backdropUrlInput" aria-label="Backdrop image URL" placeholder="Backdrop image URL…" />
      <button id="backdropApplyBtn" type="button">Apply</button>
    </div>
  `;
  document.body.appendChild(control);
  document.getElementById('backdropApplyBtn').addEventListener('click', () => {
    const input = document.getElementById('backdropUrlInput');
    canvas.setBackdropUrl(input.value.trim() || null);
  });
</script>
</body>
</html>
