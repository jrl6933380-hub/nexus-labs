<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>Nexus</title>
<style>
  html,body{height:100%;margin:0;background:#0e0e0e;color:#8f8b85;
    font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center}
  main{text-align:center;padding:24px}p{margin:0 0 16px}a{color:#f2f0ed;margin:0 8px}
</style>
</head>
<body>
  <main>
    <p id="status">Opening Nexus…</p>
    <a href="/forge.html">Open Nexus Forge</a>
    <a href="/nexus-login.html?next=%2Fworkspace.html">Owner access</a>
  </main>
<script>
  // The owner keeps the launch-station workflow. Everyone else — guest or
  // signed-in customer — lands in the Forge shell, which now admits guests and
  // asks for the account at the moment a build is requested. Routing guests to
  // the old builder was only ever a workaround for this page's old hard gate.
  (async () => {
    try {
      const owner = await fetch('/api/nexus-auth', {
        credentials: 'include', headers: { Accept: 'application/json' }, cache: 'no-store',
      });
      if (owner.ok) {
        location.replace('/workspace.html');
        return;
      }
    } catch {
      // The guest-capable Forge shell remains usable if the owner lookup is down.
    }
    location.replace('/forge.html');
  })();
</script>
</body>
</html>
