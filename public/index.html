<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>Nexus</title>
<!--
  Root now opens the chat-first workspace.

  Done as a redirect rather than by moving or deleting anything: the previous
  Thoughtspace overview still exists, unchanged, at /thoughtspace.html. If the
  new shell turns out to be worse in daily use, reverting is deleting this file
  and restoring the old index — no content has to be recovered, because none of
  it was thrown away.

  meta refresh plus a script redirect so it works with or without JS, and a real
  link in the body so a failed redirect still leaves somewhere to tap rather
  than a blank page.
-->
<meta http-equiv="refresh" content="0; url=/workspace.html" />
<script>location.replace('/workspace.html');</script>
<style>
  html,body{height:100%;margin:0;background:#0e0e0e;color:#8f8b85;
    font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center}
  a{color:#f2f0ed}
</style>
</head>
<body>
  <p>Opening the workspace… <a href="/workspace.html">continue</a></p>
</body>
</html>
