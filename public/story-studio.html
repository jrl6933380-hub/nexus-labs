<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus // Story Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/nexus-stark.css">
  <style>
    :root { --ink:#070910; --panel:#0f1420; --panel-2:#151c2a; --line:#29344a; --paper:#edf1f8; --muted:#8c98ae; --cyan:#58d7ff; --violet:#a879ff; --pink:#ff6fbd; --green:#58edb0; --amber:#ffc56b; }
    * { box-sizing:border-box; }
    html, body, #canvas-root { width:100%; height:100%; margin:0; overflow:hidden; background:var(--ink); color:var(--paper); font-family:Inter,-apple-system,sans-serif; }
    button, input, textarea, select { font:inherit; }
    button { cursor:pointer; }
    .nexus-canvas-panel[data-panel-id="story-studio"] { border-color:#a879ff73; box-shadow:0 25px 80px #000c, 0 0 50px #a879ff12; }
    .nexus-canvas-panel[data-panel-id="story-studio"] .nexus-canvas-panel-body { padding:0; overflow:hidden; }
    .studio { height:100%; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); background:radial-gradient(circle at 70% -15%,#a879ff24,transparent 35%),linear-gradient(145deg,#0d1220,#070910 65%); }
    .studio-top { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:15px; padding:12px 18px; border-bottom:1px solid var(--line); background:#090d16db; backdrop-filter:blur(16px); }
    .brand { display:flex; align-items:center; min-width:0; gap:11px; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--violet); border-radius:8px; color:var(--violet); font:700 13px 'JetBrains Mono'; box-shadow:0 0 18px #a879ff42; transform:rotate(-4deg); }
    .brand strong { display:block; font:700 13px 'JetBrains Mono'; letter-spacing:.12em; }
    .brand span { display:block; margin-top:3px; color:var(--muted); font:600 8px 'JetBrains Mono'; letter-spacing:.15em; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .credits { padding:8px 10px; border:1px solid #58edb044; border-radius:999px; color:var(--green); font:600 9px 'JetBrains Mono'; white-space:nowrap; }
    .link-btn, .ghost-btn, .primary-btn, .danger-btn { min-height:40px; border-radius:8px; border:1px solid var(--line); background:#121928; color:var(--paper); padding:9px 12px; text-decoration:none; font:600 10px 'JetBrains Mono'; letter-spacing:.04em; }
    .link-btn:hover, .ghost-btn:hover { border-color:#58d7ff88; }
    .primary-btn { border-color:#a879ff9e; background:linear-gradient(135deg,#7546d7,#a957b3); box-shadow:0 10px 30px #7d45c22e; }
    .primary-btn:disabled, .ghost-btn:disabled { cursor:not-allowed; opacity:.48; }
    .danger-btn { color:#ff9ab4; border-color:#ff6fbd42; background:#ff6fbd0c; }
    .workspace { min-height:0; display:grid; grid-template-columns:minmax(260px,320px) minmax(420px,1fr) minmax(230px,280px); }
    .rail { min-height:0; overflow:auto; padding:18px; background:#0a0f19db; }
    .rail.left { border-right:1px solid var(--line); }
    .rail.right { border-left:1px solid var(--line); }
    .eyebrow { color:var(--violet); font:700 9px 'JetBrains Mono'; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:9px 0 7px; font:700 25px 'JetBrains Mono'; letter-spacing:-.055em; }
    .intro { margin:0 0 18px; color:var(--muted); font-size:12px; line-height:1.55; }
    label { display:block; margin:14px 0 6px; color:#b9c4d7; font:600 9px 'JetBrains Mono'; letter-spacing:.08em; text-transform:uppercase; }
    input[type="text"], textarea, select { width:100%; border:1px solid var(--line); border-radius:9px; background:#0d1320; color:var(--paper); padding:11px; outline:none; }
    input:focus, textarea:focus, select:focus { border-color:var(--violet); box-shadow:0 0 0 3px #a879ff17; }
    textarea { min-height:190px; resize:vertical; line-height:1.48; }
    .upload { display:flex; align-items:center; justify-content:center; min-height:44px; border:1px dashed #53627c; border-radius:9px; color:#bdc8da; background:#ffffff03; font-size:11px; cursor:pointer; }
    .upload:hover { border-color:var(--cyan); color:var(--cyan); }
    .upload input { position:absolute; opacity:0; pointer-events:none; }
    .count { display:flex; justify-content:space-between; margin-top:6px; color:#69768d; font:500 8px 'JetBrains Mono'; }
    .rights { display:grid; grid-template-columns:auto 1fr; gap:9px; align-items:start; margin:14px 0; padding:11px; border:1px solid var(--line); border-radius:9px; background:#ffffff03; }
    .rights input { width:17px; height:17px; margin:1px 0 0; accent-color:var(--violet); }
    .rights span { color:#9eabc0; font-size:10px; line-height:1.5; }
    .generate { width:100%; min-height:46px; }
    .status { min-height:34px; margin-top:9px; padding:8px 10px; border-radius:8px; color:var(--muted); font:500 9px 'JetBrains Mono'; line-height:1.5; }
    .status[data-state="busy"] { color:var(--cyan); background:#58d7ff0a; }
    .status[data-state="error"] { color:#ff9ab4; background:#ff6fbd0a; }
    .status[data-state="success"] { color:var(--green); background:#58edb00a; }
    .stage { min-width:0; min-height:0; overflow:auto; padding:22px clamp(15px,3vw,34px) 50px; }
    .empty-stage { min-height:100%; display:grid; place-items:center; text-align:center; border:1px dashed #344159; border-radius:18px; padding:28px; background:linear-gradient(145deg,#101726aa,#0a0e17aa); }
    .empty-stage strong { display:block; font:700 clamp(22px,4vw,38px) 'JetBrains Mono'; letter-spacing:-.06em; }
    .empty-stage p { max-width:460px; color:var(--muted); font-size:13px; line-height:1.6; }
    .page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin-bottom:18px; }
    .page-head h2 { margin:6px 0 0; font:700 clamp(20px,3vw,32px) 'JetBrains Mono'; letter-spacing:-.05em; }
    .page-head p { max-width:620px; margin:8px 0 0; color:#9ca9bd; font-size:12px; line-height:1.55; }
    .page-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
    .comic-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .comic-panel { min-width:0; overflow:hidden; border:1px solid #45536c; border-radius:13px; background:#0a0e17; box-shadow:0 15px 35px #0006; }
    .panel-art { position:relative; min-height:260px; padding:16px; display:flex; align-items:flex-end; isolation:isolate; overflow:hidden; background:linear-gradient(145deg,var(--panel-a),var(--panel-b)); }
    .panel-art:not(.has-image)::before { content:""; position:absolute; inset:-25%; z-index:-2; background:radial-gradient(circle at 70% 25%,var(--panel-c),transparent 28%),linear-gradient(115deg,transparent 43%,#ffffff0a 44% 46%,transparent 47%); transform:rotate(calc(var(--panel-index) * 7deg)); }
    .panel-art:not(.has-image)::after { content:""; position:absolute; z-index:-1; width:45%; aspect-ratio:.72; left:28%; bottom:-12%; border-radius:48% 48% 16% 16%; background:#05070bbd; box-shadow:-95px 30px 0 -28px #0709109e,95px 42px 0 -34px #0709109e; filter:drop-shadow(0 0 24px #000); }
    .panel-art.has-image::after { content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,#05081108 55%,#05081138 100%); }
    .scene-plate { position:absolute; inset:0; z-index:0; overflow:hidden; transform-origin:center; will-change:transform; }
    .panel-image { position:absolute; inset:0; z-index:0; width:100%; height:100%; object-fit:cover; }
    .scene-actor-layer { position:absolute; inset:0; z-index:1; pointer-events:none; }
    .scene-actor { position:absolute; transform-origin:center bottom; object-fit:contain; filter:drop-shadow(0 8px 12px #0008); will-change:transform,opacity; }
    .shot { position:absolute; z-index:2; top:13px; right:13px; max-width:65%; text-align:right; color:#dce5f4; font:600 8px 'JetBrains Mono'; letter-spacing:.08em; text-transform:uppercase; text-shadow:0 2px 8px #000; }
    .art-copy { position:relative; z-index:2; width:100%; padding:9px 10px; border-left:2px solid var(--cyan); background:#050811d9; backdrop-filter:blur(8px); }
    .art-copy b { display:block; font:700 11px 'JetBrains Mono'; }
    .art-copy span { display:block; margin-top:4px; color:#aab6ca; font-size:9px; line-height:1.4; }
    .panel-copy { padding:13px; display:grid; gap:9px; }
    .visual-btn { justify-self:start; min-height:34px; padding:7px 10px; color:var(--cyan); }
    .visual-btn[data-ready="true"] { color:var(--green); border-color:#58edb04f; }
    .panel-copy label { margin:0 0 4px; font-size:8px; }
    .panel-copy textarea { min-height:66px; padding:9px; font-size:11px; }
    .bubble-layer { position:absolute; inset:0; z-index:3; display:grid; grid-template-rows:repeat(3,minmax(0,1fr)); row-gap:6px; padding:48px 12px 76px; pointer-events:none; }
    .comic-bubble { position:relative; width:fit-content; min-width:min(20%,90px); padding:7px 10px; border:2px solid #111827; border-radius:17px; background:#fff; color:#111827; box-shadow:0 4px 0 #11182766,0 8px 22px #0007; font-size:10px; line-height:1.3; overflow-wrap:normal; word-break:normal; hyphens:none; }
    .comic-bubble.zone-0 { grid-row:1; align-self:start; }
    .comic-bubble.zone-1 { grid-row:2; align-self:center; }
    .comic-bubble.zone-2 { grid-row:3; align-self:end; }
    .comic-bubble[data-side="left"] { justify-self:start; }
    .comic-bubble[data-side="right"] { justify-self:end; }
    .comic-bubble.bubble-sm { max-width:min(26%,145px); }
    .comic-bubble.bubble-md { max-width:min(34%,190px); }
    .comic-bubble.bubble-lg { max-width:min(44%,245px); }
    .comic-bubble[data-positioned="true"] { position:absolute; left:calc(var(--bubble-x) * 1%); top:calc(var(--bubble-y) * 1%); width:calc(var(--bubble-width) * 1%); max-width:calc(var(--bubble-width) * 1%); justify-self:auto; align-self:auto; opacity:var(--bubble-opacity,1); transform:scale(var(--bubble-scale,1)); transform-origin:center; }
    .panel-art .comic-bubble { pointer-events:none; }
    .comic-bubble::after { content:""; position:absolute; left:17px; bottom:-9px; width:13px; height:13px; border-right:2px solid #111827; border-bottom:2px solid #111827; background:#fff; transform:skew(-24deg) rotate(35deg); }
    .comic-bubble[data-side="right"]::after { left:auto; right:17px; transform:skew(24deg) rotate(55deg); }
    .comic-bubble[data-positioned]::after,.comic-bubble[data-positioned][data-side="right"]::after { left:calc(var(--bubble-tail-offset,20) * 1%); right:auto; }
    .comic-bubble[data-type="thought"] { border-radius:999px; border-style:dashed; }
    .comic-bubble[data-type="thought"]::after { width:8px; height:8px; bottom:-11px; border:2px solid #111827; border-radius:50%; transform:none; left:17px; }
    .comic-bubble[data-type="thought"][data-side="right"]::after { left:auto; right:17px; }
    .comic-bubble[data-type="shout"] { border-radius:5px; border-color:#ff4f87; box-shadow:0 4px 0 #ff4f8766,0 8px 22px #0007; font-weight:800; text-transform:uppercase; }
    .comic-bubble b { display:block; margin-bottom:2px; color:#7546d7; font:800 7px 'JetBrains Mono'; letter-spacing:.08em; text-transform:uppercase; }
    .dialogue-editor { display:grid; gap:8px; }
    .dialogue-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .dialogue-head label { margin:0; }
    .dialogue-help { margin:0; color:#7f8ca2; font-size:9px; line-height:1.45; }
    .dialogue-list { display:grid; gap:8px; }
    .dialogue-item { padding:9px; border:1px solid #344159; border-radius:9px; background:#080d17; }
    .dialogue-meta { display:grid; grid-template-columns:minmax(78px,1fr) minmax(76px,.65fr) minmax(64px,.55fr) auto; gap:6px; align-items:center; }
    .dialogue-item input, .dialogue-item select, .dialogue-item textarea { min-width:0; font-size:10px; padding:8px; }
    .dialogue-item textarea { min-height:58px; margin-top:7px; resize:vertical; }
    .bubble-tools { display:flex; justify-content:flex-end; margin-top:6px; }
    .reset-bubble { min-height:28px; padding:5px 8px; border:1px solid #53627c; border-radius:7px; background:#111827; color:#9edfff; font:600 8px 'JetBrains Mono'; }
    .remove-bubble { width:34px; height:34px; border:1px solid #ff6fbd42; border-radius:7px; background:#ff6fbd0c; color:#ff9ab4; }
    .add-bubble { min-height:30px; padding:6px 9px; color:var(--cyan); }
    .no-dialogue { padding:10px; border:1px dashed #344159; border-radius:8px; color:#77849a; font-size:9px; text-align:center; }
    .completion-bar { margin-top:18px; padding:16px; display:flex; align-items:center; justify-content:space-between; gap:16px; border:1px solid #58edb05e; border-radius:13px; background:linear-gradient(125deg,#58edb010,#a879ff12); }
    .completion-bar b { display:block; font:700 13px 'JetBrains Mono'; }
    .completion-bar span { display:block; margin-top:4px; color:#91a0b6; font-size:10px; }
    .comic-reader { width:min(1180px,calc(100vw - 24px)); height:min(92vh,980px); max-width:none; max-height:none; margin:auto; padding:0; border:1px solid #53627c; border-radius:18px; background:#080b12; color:var(--paper); box-shadow:0 40px 120px #000; }
    .comic-reader::backdrop { background:#02040ad9; backdrop-filter:blur(8px); }
    .reader-shell { height:100%; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr); }
    .reader-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 18px; border-bottom:1px solid var(--line); background:#0e1420f5; }
    .reader-head h2 { margin:3px 0 0; font:700 19px 'JetBrains Mono'; }
    .reader-scroll { overflow:auto; padding:clamp(14px,3vw,34px); background:radial-gradient(circle at 50% 0,#a879ff18,transparent 38%),#070910; }
    .reader-page { width:min(920px,100%); margin:0 auto; padding:clamp(10px,2vw,22px); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; border:1px solid #3d4960; border-radius:12px; background:#e9e3d5; box-shadow:0 22px 70px #000a; }
    .reader-panel { position:relative; min-height:clamp(260px,38vw,430px); overflow:hidden; border:3px solid #111827; background:#151c2a; }
    .reader-panel:first-child, .reader-panel:last-child { grid-column:1/-1; min-height:clamp(280px,42vw,480px); }
    .reader-panel .panel-image { filter:saturate(1.08) contrast(1.03); }
    .reader-panel .bubble-layer { inset:0; padding:18px 14px 82px; }
    .reader-panel .comic-bubble { pointer-events:none; cursor:default; }
    .reader-panel .comic-bubble { font-size:clamp(10px,1.4vw,14px); }
    .reader-caption { position:absolute; z-index:4; left:12px; right:12px; bottom:12px; padding:9px 11px; border:2px solid #111827; background:#fff5ca; color:#141925; box-shadow:3px 3px 0 #111827; font:600 10px/1.4 'JetBrains Mono'; }
    .reader-end { grid-column:1/-1; padding:22px; text-align:center; color:#111827; font:800 12px 'JetBrains Mono'; letter-spacing:.12em; }
    .character-list, .project-list { display:grid; gap:8px; margin-top:10px; }
    .character, .project-card { padding:10px; border:1px solid var(--line); border-radius:9px; background:#0d1320; }
    .character b, .project-card b { display:block; font:700 10px 'JetBrains Mono'; color:#e8eef9; }
    .character span, .project-card span { display:block; margin-top:4px; color:#8491a7; font-size:9px; line-height:1.45; }
    .project-card { width:100%; text-align:left; color:inherit; }
    .project-card:hover, .project-card.active { border-color:var(--violet); background:#a879ff0b; }
    .library-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .library-head h2 { margin:0; font:700 12px 'JetBrains Mono'; }
    .tiny-btn { border:0; background:transparent; color:var(--cyan); padding:5px; font:600 9px 'JetBrains Mono'; }
    .section { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
    .section h3 { margin:0; color:#b7c3d6; font:700 9px 'JetBrains Mono'; letter-spacing:.12em; text-transform:uppercase; }
    .privacy { color:#6f7d93; font-size:9px; line-height:1.5; }
    @media (max-width:1000px) { .workspace { grid-template-columns:280px minmax(400px,1fr); } .rail.right { grid-column:1/-1; border-left:0; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:18px; } }
    @media (max-width:720px) { html,body,#canvas-root { overflow:hidden; } .studio-top { min-height:58px; padding:9px 11px; } .brand span,.credits { display:none; } .link-btn { padding:9px; } .workspace { display:block; overflow:auto; } .rail.left,.rail.right,.stage { overflow:visible; } .rail.left { border-right:0; border-bottom:1px solid var(--line); padding:15px; } .stage { padding:16px 12px 30px; } .rail.right { display:block; padding:15px; } .comic-grid { grid-template-columns:1fr; } .page-head { align-items:flex-start; flex-direction:column; } .page-actions { justify-content:flex-start; } textarea { min-height:150px; } .panel-art { min-height:270px; } .completion-bar { align-items:flex-start; flex-direction:column; } .dialogue-meta { grid-template-columns:minmax(70px,1fr) 72px 64px 34px; } .comic-reader { width:100vw; height:100dvh; border:0; border-radius:0; } .reader-head { padding:11px 12px; } .reader-page { grid-template-columns:1fr; gap:7px; padding:8px; border-radius:8px; } .reader-panel,.reader-panel:first-child,.reader-panel:last-child { grid-column:1; min-height:360px; } .reader-scroll { padding:8px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
  </style>
</head>
<body>
  <div id="canvas-root"></div>
  <script type="module">
    import { mountCanvas } from '/canvas-engine.js';
    import { normalizeLetteringTimeline, posterLetteringFrames, sampleLetteringTimeline } from '/story-lettering-runtime.js';
    import { normalizeStoryScene, sampleStoryScene } from '/story-scene-runtime.js';

    const canvas = mountCanvas({ canvasId:'story-studio', canvasTitle:'Story Studio' });
    const studio = document.createElement('main');
    studio.className = 'studio';
    studio.innerHTML = `
      <header class="studio-top">
        <div class="brand"><i class="brand-mark">NS</i><div><strong>NEXUS STORY STUDIO</strong><span>WRITING → COMIC CONTINUITY</span></div></div>
        <div class="top-actions"><span class="credits" id="credits">Credits loading…</span></div>
      </header>
      <div class="workspace">
        <aside class="rail left">
          <div class="eyebrow">Chapter intake</div><h1>Shape the first issue.</h1>
          <p class="intro">Paste one chapter. Nex will lock the cast, build six sets, direct every performance, and deliver the finished comic.</p>
          <label for="source-title">Chapter title</label><input id="source-title" type="text" maxlength="120" placeholder="Chapter 1 — The Signal">
          <label class="upload" for="source-file">Upload .txt or .md chapter<input id="source-file" type="file" accept=".txt,.md,text/plain,text/markdown"></label>
          <label for="source-text">Writing</label><textarea id="source-text" maxlength="30000" placeholder="Paste at least 100 characters from one chapter…"></textarea>
          <div class="count"><span id="source-count">0 characters</span><span>30,000 max</span></div>
          <label for="visual-style">Visual direction</label>
          <select id="visual-style"><option value="cinematic graphic novel">Cinematic graphic novel</option><option value="bold modern superhero comic">Modern superhero</option><option value="warm hand-inked adventure comic">Hand-inked adventure</option><option value="high-contrast noir comic">High-contrast noir</option><option value="bright all-ages animated comic">All-ages animated</option></select>
          <label class="rights"><input id="rights-confirmed" type="checkbox"><span>I confirm this is my writing, public domain, licensed, or otherwise cleared for adaptation.</span></label>
          <button class="primary-btn generate" id="generate-btn" type="button">Generate comic sequence</button>
          <div class="status" id="status" role="status" aria-live="polite">Ready for your first chapter.</div>
        </aside>
        <section class="stage" id="stage">
          <div class="empty-stage"><div><div class="eyebrow">Nex Story Editor</div><strong>One chapter.<br>One living stage.</strong><p>Nex locks the cast, builds each set, directs the actors, and delivers a fully lettered six-panel comic.</p></div></div>
        </section>
        <aside class="rail right">
          <div><div class="library-head"><h2>PROJECT LIBRARY</h2><button class="tiny-btn" id="new-btn" type="button">+ New</button></div><div class="project-list" id="project-list"><p class="privacy">Loading private projects…</p></div></div>
          <div class="section"><h3>Finished by Nex</h3><p class="privacy">Nex handles composition, character continuity, dialogue, and lettering so each saved project opens as a finished comic.</p></div>
          <div class="section"><h3>Rights & privacy</h3><p class="privacy">Your chapter and project are stored inside your private Nexus account and sent to the configured AI provider only to create this adaptation. Delete removes the saved Story Studio project.</p></div>
        </aside>
      </div>`;
    canvas.addPanel({ id:'story-studio', title:'Story Studio', content:studio, locked:true });

    const reader = document.createElement('dialog');
    reader.className = 'comic-reader';
    reader.setAttribute('aria-labelledby','reader-title');
    reader.innerHTML = '<div class="reader-shell"><header class="reader-head"><div><div class="eyebrow">Finished comic preview</div><h2 id="reader-title">Comic reader</h2></div><button class="ghost-btn" id="reader-close" type="button">Close reader</button></header><div class="reader-scroll" id="reader-scroll"></div></div>';
    document.body.append(reader);
    reader.querySelector('#reader-close').addEventListener('click',() => reader.close());
    reader.addEventListener('click',(event) => { if (event.target === reader) reader.close(); });
    reader.addEventListener('close',stopReaderAnimation);

    const els = Object.fromEntries([
      ['credits','credits'],
      ['sourceTitle','source-title'],
      ['sourceFile','source-file'],
      ['sourceText','source-text'],
      ['sourceCount','source-count'],
      ['visualStyle','visual-style'],
      ['rightsConfirmed','rights-confirmed'],
      ['generateBtn','generate-btn'],
      ['status','status'],
      ['stage','stage'],
      ['projectList','project-list'],
      ['newBtn','new-btn'],
    ].map(([key,id]) => [key, document.getElementById(id)]));

    function letteringFrames(panel,timeMs=null) {

    function createBubbleLayer(panel,timeMs=null) {

    function previewLayout(entry,index) {

    function wrapCanvasText(context,text,maxWidth) {

    function drawPreviewBubble(context,entry,index) {

    async function buildLetteringPreview(panel,index,{includeLettering=true}={}) {

    async function reviewPanelLettering(index) {

    async function request(url, options={}) {

    function openReader() {

    function stopReaderAnimation() {

        if (!reader.open || !currentProject) return stopReaderAnimation();
        if (!readerAnimationStartedAt) readerAnimationStartedAt = now;
        if (now - readerLastPaintAt >= 100) {
          readerLastPaintAt = now;
          reader.querySelectorAll('.reader-panel[data-panel-index]').forEach((frame) => {
            const index = Number(frame.dataset.panelIndex);
            const panel = currentProject.comic?.panels?.[index];
            if (!panel) return;
            const scene = normalizeStoryScene(panel.scene,{characters:currentProject.comic.characters,dialogue:panel.dialogue,durationMs:panel.durationMs});
            const timeMs = (now - readerAnimationStartedAt) % scene.durationMs;

    function renderProject() {

      document.body.dataset.storyProjectId = currentProject.id;
      const comic = currentProject.comic;
      els.stage.replaceChildren();
      const head = document.createElement('header'); head.className = 'page-head';
      const intro = document.createElement('div');
      const eye = document.createElement('div'); eye.className = 'eyebrow'; eye.textContent = [comic.genre, `${comic.panels.length} panels`].filter(Boolean).join(' · ');

    async function generate() {
      const sourceText = els.sourceText.value.trim();
      if (sourceText.length < 100) return setStatus('Add at least 100 characters from one chapter.','error');
      if (!els.rightsConfirmed.checked) return setStatus('Confirm that you have the right to adapt this writing.','error');
      els.generateBtn.disabled = true; setStatus('Nex is finding the strongest beats and locking continuity…','busy');
      try {
        const data = await request('/api/story-studio',{ method:'POST', body:JSON.stringify({ action:'generate', sourceTitle:els.sourceTitle.value.trim(), sourceText, visualStyle:els.visualStyle.value, rightsConfirmed:true }) });
        currentProject = data.project; renderProject(); await loadProjects(); await prepareCast(); await illustrateAll(); await refreshCredits();
      } catch (error) { setStatus(error.message,'error'); }

    }

    async function prepareCast() {

      setStatus('Nex is locking the cast likenesses and wardrobe…','busy');
      try {
        let data;
        for (let batch = 0; batch < 4; batch += 1) {
          data = await request('/api/story-studio',{method:'POST',body:JSON.stringify({action:'prepare-cast',projectId})});
          if (currentProject?.id !== projectId) return;
          currentProject = data.project; renderProject();
          if (data.ready) break;

      } catch (error) {

      }
    }

    async function illustratePanel(index,{ partOfSequence=false }={}) {
      if (!currentProject) return {ok:false,complete:false};
      if (visualQueueActive && !partOfSequence) { setStatus('Nex is already staging this comic.','busy'); return {ok:false,complete:false}; }
      const projectId = currentProject.id;
      if (!partOfSequence) setStatus(`Painting panel ${index + 1}…`,'busy');
      try {
        const data = await request('/api/story-studio',{ method:'POST', body:JSON.stringify({ action:'illustrate', projectId, panelIndex:index, comic:currentProject.comic }) });
        if (currentProject?.id === projectId) { currentProject = data.project; renderProject(); }
        try { await reviewPanelLettering(index); }
        catch (reviewError) { console.error('Nex lettering review failed',reviewError); }
        if (!partOfSequence) {
          await loadProjects(); await refreshCredits();
          const retryMessage = data.needsSetRetry
            ? `Nex saved panel ${index + 1} and will repaint one set artifact.`
            : `Nex saved the set and will retry a missing actor in panel ${index + 1}.`;
          setStatus(data.complete ? `Panel ${index + 1} staged and saved.` : retryMessage,data.complete ? 'success' : 'busy');
        }
        return {ok:true,complete:data.complete !== false,needsSetRetry:data.needsSetRetry === true};
      } catch (error) {
        setStatus(error.message,'error');
        return {ok:false,complete:false};
      }
    }

    async function illustrateAll() {
      if (!currentProject || visualQueueActive) return;
      const initiallyMissing = currentProject.comic.panels.map((panel,index) => panelReady(panel) ? -1 : index).filter((index) => index >= 0);
      if (!initiallyMissing.length) { setStatus('Comic world staged, directed, and saved.','success'); return; }
      visualQueueActive = true; renderProject();
      for (let round = 0; round < 2; round += 1) {
        const missing = currentProject.comic.panels.map((panel,index) => panelReady(panel) ? -1 : index).filter((index) => index >= 0);
        if (!missing.length) break;
        for (let position = 0; position < missing.length; position += 1) {
          const index = missing[position];
          const verb = round ? 'Polishing' : 'Staging';
          setStatus(`${verb} scene ${position + 1} of ${missing.length}. Dressing the set and directing the cast…`,'busy');
          await illustratePanel(index,{partOfSequence:true});
        }
      }
      visualQueueActive = false; renderProject(); await loadProjects();
      const remaining = currentProject.comic.panels.filter((panel) => !panelReady(panel)).length;
      if (!remaining) setStatus('Comic world staged, directed, and saved.','success');
      else setStatus(`Nex preserved every finished layer. ${remaining} scene${remaining === 1 ? '' : 's'} can retry without restarting the comic.`,'error');
    }

    async function loadProject(id) {
      setStatus('Loading project…','busy');
      if (visualQueueActive) return setStatus('Let Nex finish staging this comic before switching projects.','busy');
      try { currentProject = (await request('/api/story-studio?id=' + encodeURIComponent(id))).project; renderProject(); await loadProjects(); setStatus('Project loaded.','success'); }
      catch (error) { setStatus(error.message,'error'); }
    }

    async function loadProjects() {
      try {
        const { projects } = await request('/api/story-studio'); els.projectList.replaceChildren();
        if (!projects.length) { els.projectList.innerHTML = '<p class="privacy">No Story Studio projects yet.</p>'; return; }
        projects.forEach((project) => { const button = document.createElement('button'); button.type = 'button'; button.className = 'project-card' + (project.id === currentProject?.id ? ' active' : ''); const title = document.createElement('b'); title.textContent = project.comicTitle; const meta = document.createElement('span'); meta.textContent = `${project.panelCount} panels · ${formatWhen(project.updatedAt)}`; button.append(title,meta); button.addEventListener('click',() => loadProject(project.id)); els.projectList.append(button); });
      } catch (error) { if (error.message !== 'Sign in required') els.projectList.innerHTML = '<p class="privacy">Could not load projects.</p>'; }
    }

    async function refreshNexDirection() {
      if (!currentProject || visualQueueActive || document.visibilityState !== 'visible') return;
      try {
        const projectId = currentProject.id;
        const latest = (await request('/api/story-studio?id=' + encodeURIComponent(projectId))).project;
        if (!latest || latest.id !== projectId || Number(latest.updatedAt) <= Number(currentProject.updatedAt)) return;
        const readerWasOpen = reader.open;
        currentProject = latest;
        renderProject();
        if (readerWasOpen) openReader();
        setStatus('Nex’s latest actor direction is live.','success');
      } catch (error) {
        console.error('Could not refresh Nex actor direction',error);
      }
    }

    async function deleteCurrent() {
      if (!currentProject || !confirm('Delete this Story Studio project? This cannot be undone.')) return;
      try { await request('/api/story-studio?id=' + encodeURIComponent(currentProject.id),{ method:'DELETE' }); resetStudio(); await loadProjects(); setStatus('Project deleted.','success'); }
      catch (error) { setStatus(error.message,'error'); }
    }

    function resetStudio() { if (visualQueueActive) return setStatus('Let Nex finish staging this comic first.','busy'); currentProject = null; delete document.body.dataset.storyProjectId; els.sourceTitle.value = ''; els.sourceText.value = ''; els.rightsConfirmed.checked = false; els.stage.innerHTML = '<div class="empty-stage"><div><div class="eyebrow">Nex Story Editor</div><strong>One chapter.<br>One living stage.</strong><p>Nex locks the cast, builds each set, directs the actors, and delivers a fully lettered six-panel comic.</p></div></div>'; updateCount(); setStatus('Ready for a new chapter.'); }
    function updateCount() { els.sourceCount.textContent = `${els.sourceText.value.length.toLocaleString()} characters`; }
    async function refreshCredits() { try { const response = await fetch('/api/room-usage',{cache:'no-store'}); if (!response.ok) return; const data = await response.json(); els.credits.textContent = `${data.usage.remaining} credits left`; } catch {} }

    els.sourceText.addEventListener('input',updateCount); els.generateBtn.addEventListener('click',generate); els.newBtn.addEventListener('click',resetStudio);
    els.sourceFile.addEventListener('change',async () => { const file = els.sourceFile.files?.[0]; if (!file) return; if (file.size > 100000) return setStatus('Keep text files under 100 KB for this first version.','error'); els.sourceText.value = (await file.text()).slice(0,30000); if (!els.sourceTitle.value) els.sourceTitle.value = file.name.replace(/\.(txt|md)$/i,''); updateCount(); setStatus('Chapter loaded. Confirm rights, then generate.','success'); });
    fetch('/api/room-auth',{cache:'no-store'}).then((response) => { if (!response.ok) location.href = '/room-login.html?next=/story-studio.html'; else { loadProjects(); refreshCredits(); } }).catch(() => setStatus('Could not verify your session.','error'));
    setInterval(refreshNexDirection,4000);
  </script>
</body>
